<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARATHON // UPGRADE TRACKER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   MARATHON // UPGRADE TRACKER — main.css  v9
   ═══════════════════════════════════════════════════ */

:root {
  --bg:        #06090e;
  --bg1:       #0b1118;
  --bg2:       #111820;
  --bg3:       #182030;
  --border:    #1c2a36;
  --border2:   #283848;
  --text:      #c0d0e0;
  --text-dim:  #5a7585;
  --text-dead: #2e4050;
  --cyan:      #00e5ff;
  --green:     #39ff14;
  --purple:    #bf5af2;
  --orange:    #ff6d00;
  --red:       #ff3366;
  --yellow:    #ffd600;
  --blue:      #4a9eff;
  --radius:    4px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 1rem;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 60% 40% at 0% 0%, rgba(0,229,255,.035) 0, transparent 100%),
    radial-gradient(ellipse 50% 60% at 100% 100%, rgba(191,90,242,.025) 0, transparent 100%);
}

/* ── HEADER ─────────────────────────────── */
#hdr {
  height: 56px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  background: rgba(6,9,14,.92);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 300;
  backdrop-filter: blur(20px);
}

.logo {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: 1.2rem;
  color: var(--cyan);
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(0,229,255,.4);
  white-space: nowrap;
  flex-shrink: 0;
}
.logo sub { font-size: .55rem; color: var(--text-dead); letter-spacing: 2px; }

.hstats {
  display: flex;
  gap: 20px;
  align-items: center;
}
.hs      { text-align: center; }
.hs .v   { font-size: 1.25rem; font-weight: 700; display: block; line-height: 1; }
.hs .l   { font-size: .72rem; color: var(--text-dead); letter-spacing: 1.5px; margin-top: 2px; display: block; text-transform: uppercase; }
.hs-hoverable { cursor: help; }

.hdr-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

/* ── SAVE MENU ──────────────────────────── */
.save-menu { position: relative; }
.save-menu-btn {
  font-size: .85rem; letter-spacing: 1px; padding: 8px 14px;
  border: 1px solid var(--border2); cursor: pointer;
  background: transparent; font-family: inherit; color: var(--text-dim);
  transition: all .2s; display: flex; align-items: center; gap: 4px;
}
.save-menu-btn:hover,
.save-menu:hover .save-menu-btn { border-color: var(--green); color: var(--green); background: rgba(57,255,20,.06); }
.save-menu-btn::after { content: " ▾"; font-size: .65rem; }
.save-dropdown {
  display: none; position: absolute; top: calc(100% + 4px); right: 0; z-index: 500;
  background: var(--bg1); border: 1px solid var(--border2); min-width: 170px;
  box-shadow: 0 8px 32px rgba(0,0,0,.7);
}
.save-menu:hover .save-dropdown { display: block; }
.save-dropdown button {
  display: block; width: 100%; text-align: left; padding: 11px 16px;
  background: transparent; border: none; border-bottom: 1px solid var(--border);
  cursor: pointer; font-family: inherit; font-size: .88rem; color: var(--text);
  transition: background .15s;
}
.save-dropdown button:last-child { border-bottom: none; }
.save-dropdown button:hover { background: rgba(255,255,255,.04); color: var(--green); }

/* ── BUTTONS ────────────────────────────── */
.btn {
  font-size: .88rem; letter-spacing: .5px; padding: 8px 16px;
  border: 1px solid; cursor: pointer; background: transparent;
  transition: all .2s; font-family: inherit; white-space: nowrap;
  border-radius: var(--radius);
}
.btn:hover { opacity: .85; }
.br { border-color: var(--red);    color: var(--red);    }
.bg { border-color: var(--green);  color: var(--green);  }
.by { border-color: var(--yellow); color: var(--yellow); }
.bb { border-color: var(--blue);   color: var(--blue);   }
.bc { border-color: var(--cyan);   color: var(--cyan);   }
.br:hover { background: rgba(255,51,102,.1);  }
.bg:hover { background: rgba(57,255,20,.1);   }
.by:hover { background: rgba(255,214,0,.1);   }
.bb:hover { background: rgba(74,158,255,.1);  }
.bc:hover { background: rgba(0,229,255,.1);   }

.auth-close {
  position: absolute; top: 12px; right: 14px;
  background: transparent; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 1rem; font-family: inherit; padding: 4px 8px;
  transition: color .15s;
}
.auth-close:hover { color: var(--red); }

/* ── PROGRESS BAR ──────────────────────── */
#prog   { height: 2px; background: var(--border); flex-shrink: 0; }
#prog-f { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); transition: width .5s; }

/* ── NAV BAR ────────────────────────────── */
#nav {
  background: rgba(6,9,14,.9);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 56px;
  z-index: 200;
  overflow-x: auto;
  flex-shrink: 0;
}
.nav-group {
  display: flex;
  align-items: stretch;
  min-height: 44px;
  white-space: nowrap;
}
.nav-tab {
  font-family: 'Share Tech Mono', monospace;
  font-size: .85rem;
  letter-spacing: 1px;
  padding: 0 20px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .18s;
  white-space: nowrap;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.on    { color: #fff; border-bottom-color: var(--cyan); }
.nav-tab.nav-squad { display: flex; align-items: center; gap: 6px; }
.nav-tab.nav-squad.on { border-bottom-color: var(--green); }

.nav-divider {
  width: 1px;
  background: var(--border);
  margin: 10px 4px;
  flex-shrink: 0;
}

.squad-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background .3s;
}
.squad-dot.online  { background: var(--green); box-shadow: 0 0 5px var(--green); }
.squad-dot.offline { background: var(--text-dead); }

/* ── VIEWS ──────────────────────────────── */
.view    { display: none; animation: fadeIn .15s ease; }
.view.on { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ── HOME / DASHBOARD ──────────────────── */
#view-home { display: none; }
#view-home.on { display: block; }
.dash-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 28px 24px;
}
.dash-greeting {
  font-family: 'Orbitron', monospace;
  font-size: 1.3rem;
  color: var(--cyan);
  letter-spacing: 3px;
  margin-bottom: 6px;
}
.dash-sub {
  font-size: .82rem;
  color: var(--text-dim);
  margin-bottom: 28px;
}
.dash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1.2fr;
  gap: 16px;
  margin-bottom: 24px;
}
@media (max-width: 820px) { .dash-grid { grid-template-columns: 1fr; } }

.dash-card {
  background: var(--bg1);
  border: 1px solid var(--border);
  padding: 20px;
}
.dash-card-title {
  font-family: 'Orbitron', monospace;
  font-size: .72rem;
  color: var(--text-dead);
  letter-spacing: 2px;
  margin-bottom: 14px;
  text-transform: uppercase;
}
.dash-stat-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.dash-stat-big  { font-size: 2rem; font-weight: 700; line-height: 1; }
.dash-stat-unit { font-size: .78rem; color: var(--text-dim); }

.runner-pick {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 8px;
}
.runner-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
  color: var(--text-dim);
  font-size: .72rem;
  letter-spacing: 1px;
}
.runner-btn:hover { border-color: var(--border2); color: var(--text); background: var(--bg3); }
.runner-btn.active { color: var(--text); }
.runner-btn .r-icon { font-size: 1.5rem; display: block; margin-bottom: 5px; }
.runner-btn .r-name { font-size: .65rem; letter-spacing: 1px; }
.runner-btn .r-tier { font-size: .6rem; font-weight: 700; }

.next-up-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color .15s;
}
.next-up-item:hover { border-color: var(--border2); }
.next-up-num { font-size: .7rem; color: var(--text-dead); width: 20px; flex-shrink: 0; text-align: center; }
.next-up-name { flex: 1; font-size: .88rem; font-weight: 700; }
.next-up-cost { font-size: .8rem; color: var(--yellow); white-space: nowrap; }

.faction-progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.fp-name { font-size: .72rem; width: 70px; flex-shrink: 0; font-family: 'Orbitron', monospace; overflow: hidden; white-space: nowrap; }
.fp-bar  { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.fp-fill { height: 100%; border-radius: 3px; transition: width .5s; }
.fp-pct  { font-size: .7rem; color: var(--text-dim); width: 32px; text-align: right; flex-shrink: 0; }

/* ── FACTION BAR ────────────────────────── */
#fbar { display: flex; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; background: rgba(0,0,0,.1); }
.fbtn { font-size: .85rem; letter-spacing: .5px; padding: 6px 13px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text-dim); transition: all .2s; font-family: inherit; display: flex; align-items: center; gap: 6px; }
.fdot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.fcnt { font-size: .65rem; padding: 1px 5px; background: var(--border); margin-left: 2px; }
.fbtn.on .fcnt { color: #000; }

/* ── TREE CONTROLS ──────────────────────── */
#tctrl { display: flex; gap: 7px; padding: 9px 18px; border-bottom: 1px solid var(--border); align-items: center; flex-wrap: wrap; background: rgba(0,0,0,.08); }
.tcbtn { font-size: .82rem; padding: 6px 12px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; transition: all .2s; font-family: inherit; }
.tcbtn:hover  { border-color: var(--border2); color: var(--text); }
.tcbtn.ony    { border-color: var(--yellow); color: var(--yellow); background: rgba(255,214,0,.06); }
.tcbtn.ong    { border-color: var(--green);  color: var(--green);  background: rgba(57,255,20,.06);  }

/* ── FACTION INFO ───────────────────────── */
#fi     { padding: 8px 18px; border-bottom: 1px solid; display: flex; align-items: center; gap: 12px; font-size: .88rem; }
.fi-name{ font-family: 'Orbitron', monospace; font-size: .95rem; letter-spacing: 2px; }

/* ── LEGEND ─────────────────────────────── */
#legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 7px 18px; border-bottom: 1px solid var(--border); font-size: .78rem; color: var(--text-dim); }
.leg    { display: flex; align-items: center; gap: 5px; }
.legbox { width: 10px; height: 10px; border: 1px solid; }

/* ── TREE CANVAS ────────────────────────── */
#tscroll  { overflow: auto; padding: 20px; min-height: 400px; }
#tcanvas  { position: relative; transform-origin: top left; }
#tsvg     { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }

/* ── NODES ──────────────────────────────── */
.node            { position: absolute; border: 1px solid var(--border); background: var(--bg1); border-top-width: 3px; transition: transform .12s, box-shadow .18s; user-select: none; }
.node.clickable  { cursor: pointer; }
.node.clickable:hover { transform: translateY(-2px); z-index: 10; }
.node.unlocked   { box-shadow: 0 0 16px var(--ng); }
.node.planned    { box-shadow: 0 0 12px rgba(191,90,242,.3); }
.node.locked-out { opacity: .25; cursor: not-allowed; }
.node-inner      { padding: 11px 12px; display: flex; flex-direction: column; height: 100%; }
.n-title  { font-family: 'Orbitron', monospace; font-size: .9rem; font-weight: 700; color: #fff; letter-spacing: .3px; line-height: 1.3; margin-bottom: 5px; }
.n-badges { display: flex; gap: 3px; margin-bottom: 5px; flex-wrap: wrap; }
.bdg { font-size: .65rem; padding: 2px 5px; border: 1px solid; }
.b-stat { border-color: #4a90e2; color: #4a90e2; }
.b-arm  { border-color: #8aad6a; color: #8aad6a; }
.b-fun  { border-color: #c77dff; color: #c77dff; }
.b-inv  { border-color: var(--yellow); color: var(--yellow); }
.b-rnk  { border-color: var(--border); color: var(--text-dead); }
.b-unv  { border-color: var(--orange); color: var(--orange); }
.n-eff  { font-size: .85rem; font-weight: 700; margin-bottom: 4px; }
.n-desc { color: var(--text-dim); font-size: .8rem; line-height: 1.55; overflow: hidden; flex: 1; }
.n-pips { display: flex; gap: 4px; margin-top: auto; padding-top: 6px; border-top: 1px solid var(--border); }
.pip    { flex: 1; height: 5px; background: var(--border); cursor: pointer; position: relative; overflow: hidden; }
.pip-fill { position: absolute; inset: 0; transition: background .12s; }
.node.locked-out .pip { cursor: not-allowed; }
.n-cost { font-size: .78rem; color: var(--yellow); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.n-check{ position: absolute; top: 5px; right: 7px; font-size: .72rem; font-weight: 700; }
.n-lock { position: absolute; top: 5px; right: 7px; font-size: .75rem; color: var(--border2); }

/* ── TOOLTIP ────────────────────────────── */
#tt { display: none; position: fixed; z-index: 9999; background: var(--bg1); border: 1px solid var(--border2); padding: 14px 16px; min-width: 280px; max-width: 340px; pointer-events: none; box-shadow: 0 6px 32px rgba(0,0,0,.85); }
.tt-name    { font-family: 'Orbitron', monospace; font-size: 1rem; margin-bottom: 9px; }
.tt-lvl     { padding: 10px 12px; border: 1px solid var(--border); margin-bottom: 5px; font-size: .85rem; }
.tt-lvl.cur { border-color: var(--yellow); }
.tt-lvl-hd  { display: flex; justify-content: space-between; margin-bottom: 3px; }
.tt-lvl-n   { color: var(--text); }
.tt-lvl-c   { color: var(--yellow); }
.tt-lvl-e   { font-size: .8rem; font-weight: 700; margin-bottom: 2px; }
.tt-lvl-s   { color: var(--orange); font-size: .8rem; }
.tt-rank    { font-size: .78rem; color: var(--text-dim); margin-top: 2px; }
.tt-loc     { font-size: .82rem; border-top: 1px solid var(--border); padding-top: 7px; margin-top: 5px; color: var(--text-dim); }

/* ── MODAL ──────────────────────────────── */
#modal-bg  { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 2000; align-items: center; justify-content: center; }
#modal-bg.on { display: flex; }
#modal     { background: var(--bg1); border: 1px solid var(--border2); width: 480px; max-width: 95vw; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; }
.mhdr      { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron', monospace; font-size: .88rem; letter-spacing: 2px; background: rgba(0,0,0,.3); flex-shrink: 0; }
.mclose    { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-family: inherit; padding: 4px 8px; transition: color .15s; font-size: .9rem; }
.mclose:hover { color: var(--red); }
#mbody     { padding: 20px; overflow-y: auto; flex: 1; }

/* ── INPUTS ─────────────────────────────── */
.sinput { display: block; width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; font-family: inherit; font-size: .88rem; margin-bottom: 10px; outline: none; transition: border .2s; }
.sinput:focus { border-color: var(--cyan); }
.build-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border: 1px solid var(--border); margin-bottom: 6px; font-size: .84rem; }
.build-item:hover { border-color: var(--border2); background: rgba(255,255,255,.02); }

/* ── AUTH MODAL ─────────────────────────── */
.auth-modal-wrap { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.93); z-index: 3000; align-items: center; justify-content: center; }
.auth-modal-wrap.on { display: flex; }
.auth-modal-box  { background: var(--bg1); border: 1px solid var(--border2); padding: 30px 32px; width: 400px; max-width: 95vw; position: relative; }

/* ── SQUAD PILL (replaces floating widget) ── */
#squad-pill {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 500;
  background: var(--bg1);
  border: 1px solid var(--border2);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-size: .75rem;
  letter-spacing: 1px;
  color: var(--text-dim);
  transition: border-color .2s, color .2s;
  box-shadow: 0 4px 20px rgba(0,0,0,.6);
}
#squad-pill:hover          { border-color: var(--cyan); color: var(--text); }
#squad-pill.connected      { border-color: var(--green); color: var(--green); }
#squad-pill-count          { font-size: .65rem; background: var(--green); color: #000; padding: 1px 5px; font-weight: 700; }
#squad-pill-chevron        { font-size: .65rem; color: var(--text-dead); transition: transform .2s; }
#squad-pill.open #squad-pill-chevron { transform: rotate(180deg); }

#squad-pill-panel {
  position: fixed;
  bottom: 60px;
  right: 20px;
  z-index: 499;
  width: 280px;
  background: var(--bg1);
  border: 1px solid var(--border2);
  box-shadow: 0 -4px 24px rgba(0,0,0,.7);
  display: none;
  max-height: 400px;
  overflow-y: auto;
}
#squad-pill-panel.open { display: block; animation: slideUp .15s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#squad-widget-body { padding: 14px 16px; font-size: .88rem; }

/* ── PROGRESS TAB ────────────────────────── */
#progressv { display: flex; min-height: 0; }
.prog-tabs  { display: flex; border-bottom: 1px solid var(--border); background: rgba(0,0,0,.15); flex-shrink: 0; }
.prog-tab   { font-size: .85rem; letter-spacing: 1px; padding: 12px 20px; border: none; background: transparent; cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent; transition: all .18s; font-family: inherit; white-space: nowrap; }
.prog-tab.on { color: #fff; border-bottom-color: var(--cyan); }
.prog-inner { padding: 22px; }

/* ── SALVAGE ────────────────────────────── */
.sv-hdr  { font-family: 'Orbitron', monospace; font-size: .9rem; color: var(--cyan); letter-spacing: 3px; margin-bottom: 18px; }
.sv-empty{ color: var(--text-dead); text-align: center; padding: 70px; letter-spacing: 2px; font-size: .88rem; }
.sv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px,1fr)); gap: 9px; margin-bottom: 16px; }
.sv-card { background: var(--bg1); border: 1px solid var(--border); padding: 12px 14px; transition: border-color .2s; cursor: help; }
.sv-card:hover { border-color: var(--border2); }
.sv-name { font-size: .88rem; font-weight: 700; margin-bottom: 4px; }
.sv-meta { font-size: .7rem; color: var(--text-dim); margin-bottom: 7px; }
.sv-bar  { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 5px; overflow: hidden; }
.sv-bar-f{ height: 100%; border-radius: 2px; }
.sv-tots { display: flex; justify-content: space-between; font-size: .78rem; }

/* ── BUILD SUMMARY ──────────────────────── */
.bv-hdr  { font-family: 'Orbitron', monospace; font-size: .9rem; color: var(--cyan); letter-spacing: 3px; margin-bottom: 18px; }
.bv-empty{ color: var(--text-dead); text-align: center; padding: 70px; font-size: .88rem; }
.bv-row  { display: flex; align-items: center; gap: 12px; padding: 11px 15px; border: 1px solid var(--border); margin-bottom: 5px; font-size: .9rem; }
.bv-num  { font-size: .7rem; color: var(--text-dead); width: 22px; flex-shrink: 0; text-align: center; }
.bv-name { flex: 1; font-weight: 700; }
.bv-f    { font-size: .7rem; padding: 2px 7px; border: 1px solid; }
.bv-c    { color: var(--yellow); font-size: .88rem; white-space: nowrap; }

/* ── TOOLS HUB ──────────────────────────── */
.tools-tabs  { display: flex; border-bottom: 1px solid var(--border); background: rgba(0,0,0,.12); }
.tools-tab   { font-size: .85rem; letter-spacing: 1px; padding: 12px 22px; border: none; background: transparent; cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent; transition: all .18s; font-family: inherit; white-space: nowrap; }
.tools-tab.on{ color: #fff; border-bottom-color: var(--cyan); }
.tools-inner { padding: 22px; }

/* ── GUNS NAV ───────────────────────────── */
.guns-nav      { display: flex; border-bottom: 1px solid var(--border); background: rgba(0,0,0,.15); min-height: 46px; flex-shrink: 0; }
.guns-nav-left { display: flex; flex-shrink: 0; }
.guns-nav-btn  { padding: 0 22px; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: .87rem; color: var(--text-dim); border-bottom: 2px solid transparent; white-space: nowrap; transition: all .2s; letter-spacing: 1px; flex-shrink: 0; }
.guns-nav-btn.on { color: var(--yellow); border-bottom-color: var(--yellow); }
.guns-filters  { display: flex; align-items: center; gap: 8px; padding: 0 16px; margin-left: auto; }
.guns-filters input, .guns-filters select { background: var(--bg1); border: 1px solid var(--border); color: var(--text); padding: 5px 9px; font-family: inherit; font-size: .78rem; cursor: pointer; }

/* ── MAP ─────────────────────────────────── */
#mapv         { display: flex; flex-direction: column; height: calc(100vh - 100px); }
.map-topbar   { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; background: rgba(0,0,0,.15); }
.map-body     { display: flex; flex: 1; overflow: hidden; min-height: 0; }
.map-svg-area { flex: 1; overflow: auto; padding: 20px; }
.map-sidebar  { width: 295px; flex-shrink: 0; border-left: 1px solid var(--border); overflow-y: auto; }

/* ── RUNNERS ─────────────────────────────── */
#rv { padding: 22px; }

/* ── RUN TRACKER / LOADOUT / CONTRACTS / AMMO */
#runsv, #loadoutv, #contractsv, #ammov { padding: 22px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px,1fr)); gap: 10px; margin-bottom: 20px; }
.stat-box   { background: var(--bg1); border: 1px solid var(--border); padding: 14px 16px; text-align: center; }
.stat-val   { font-size: 1.5rem; font-weight: 700; display: block; margin-bottom: 4px; }
.stat-lbl   { font-size: .65rem; color: var(--text-dead); letter-spacing: 1px; text-transform: uppercase; }

/* ── SQUAD PAGE ─────────────────────────── */
#sqv { min-height: 400px; }

/* ── AUTH WIDGET ────────────────────────── */
#auth-widget { display: flex; align-items: center; gap: 8px; }

/* ── SCROLLBAR ──────────────────────────── */
::-webkit-scrollbar       { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* ── SQ WIDGET INTERNALS ────────────────── */
.sq-btn {
  display: block; width: 100%; padding: 8px 12px; background: transparent;
  border: 1px solid var(--border); color: var(--text-dim); cursor: pointer;
  font-family: inherit; font-size: .84rem; letter-spacing: 1px; margin-bottom: 7px;

.sq-btn:hover { border-color: var(--border2); color: var(--text); }
.sq-input {

.sq-input:focus { border-color: var(--cyan); }
.sq-player {

}
.sq-player:last-child { border-bottom: none; }

const REC=["nc_saf","ar_cred","ar_inf","ca_cred","ca_sink","nc_shie","nc_rest",

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let LV={};   // owned levels (left-click, faction colour)
let PL={};   // planned levels (right-click, purple)
UG.forEach(u=>{LV[u.id]=0; PL[u.id]=0;});
let curF="CyberAcme",curTab="tree";
const NW=210,NH=138,GX=30,GY=18;

const canUnlock=u=>!u.deps||u.deps.every(d=>LV[d]>0||PL[d]>0);
const isOn=id=>LV[id]>0;
const isPlan=id=>PL[id]>0&&LV[id]===0;
const getActives=()=>UG.filter(u=>LV[u.id]>0);
const getPlanned=()=>UG.filter(u=>PL[u.id]>0&&LV[u.id]===0);
const getMaxLv=u=>u.levels.length;

// Salvage for owned only
function getSalvMap(){
  const m={};
  getActives().forEach(u=>{
    for(let i=0;i<LV[u.id];i++)
      u.levels[i].salvage.forEach(s=>{m[s.i]=(m[s.i]||0)+s.q;});
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
// Salvage for planned only
function getSalvMapPlanned(){
  const m={};
  getPlanned().forEach(u=>{
    for(let i=0;i<PL[u.id];i++)
      u.levels[i].salvage.forEach(s=>{m[s.i]=(m[s.i]||0)+s.q;});
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function hideTT(){document.getElementById("tt").style.display="none";}

function cycleNode(id,planned=false){
  hideTT();
  const u=UG.find(x=>x.id===id);
  const max=getMaxLv(u);
  if(planned){ LV[id]=0; PL[id]=(PL[id]+1)%(max+1); }
  else { PL[id]=0; LV[id]=(LV[id]+1)%(max+1); }
  refresh();
}
function setLv(id,lv,planned=false){
  hideTT();
  if(planned){ LV[id]=0; PL[id]=lv; }
  else { PL[id]=0; LV[id]=lv; }
  refresh();
}
function resetAll(){
  hideTT();
  UG.forEach(u=>{LV[u.id]=0; PL[u.id]=0;});
  refresh();
}
function refresh(){renderCurrent();updateHdr();maybeSync();}

function getTotalCreds(){
  return getActives().reduce((s,u)=>{let c=0;for(let i=0;i<LV[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
}
function getTotalCredsPlanned(){
  return getPlanned().reduce((s,u)=>{let c=0;for(let i=0;i<PL[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
}

// ══════════════════════════════════════════
// HEADER
// ══════════════════════════════════════════
function updateHdr(){
  const totalLvs=getActives().reduce((s,u)=>s+LV[u.id],0);
  document.getElementById("h-lvs").textContent=totalLvs;
  // Credits header shows planned (right-click) costs only; owned shown on hover
  document.getElementById("h-cred").textContent="₵"+getTotalCredsPlanned().toLocaleString();
  document.getElementById("h-salv").textContent=getSalvMap().length;
  document.getElementById("h-plan").textContent=getSalvMapPlanned().length;
  const maxLvs=UG.reduce((s,u)=>s+u.levels.length,0);
  document.getElementById("prog-f").style.width=Math.min(100,totalLvs/maxLvs*100)+"%";
}

// ══════════════════════════════════════════
// TABS — grouped nav
// ══════════════════════════════════════════
const ALL_VIEWS = ["home","tree","progress","runners","guns","map","tools","squad",
                   "salvage","build","runs","loadout","contracts","ammo"];

function showMain(t){
  curTab = t;
  // Update nav tab highlights
  document.querySelectorAll(".nav-tab").forEach(b=>{
    b.classList.toggle("on", b.dataset.tab === t);
  });
  // Show/hide views
  ALL_VIEWS.forEach(id=>{
    const el = document.getElementById("view-"+id);
    if(el) el.classList.toggle("on", id===t);
  });
  renderCurrent();
}
function renderCurrent(){
  if(curTab==="home")      renderDashboard();
  else if(curTab==="tree") renderTree();
  else if(curTab==="progress") renderProgressTab();
  else if(curTab==="runners")  renderRunners();
  else if(curTab==="guns")     renderGuns();
  else if(curTab==="map")      renderMap();
  else if(curTab==="tools")    renderToolsHub();
  else if(curTab==="squad")    renderSquadPage();
  // Legacy single-tab renders (still called if navigated to directly)
  else if(curTab==="salvage")   renderSalv();
  else if(curTab==="build")     renderBuild();
  else if(curTab==="runs")      renderRuns();
  else if(curTab==="loadout")   renderLoadout();
  else if(curTab==="contracts") renderContracts();
  else if(curTab==="ammo")      renderAmmo();
}



// ══════════════════════════════════════════
// FACTION BAR
// ══════════════════════════════════════════
function buildFbar(){
  document.getElementById("fbar").innerHTML=Object.keys(FC).map(f=>{
    const fc=FC[f];
    const nodes=UG.filter(u=>u.f===f);
    const tot=nodes.reduce((s,u)=>s+u.levels.length,0);
    const act=nodes.reduce((s,u)=>s+LV[u.id],0);
    const on=f===curF;
    return`<button class="fbtn${on?" on":""}"
      style="${on?`border-color:${fc.color};color:${fc.color};background:${fc.bg}`:""}"
      onclick="setF('${f}')">
      <span class="fdot" style="${on?`background:${fc.color}`:""}"></span>
      ${f.toUpperCase()}
      <span class="fcnt" style="${on?`background:${fc.color};color:#000`:""}">
        ${act}/${tot}
      </span></button>`;
  }).join("");
}
function setF(f){curF=f;buildFbar();renderTree();}

// ══════════════════════════════════════════
// TREE
// ══════════════════════════════════════════
function renderTree(){
  hideTT();
  buildFbar();
  const fc=FC[curF];
  const fi=document.getElementById("fi");
  fi.style.cssText=`background:${fc.bg};border-bottom-color:${fc.dim};padding:5px 14px;border-bottom:1px solid;display:flex;align-items:center;gap:10px;font-size:16px`;
  fi.innerHTML=`<span class="fi-name" style="color:${fc.color}">${curF}</span>
    <span style="color:#4a6070">Handler: ${fc.handler}</span>
    `;

  let nodes=UG.filter(u=>u.f===curF);
  const maxC=nodes.reduce((m,u)=>Math.max(m,u.col),0);
  const maxR=nodes.reduce((m,u)=>Math.max(m,u.row),0);
  const cW=(maxC+1)*(NW+GX)+GX, cH=(maxR+1)*(NH+GY)+GY+8;
  const canvas=document.getElementById("tcanvas");
  canvas.style.cssText=`position:relative;width:${cW}px;height:${cH}px`;
  const svg=document.getElementById("tsvg");
  svg.setAttribute("width",cW);svg.setAttribute("height",cH);

  // SVG edges
  let paths="";
  nodes.forEach(u=>{
    (u.deps||[]).forEach(dep=>{
      const from=nodes.find(x=>x.id===dep);
      if(!from)return;
      const x1=from.col*(NW+GX)+NW, y1=from.row*(NH+GY)+NH/2;
      const x2=u.col*(NW+GX), y2=u.row*(NH+GY)+NH/2;
      const mx=(x1+x2)/2;
      const active=isOn(dep)&&isOn(u.id);
      paths+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none"
        stroke="${active?fc.color:"#1a2530"}" stroke-width="${active?2:1}"
        stroke-dasharray="${active?"none":"4 3"}"/>`;
    });
  });
  svg.innerHTML=paths;
  canvas.querySelectorAll(".node").forEach(n=>n.remove());

  nodes.forEach(u=>{
    const x=u.col*(NW+GX), y=u.row*(NH+GY);
    const lv=LV[u.id], plv=PL[u.id], maxLv=getMaxLv(u);
    const on=lv>0, planned=plv>0&&lv===0;
    const isNext=u.id===nextRec;
    const locked=!canUnlock(u)&&!on&&!planned;
    const PLAN_COL="#bf5af2";
    const hiActive=false;
    const bc=on?fc.color:planned?PLAN_COL:isNext?"#39ff14":hiActive?"#ffd600":"#1a2530";
    const bg=on?fc.bg:planned?"rgba(191,90,242,.1)":isNext?"rgba(57,255,20,.06)":hiActive?"rgba(255,214,0,.04)":"#0d1318";
    const unverified=u.v===false;
    const activeLv=on?lv:planned?plv:0;
    const nextCostObj=u.levels[activeLv]||null;
    const typeClass={stat:"b-stat",arm:"b-arm",fun:"b-fun",inv:"b-inv"}[u.t]||"b-stat";
    const typeLabel={stat:"STAT",arm:"ARMORY",fun:"FUNCTION",inv:"INVENTORY"}[u.t]||"STAT";
    const currEff=activeLv>0?u.levels[activeLv-1].eff:"";
    const depNames=locked?(u.deps||[]).map(d=>{const du=UG.find(x=>x.id===d);return du?du.name:"?";}):[];

    // Pip bars — left pip = owned, right-click to plan
    const pipHtml=u.levels.map((_,i)=>{
      const ownedFill=i<lv?fc.color:"transparent";
      const planFill=i<plv&&lv===0?PLAN_COL:"transparent";
      const fillCol=ownedFill!=="transparent"?ownedFill:planFill;
      return`<div class="pip" title="L-click own Lv${i+1} / R-click plan Lv${i+1}"
        onclick="event.stopPropagation();${locked?'':` setLv('${u.id}',${lv===i+1?0:i+1},false)`}"
        oncontextmenu="event.preventDefault();event.stopPropagation();${locked?'':` setLv('${u.id}',${plv===i+1&&lv===0?0:i+1},true)`}">
        <div class="pip-fill" style="background:${fillCol}"></div>
      </div>`;
    }).join("");

    const div=document.createElement("div");
    div.className="node"+(on?" unlocked":planned?" planned":"")+(locked?" locked-out":" clickable");
    div.style.cssText=`left:${x}px;top:${y}px;width:${NW}px;height:${NH}px;
      --ng:${on?fc.color+"44":planned?PLAN_COL+"44":"transparent"};
      border-color:${bc};background:${bg};border-top-color:${bc}`;
    div.dataset.id=u.id;

    if(!locked){
      div.onclick=e=>{if(!e.target.classList.contains("pip"))cycleNode(u.id,false);};
      div.oncontextmenu=e=>{e.preventDefault();if(!e.target.classList.contains("pip"))cycleNode(u.id,true);};
    }

    div.innerHTML=`
      <div class="node-inner">
        <div class="n-title">
          ${hiActive?'<span style="color:#ffd600;font-size:16px">★ </span>':""}
          ${isNext?'<span style="color:#39ff14;font-size:16px">⚡ </span>':""}
          ${u.name}
        </div>
        <div class="n-badges">
          <span class="bdg ${typeClass}">${typeLabel}</span>
          <span class="bdg b-rnk">R${u.levels[0].rank}+</span>
          ${on?`<span class="bdg" style="border-color:${fc.color};color:${fc.color}">OWN LV${lv}/${maxLv}</span>`:""}
          ${planned?`<span class="bdg" style="border-color:${PLAN_COL};color:${PLAN_COL}">PLAN LV${plv}/${maxLv}</span>`:""}
          ${unverified?'<span class="bdg b-unv">⚠</span>':""}
        </div>
        ${locked
          ?`<div class="n-desc" style="color:#ff006e55;font-size:15px">🔒 Requires: ${depNames.join(", ")}</div>`
          :activeLv>0
            ?`<div class="n-eff" style="color:${on?fc.color:PLAN_COL};font-size:16px">${currEff}</div>`
            :`<div class="n-desc">${u.desc.substring(0,65)}${u.desc.length>65?"…":""}</div>`}
        <div class="n-pips">${pipHtml}</div>
        ${!locked?(nextCostObj
          ?`<div class="n-cost">→ ₵${nextCostObj.credits.toLocaleString()}${nextCostObj.salvage.length?" + "+nextCostObj.salvage.map(s=>`${s.i.split(" ").slice(0,2).join(" ")}×${s.q}`).join(", "):""}
</div>`
          :`<div style="font-size:15px;color:#39ff14;margin-top:4px">✓ MAX</div>`):""}
      </div>
      ${on?`<div class="n-check" style="color:${fc.color}">✓</div>`:""}
      ${planned?`<div class="n-check" style="color:${PLAN_COL}">◈</div>`:""}
      ${locked?`<div class="n-lock">🔒</div>`:""}`;

    div.addEventListener("mouseenter",e=>{
      if(locked){
        const depNames=(u.deps||[]).map(d=>{const du=UG.find(x=>x.id===d);return du?`<span style="color:#ffd600">${du.name}</span>`:"?";});
        const tt=document.getElementById("tt");
        tt.innerHTML=`<div style="font-family:'Orbitron',monospace;font-size:16px;color:#ff006e;margin-bottom:7px">🔒 LOCKED</div>
          <div style="font-size:16px;color:#8aa0b0;margin-bottom:5px">Unlock the following first:</div>
          ${depNames.map(n=>`<div style="font-size:16px;padding:3px 6px;border-left:2px solid #ffd600;margin-bottom:3px">${n}</div>`).join("")}`;
        tt.style.display="block";
        moveTT(e);
      } else {
        showTT(u,e);
      }
    });
    div.addEventListener("mouseleave",hideTT);
    div.addEventListener("mousemove",moveTT);
    canvas.appendChild(div);
  });
}

function showTT(u,e){
  const fc=FC[u.f], lv=LV[u.id];
  const rows=u.levels.map((l,i)=>{
    const done=i<lv, cur=i===lv-1;
    return`<div class="tt-lvl${cur?" cur":""}">
      <div class="tt-lvl-hd">
        <span class="tt-lvl-n" style="${done?`color:${fc.color}`:""}">Level ${i+1}${done?" ✓":""}</span>
        <span class="tt-lvl-c">₵${l.credits.toLocaleString()}</span>
      </div>
      <div class="tt-lvl-e" style="color:${done?fc.color:"#39ff1466"}">${l.eff}</div>
      ${l.salvage.map(s=>`<div class="tt-lvl-s">◈ ${s.i} ×${s.q}</div>`).join("")}
      <div class="tt-rank">Rank ${l.rank}+ required</div>
    </div>`;
  }).join("");

  const firstSalv=u.levels[0].salvage[0];
  const loc=firstSalv?SL[firstSalv.i]:null;
  const locHtml=loc?`<div class="tt-loc">
    <div style="color:${RC[loc.rarity]||"#8aa0b0"};margin-bottom:2px">▲ ${loc.rarity.toUpperCase()}</div>
    <div>📍 ${loc.map}</div>
    <div>POIs: ${loc.pois.join(", ")}</div>
    <div style="margin-top:2px;font-style:italic">${loc.note}</div>
  </div>`:"";

  const tt=document.getElementById("tt");
  tt.innerHTML=`<div class="tt-name" style="color:${fc.color}">${u.name} <span style="font-size:15px;color:#4a6070">— ${u.f}</span></div>
    <div style="font-size:15px;color:#6a8090;margin-bottom:6px">${u.desc}</div>
    ${rows}${locHtml}`;
  tt.style.display="block";
  moveTT(e);
}
function moveTT(e){
  const tt=document.getElementById("tt");
  const w=tt.offsetWidth||240, h=tt.offsetHeight||160;
  tt.style.left=Math.min(e.clientX+14,window.innerWidth-w-10)+"px";
  tt.style.top=Math.min(e.clientY+14,window.innerHeight-h-10)+"px";
}

          <span style="color:#bf5af2">${u.name}</span>

    ${ownedRows}
    <div style="display:flex;justify-content:space-between;padding:3px 5px;margin:4px 0 8px;border-top:1px solid #1a2530;font-size:16px">
      <span style="color:#4a6070">Owned total</span>
      <span style="color:#ffd600;font-weight:700">₵${ownedCred.toLocaleString()}</span>
    </div>
    <div style="font-size:15px;color:#bf5af2;letter-spacing:1px;margin-bottom:4px">◈ PLANNED (R-CLICK)</div>

      <span style="color:#4a6070">Planned total</span>
      <span style="color:#bf5af2;font-weight:700">₵${plannedCred.toLocaleString()}</span>
    </div>

function showSalvTT(item,e){
  const loc=SL[item];
  const rc=loc?RC[loc.rarity]:"#4a6070";

  // Find which upgrades/levels need this item (owned + planned)
  const needs=[];
  getActives().forEach(u=>{
    for(let i=0;i<LV[u.id];i++){
      const s=u.levels[i].salvage.find(s=>s.i===item);
      if(s) needs.push({u,level:i+1,qty:s.q,type:"owned"});
    }
  });
  getPlanned().forEach(u=>{
    for(let i=0;i<PL[u.id];i++){
      const s=u.levels[i].salvage.find(s=>s.i===item);
      if(s) needs.push({u,level:i+1,qty:s.q,type:"planned"});
    }
  });
  const needRows=needs.map(n=>{
    const fc=FC[n.u.f];
    const col=n.type==="planned"?"#bf5af2":fc.color;
    const label=n.type==="planned"?"◈ PLAN":"✓ OWN";
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 5px;margin-bottom:2px;border-left:2px solid ${col};font-size:8.5px">
      <span style="color:${col}">${n.u.name}</span>
      <span style="color:#4a6070;margin:0 5px;font-size:7.5px">${label} Lv${n.level}</span>
      <span style="color:#ffd600;font-weight:700">×${n.qty}</span>
    </div>`;
  }).join("");

  const locHtml=loc?`
    <div style="margin-top:7px;padding-top:6px;border-top:1px solid #1a2530">
      <div style="color:${rc};font-size:15px;margin-bottom:3px;font-weight:700">▲ ${loc.rarity.toUpperCase()} RARITY</div>
      <div style="font-size:8.5px;color:#c8d8e8;margin-bottom:2px">📍 ${loc.map}</div>
      <div style="font-size:15px;color:#8aa0b0;margin-bottom:2px">POIs: ${loc.pois.join(", ")}</div>
      <div style="font-size:15px;color:#6a8090;font-style:italic">${loc.note}</div>
      ${loc.rarity==="superior"?`<div style="margin-top:4px;font-size:7.5px;color:#bf5af2;padding:2px 5px;background:rgba(191,90,242,.08);border-left:2px solid #bf5af2">⚠ UESC Incursion events & Superior Locked Rooms only</div>`:""}
    </div>`:"<div style='margin-top:5px;font-size:15px;color:#ff6d00'>⚠ Location data unconfirmed</div>";

  const totalQty=needs.reduce((s,n)=>s+n.qty,0);
  const tt=document.getElementById("tt");
  tt.innerHTML=`
    <div style="font-family:'Orbitron',monospace;font-size:16px;color:${rc};margin-bottom:6px">◈ ${item}</div>
    <div style="font-size:15px;color:#4a6070;margin-bottom:5px">Total needed: <span style="color:#ffd600;font-weight:700">×${totalQty}</span></div>
    <div style="font-size:15px;color:#4a6070;margin-bottom:4px;letter-spacing:1px">REQUIRED BY:</div>
    ${needRows}
    ${locHtml}`;
  tt.style.display="block";
  moveTT(e);
}

function renderSalv(){
  const salv=getSalvMap();

  if(!salv.length && !salvPlan.length){
    el.innerHTML='<div class="sv-empty">// UNLOCK OR PLAN UPGRADES IN THE TREE FIRST //<br><br><span style="font-size:16px;color:#4a6070">Left-click = owned &nbsp;·&nbsp; Right-click = planned (purple)</span></div>';return;
  }
  const supCnt=salv.filter(([n])=>SL[n]?.rarity==="superior").length;

  const makeCards=(items,isPlan)=>items.map(([item,qty])=>{

    return`<div class="svc" style="border-left:3px solid ${isPlan?"#bf5af2":rc};cursor:help${isPlan?";opacity:.85":""}"

        ${isPlan?`<span class="svc-r" style="border-color:#bf5af2;color:#bf5af2">PLANNED</span>`:""}
        ${loc?`<span class="svc-r" style="border-color:${rc};color:${rc}">${loc.rarity}</span>
               <span style="color:#4a9eff;font-size:16px">📍 ${loc.map}</span>`
             :`<span style="color:#ff6d00;font-size:15px">⚠ Location unconfirmed</span>`}
      </div>
      ${loc?`<div style="color:#8aa0b0;font-size:16px">POIs: ${loc.pois.join(" · ")}</div>
             <div style="color:#6a8090;font-size:15px;margin-top:2px;font-style:italic">${loc.note}</div>
             ${loc.rarity==="superior"?'<div style="margin-top:5px;font-size:15px;color:#bf5af2;padding:2px 5px;background:rgba(191,90,242,.08);border-left:2px solid #bf5af2">⚠ Superior — UESC Incursion & Superior Locked Rooms only</div>':""}`:""}
    </div>`;
  }).join("");

  const ownedSection=salv.length?`
    <div style="font-family:'Orbitron',monospace;font-size:16px;color:#ff6d00;letter-spacing:2px;margin-bottom:8px">✓ OWNED UPGRADES SALVAGE</div>
    <div class="sv-grid">${makeCards(salv,false)}</div>`:"";

  const plannedSection=salvPlan.length?`
    <div style="font-family:'Orbitron',monospace;font-size:16px;color:#bf5af2;letter-spacing:2px;margin:${salv.length?"14px":0} 0 8px">◈ PLANNED UPGRADES SALVAGE</div>
    <div class="sv-grid">${makeCards(salvPlan,true)}</div>`:"";

  el.innerHTML=`<div style="margin-bottom:12px;font-size:16px;color:#4a6070">
    ${getActives().length} owned · ${getPlanned().length} planned &nbsp;|&nbsp;
    <span style="color:#ff6d00">${salv.length} owned salvage types</span> &nbsp;·&nbsp;
    <span style="color:#bf5af2">${salvPlan.length} planned salvage types</span>
  </div>
  ${ownedSection}${plannedSection}
  <div class="sv-tots">
    <div class="sv-tot-hdr">TOTAL COSTS</div>
    <div class="sv-row"><span style="color:#4a6070;flex:1">Owned Credits</span><span style="font-weight:700;color:#ffd600">₵${getTotalCreds().toLocaleString()}</span></div>
    ${salvPlan.length?`<div class="sv-row"><span style="color:#4a6070;flex:1">Planned Credits</span><span style="font-weight:700;color:#bf5af2">₵${getTotalCredsPlanned().toLocaleString()}</span></div>`:""}
    <div class="sv-row"><span style="color:#4a6070;flex:1">Superior Materials (owned) ⚠</span><span style="font-weight:700;color:#bf5af2">${supCnt}</span></div>

      💡 Hover any salvage card to see which upgrades need it and full location info.<br>

      💡 Superior (purple border) only from UESC Incursion events & Superior Locked Rooms.<br>
      💡 Shell ID only from High-Value Target Supply Drops — prioritise HVT contracts.
    </div>
  </div>`;

}

// BUILD
// ══════════════════════════════════════════
function renderBuild(){
  const active=getActives();
  const el=document.getElementById("bv-c");
  if(!active.length){
    el.innerHTML='<div class="bv-empty">// SELECT UPGRADES IN THE TREE FIRST //</div>';return;
  }
  const cards=active.map(u=>{
    const fc=FC[u.f], lv=LV[u.id];
    let cc=0;const sm={};
    for(let i=0;i<lv;i++){
      cc+=u.levels[i].credits;
      u.levels[i].salvage.forEach(s=>{sm[s.i]=(sm[s.i]||0)+s.q;});
    }
    return`<div class="bvc" style="border-left:3px solid ${fc.color}">
      <div style="font-family:'Orbitron',monospace;font-size:8.5px;color:${fc.color};margin-bottom:2px">${u.name}</div>
      <div style="font-size:15px;color:${fc.color}55;margin-bottom:3px">${u.f}</div>
      <div style="font-size:15px;color:#4a6070;margin-bottom:3px">Level ${lv}/${getMaxLv(u)} · Rank ${u.levels[0].rank}+</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;font-size:15px">
        <span style="color:#ffd600">₵${cc.toLocaleString()}</span>
        ${Object.entries(sm).map(([i,q])=>`<span style="color:#ff6d00">◈${i.split(" ")[0]} ×${q}</span>`).join("")}
      </div>
      <div style="font-size:15px;font-weight:700;color:${fc.color};margin-top:3px">${u.levels[lv-1].eff}</div>
    </div>`;
  }).join("");

  const steps=REC.map((id,i)=>{
    const u=UG.find(x=>x.id===id);if(!u)return"";
    const fc=FC[u.f],done=isOn(id);
    return`<span class="rs${done?" done":""}" style="${done?`--sc:${fc.color};--sb:${fc.bg}`:""}">
      <span style="color:#4a6070;margin-right:2px">${i+1}.</span>${u.name}${done?" ✓":""}
    </span>${i<REC.length-1?'<span style="color:#2a3a48">›</span>':""}`;
  }).join("");

  const fbRows=Object.keys(FC).map(f=>{
    const fa=active.filter(u=>u.f===f);if(!fa.length)return"";
    const fc=FC[f];
    const fc_c=fa.reduce((s,u)=>{let c=0;for(let i=0;i<LV[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
    const lvSum=fa.reduce((s,u)=>s+LV[u.id],0);
    return`<div class="fbr" style="border-left:2px solid ${fc.color}">
      <span style="color:${fc.color};min-width:80px">${f}</span>
      <span style="color:#8aa0b0">${fa.length} upgrades · ${lvSum} levels</span>
      <span style="color:#ffd600;margin-left:auto">₵${fc_c.toLocaleString()}</span>

function getBuilds(){try{return JSON.parse(localStorage.getItem("mg_builds")||"{}");}catch{return{};}}
function putBuilds(o){localStorage.setItem("mg_builds",JSON.stringify(o));}

function openModal(mode){
  const bg=document.getElementById("modal-bg");
  bg.classList.add("on");
  document.getElementById("mtitle").textContent=mode==="save"?"💾 SAVE BUILD":"📂 MANAGE BUILDS";
  const body=document.getElementById("mbody");
  if(mode==="save"){
    body.innerHTML=`<div style="font-size:16px;color:#4a6070;margin-bottom:8px">
      Name your current build to save it. You can load it again later.</div>
      <input class="sinput" id="bname" placeholder="e.g. Early Game, Melee Build..." maxlength="40">
      <div class="mbtns">
        <button class="btn br" onclick="closeModal()">CANCEL</button>
        <button class="btn bg" onclick="doSave()">SAVE</button>
      </div>`;
    setTimeout(()=>document.getElementById("bname")?.focus(),50);
  } else {
    renderBuildsModal(body);
  }
}
function renderBuildsModal(body){
  const builds=getBuilds(), keys=Object.keys(builds);
  if(!keys.length){
    body.innerHTML=`<div style="color:#4a6070;text-align:center;padding:20px;font-size:16px">No saved builds yet.</div>
      <div class="mbtns"><button class="btn br" onclick="closeModal()">CLOSE</button></div>`;
    return;
  }
  const rows=keys.map(k=>`<div class="brow">
    <span class="brow-n">${k}</span>
    <span class="brow-d">${builds[k].date||""}</span>
    <div class="brow-acts">
      <button class="btn bg" style="font-size:15px;padding:3px 8px" onclick="doLoad('${k}')">LOAD</button>
      <button class="btn by" style="font-size:15px;padding:3px 8px" onclick="doExportNamed('${k}')">⬇</button>
      <button class="btn br" style="font-size:15px;padding:3px 8px" onclick="doDelete('${k}')">✕</button>
    </div>
  </div>`).join("");
  body.innerHTML=`${rows}<div class="mbtns"><button class="btn br" onclick="closeModal()">CLOSE</button></div>`;
}
function doSave(){
  const name=document.getElementById("bname")?.value?.trim();
  if(!name){alert("Please enter a name.");return;}
  const b=getBuilds();
  b[name]={levels:{...LV},date:new Date().toLocaleDateString()};
  putBuilds(b);
  closeModal();
  alert(`✓ Build "${name}" saved!`);
}
function doLoad(name){
  const b=getBuilds();
  if(!b[name])return;
  Object.assign(LV,b[name].levels);
  closeModal();refresh();
}
function doDelete(name){
  if(!confirm(`Delete "${name}"?`))return;
  const b=getBuilds();delete b[name];putBuilds(b);
  renderBuildsModal(document.getElementById("mbody"));
}
function doExport(name){
  const lbl=name||`Build_${new Date().toLocaleDateString().replace(/\//g,"-")}`;
  const active=getActives(), salv=getSalvMap();
  const lines=[
    `MARATHON UPGRADE BUILD — ${lbl}`,
    `Generated: ${new Date().toLocaleString()}`,
    "=".repeat(52),"",
    `Total Credits:   ₵${getTotalCreds().toLocaleString()}`,
    `Nodes Unlocked:  ${active.length}`,
    `Total Levels:    ${active.reduce((s,u)=>s+LV[u.id],0)}`,
    `Salvage Types:   ${salv.length}`,
    "",
    "── SELECTED UPGRADES ──────────────────────────",
  ];
  Object.keys(FC).forEach(f=>{
    const fa=active.filter(u=>u.f===f);
    if(!fa.length)return;
    lines.push(`\n[${f.toUpperCase()}]`);
    fa.forEach(u=>{
      const lv=LV[u.id];
      lines.push(`  ${u.name.padEnd(24)} Lv ${lv}/${getMaxLv(u)}  ${u.levels[lv-1].eff}`);
    });
  });
  lines.push("","── SALVAGE SHOPPING LIST ───────────────────────");
  salv.forEach(([item,qty])=>{
    const loc=SL[item];
    const linfo=loc?` [${loc.rarity.toUpperCase()}] ${loc.map} — ${loc.pois.join("/")}  (${loc.note})`:" [LOCATION UNCONFIRMED]";
    lines.push(`  ◈ ${item.padEnd(26)} ×${String(qty).padStart(3)}${linfo}`);
  });
  const blob=new Blob([lines.join("\n")],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`marathon-build-${lbl.replace(/\s+/g,"-").replace(/[^a-z0-9-]/gi,"")}.txt`;
  a.click();
}
function doExportNamed(name){
  const b=getBuilds();if(!b[name])return;
  const save={...LV};Object.assign(LV,b[name].levels);
  doExport(name);
  Object.assign(LV,save);
}
function bgClick(e){if(e.target===document.getElementById("modal-bg"))closeModal();}
function closeModal(){document.getElementById("modal-bg").classList.remove("on");}

let currentScale=1;
function fitTree(){
  const scroll=document.getElementById("tscroll");
  const canvas=document.getElementById("tcanvas");
  const sw=scroll.clientWidth-40, sh=scroll.clientHeight-40;
  const cw=canvas.scrollWidth/currentScale, ch=canvas.scrollHeight/currentScale;
  const scale=Math.min(sw/cw, sh/ch, 1);
  currentScale=scale;
  canvas.style.transform=`scale(${scale})`;
  canvas.style.width=(cw*scale)+"px";
  canvas.style.height=(ch*scale)+"px";
}
function resetZoom(){
  currentScale=1;
  const canvas=document.getElementById("tcanvas");
  canvas.style.transform="scale(1)";
  canvas.style.width="";
  canvas.style.height="";
}

function showPlanHdrTT(e){
  const salv=getSalvMapPlanned();
  const tt=document.getElementById("tt");
  if(!salv.length){
    tt.innerHTML=`<div style="color:#bf5af2;font-size:16px;font-family:'Share Tech Mono',monospace">No planned upgrades yet.<br>Right-click any node to plan it.</div>`;
  } else {
    const rows=salv.map(([item,qty])=>{
      const loc=SL[item];
      const rc=loc?RC[loc.rarity]:"#4a6070";
      return`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 5px;margin-bottom:2px;border-left:2px solid ${rc}">
        <span style="color:#c8d8e8;font-size:16px">◈ ${item}</span>
        <span style="color:#bf5af2;font-weight:700;font-size:16px;margin-left:10px">×${qty}</span>
      </div>`;
    }).join("");
    tt.innerHTML=`<div style="font-family:'Orbitron',monospace;font-size:16px;color:#bf5af2;margin-bottom:8px">◈ PLANNED SALVAGE</div>
      <div style="font-size:15px;color:#4a6070;margin-bottom:6px">Right-click upgrades to plan them</div>
      ${rows}
      <div style="margin-top:8px;padding-top:6px;border-top:1px solid #1a2530;font-size:15px;color:#4a6070">
        Planned credits: <span style="color:#bf5af2">₵${getTotalCredsPlanned().toLocaleString()}</span>
      </div>`;
  }
  tt.style.display="block";
  moveTT(e);
}

          <div class="rd-box-hdr" style="color:#ffd600">🔫 RECOMMENDED WEAPONS</div>
          ${r.weapons.map(w=>{
            const wc={S:"#39ff14",A:"#ffd600",B:"#ff6d00"}[w.tier]||"#4a6070";
            return`<div style="margin-bottom:8px;padding:5px 8px;border-left:2px solid ${wc}">
              <div style="font-size:16px;color:#fff;font-weight:700">${w.name} <span style="font-size:15px;padding:1px 4px;border:1px solid ${wc};color:${wc}">${w.tier}</span></div>
              <div style="font-size:15px;color:#4a6070;margin-top:2px">${w.role}</div>
            </div>`;
          }).join("")}
        </div>
        <div class="rd-box">
          <div class="rd-box-hdr" style="color:#bf5af2">💎 CORES</div>
          ${r.cores.map(c=>`<div style="font-size:16px;color:#c8d8e8;margin-bottom:6px;padding:4px 8px;border-left:2px solid #bf5af2">• ${c}</div>`).join("")}
          <div style="margin-top:10px"><div style="font-size:15px;color:#4a6070;letter-spacing:1px;margin-bottom:4px">BEST SYNERGY</div>
            <div style="font-size:16px;color:#8aa0b0">${r.synergy}</div>
          </div>
        </div>
        <div class="rd-box">
          <div class="rd-box-hdr" style="color:#ff6d00">📦 BUILD COSTS</div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1a2530">
            <span style="color:#4a6070;font-size:16px">Total Credits</span>
            <span style="color:#ffd600;font-weight:700">₵${totalCreds.toLocaleString()}</span>
          </div>
          ${salvRows||`<div style="color:#4a6070;font-size:16px">No salvage needed</div>`}
        </div>
      </div>

      <div class="rd-box" style="margin-bottom:14px">
        <div class="rd-box-hdr" style="color:#39ff14">💡 TIPS</div>
        ${r.tips.map(t=>`<div style="font-size:16px;color:#8aa0b0;margin-bottom:6px;padding-left:10px;border-left:2px solid #1a2530">• ${t}</div>`).join("")}
      </div>

      <div class="rd-box" style="margin-bottom:14px">
        <div class="rd-box-hdr" style="color:#00e5ff">⬆ PRIORITY UPGRADES FOR THIS BUILD</div>
        <div style="margin-bottom:8px;font-size:16px;color:#4a6070">${r.upgrades.reason}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          ${load.map(({id,lv})=>{
            const u=UG.find(x=>x.id===id);
            if(!u)return"";
            const fc=FC[u.f];
            return`<span style="font-size:15px;padding:3px 8px;border:1px solid ${fc.color};color:${fc.color};background:${fc.color}11">${u.name} Lv${lv}</span>`;
          }).join("")}
        </div>
      </div>

      <button class="rd-load-btn" onclick="loadRunnerBuild('${r.id}')">
        ⬆ LOAD THIS BUILD INTO UPGRADE TREE
      </button>
    </div>`;
}

function loadRunnerBuild(id){
  const load=RUNNER_UPGRADE_LOADS[id]||[];
  UG.forEach(u=>{LV[u.id]=0;PL[u.id]=0;});
  load.forEach(({id:uid,lv})=>{
    if(LV[uid]!==undefined) LV[uid]=lv;
  });
  refresh();
  activeRunner=null;
  showMain("tree");
}

let gunsSubPage="weapons";
let selectedWeapon=null;
let favouriteLoadouts=JSON.parse(localStorage.getItem("mara_fav_guns")||"[]");

function saveGunFavourites(){
  try{localStorage.setItem("mara_fav_guns",JSON.stringify(favouriteLoadouts));}catch(e){}
}

function renderGuns(){
  const el=document.getElementById("gv");
  if(gunsSubPage==="weapons") renderWeapons(el);
  else renderItemsPage(el);
}

function renderWeapons(el){
  const types=[...new Set(WEAPONS_DATA.map(w=>w.type))];
  let filterType=window._gunFilter||"All";
  let filterTier=window._gunTier||"All";
  let search=(window._gunSearch||"").toLowerCase();

  let filtered=WEAPONS_DATA.filter(w=>{
    if(filterType!=="All"&&w.type!==filterType)return false;
    if(filterTier!=="All"&&w.tier!==filterTier)return false;
    if(search&&!w.name.toLowerCase().includes(search)&&!w.type.toLowerCase().includes(search))return false;
    return true;
  });

  el.innerHTML=`
    <div class="guns-nav" style="position:sticky;top:0;z-index:10;background:#070d12">
      <div class="guns-nav-left">
        <button class="guns-nav-btn on" onclick="gunsSubPage='weapons';renderGuns()">WEAPONS</button>
        <button class="guns-nav-btn" onclick="gunsSubPage='items';renderGuns()">ITEMS</button>
      </div>
      <div class="guns-filters">
        <input id="gun-search" placeholder="Search…" value="${window._gunSearch||""}" oninput="window._gunSearch=this.value;renderGuns()">
        <select onchange="window._gunFilter=this.value;renderGuns()">
          <option value="All" ${filterType==="All"?"selected":""}>All Types</option>
          ${types.map(t=>`<option value="${t}" ${filterType===t?"selected":""}>${t}</option>`).join("")}
        </select>
        <select onchange="window._gunTier=this.value;renderGuns()">
          ${["All","S","A","B","C"].map(t=>`<option value="${t}" ${filterTier===t?"selected":""}>${t==="All"?"All Tiers":t+"-Tier"}</option>`).join("")}
        </select>
      </div>
    </div>
    <div style="padding:16px 20px">
      ${selectedWeapon?renderWeaponDetail():`
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">
          ${filtered.map(w=>renderWeaponCard(w)).join("")}
        </div>
        ${favouriteLoadouts.length?`
          <div style="margin-top:20px">
            <div style="font-family:'Orbitron',monospace;font-size:16px;color:#ffd600;letter-spacing:2px;margin-bottom:10px">★ SAVED LOADOUTS</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">
              ${favouriteLoadouts.map((f,i)=>renderSavedLoadout(f,i)).join("")}
            </div>
          </div>`:""}
      `}
    </div>`;
}

function renderWeaponCard(w){
  const tc={S:"#39ff14",A:"#ffd600",B:"#ff6d00",C:"#ff4444"}[w.tier]||"#4a6070";
  const ac=AMMO_COL[w.ammo]||"#4a6070";
  return`<div style="background:#0d1318;border:1px solid #1a2530;border-top:3px solid ${tc};cursor:pointer;transition:all .2s;padding:12px 14px" onclick="selectedWeapon='${w.id}';renderGuns()"
    onmouseenter="this.style.transform='translateY(-2px)';this.style.boxShadow='0 4px 16px rgba(0,0,0,.5)'"
    onmouseleave="this.style.transform='';this.style.boxShadow=''">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">

const SB_URL = "https://ppzulorxyiwkzhfeubhr.supabase.co";
const SB_KEY = "sb_publishable_nL6282I7TKx6zcqa73j2-g_0CatgzXM";

let authUser  = null;   // { id, username }

// ── Low-level fetch ───────────────────────
async function sbFetch(path, opts = {}) {
  const headers = {
    "Content-Type": "application/json",
    "apikey": SB_KEY,
    "Authorization": "Bearer " + SB_KEY,
    ...(opts.extraHeaders || {})
  };
  const res = await fetch(SB_URL + path, {
    method: opts.method || "GET",
    headers,
    body: opts.body
  });
  if (res.status === 204 || res.status === 201) {
    try { return await res.json(); } catch(e) { return {}; }
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data?.message || data?.error || `HTTP ${res.status}`);
  return data;
}

// ── SHA-256 hash ──────────────────────────
async function _sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ══════════════════════════════════════════
// SIGN UP
// ══════════════════════════════════════════
async function authSignUp(username, password) {
  if (!username || username.length < 3) {
    setAuthMsg("Username must be at least 3 characters.", "error"); return;
  }
  if (!password || password.length < 6) {
    setAuthMsg("Password must be at least 6 characters.", "error"); return;
  }
  setAuthMsg("Creating account…", "info");

  try {
    // Check username not taken
    const existing = await sbFetch(`/rest/v1/profiles?username=eq.${encodeURIComponent(username)}&select=id`);
    if (Array.isArray(existing) && existing.length > 0) {
      setAuthMsg("That username is already taken.", "error"); return;
    }

    const pwHash = await _sha256(password + username + "marathon_salt");
    const id     = crypto.randomUUID();

    await sbFetch("/rest/v1/profiles", {
      method: "POST",
      extraHeaders: { "Prefer": "return=minimal" },
      body: JSON.stringify({
        id, username, pw_hash: pwHash,
        faction_data: { LV: {}, PL: {} },
        updated_at: new Date().toISOString()
      })
    });

    authToken = id;
    authUser  = { id, username };
    _onAuthOK();
    setAuthMsg("Welcome, " + username + "!", "success");
    setTimeout(closeAuthModal, 900);

  } catch(e) {
    console.error("Sign-up error:", e);
    setAuthMsg("Sign-up failed: " + (e.message || "unknown error"), "error");
  }
}

// ══════════════════════════════════════════
// SIGN IN
// ══════════════════════════════════════════
async function authSignIn(username, password) {
  if (!username || !password) { setAuthMsg("Enter username and password.", "error"); return; }
  setAuthMsg("Signing in…", "info");

  try {
    const rows = await sbFetch(`/rest/v1/profiles?username=eq.${encodeURIComponent(username)}&select=*`);

    if (!Array.isArray(rows) || rows.length === 0) {
      setAuthMsg("Username not found.", "error"); return;
    }

    const pwHash = await _sha256(password + username + "marathon_salt");
    if (rows[0].pw_hash !== pwHash) {
      setAuthMsg("Incorrect password.", "error"); return;
    }

    const row = rows[0];
    authToken = row.id;
    authUser  = { id: row.id, username };

    const fd = row.faction_data || {};
    if (fd.LV) Object.assign(LV, fd.LV);
    if (fd.PL) Object.assign(PL, fd.PL);
    refresh();

    _onAuthOK();
    setAuthMsg("Welcome back, " + username + "!", "success");
    setTimeout(closeAuthModal, 900);

  } catch(e) {
    console.error("Sign-in error:", e);
    setAuthMsg("Sign-in failed: " + (e.message || "unknown error"), "error");
  }
}

async function tryRestoreSession() {
  try {
    const token = sessionStorage.getItem("mara_token");
    const user  = JSON.parse(sessionStorage.getItem("mara_user") || "null");
    if (!token || !user) return;
    authToken = token; authUser = user;

    const rows = await sbFetch(`/rest/v1/profiles?id=eq.${user.id}&select=*`);
    if (Array.isArray(rows) && rows[0]) {
      authUser.username = rows[0].username;
      const fd = rows[0].faction_data || {};
      if (fd.LV) Object.assign(LV, fd.LV);
      if (fd.PL) Object.assign(PL, fd.PL);
      refresh();
      renderAuthWidget();
      updateSquadPill();
      updateHdr();
      const code = new URLSearchParams(window.location.search).get("session");

      authUser = authToken = null;
      sessionStorage.clear();
    }
  } catch(e) {
    authUser = authToken = null;
    try { sessionStorage.clear(); } catch(_){}
  }
}

  const pw    = document.getElementById("a-pw")?.value;
  authSignUp(uname, pw);
}

// ══════════════════════════════════════════
// SQUAD SESSIONS
// ══════════════════════════════════════════
function _genCode() {
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length:6},()=>chars[Math.floor(Math.random()*32)]).join("");
}

async function squadCreate() {
  if (!authUser) { openAuthModal("login"); return; }
  sessionCode = _genCode();
  await _squadUpsertRow();
  _startPolling();
  updateSquadPill();
  if (curTab==="squad") renderSquadPage();
}

async function squadJoin(code) {
  if (!authUser) { openAuthModal("login"); return; }
  sessionCode = code.toUpperCase().trim();
  if (!sessionCode) return;
  await _squadUpsertRow();
  _startPolling();
  updateSquadPill();
  if (curTab==="squad") renderSquadPage();
}

async function _squadUpsertRow() {
  const name = authUser.username || authUser.email;
  // delete then insert for clean upsert
  await sbFetch(`/rest/v1/sessions?session_code=eq.${sessionCode}&player_name=eq.${encodeURIComponent(name)}`,
    { method:"DELETE" });
  await sbFetch("/rest/v1/sessions", {
    method: "POST",
    extraHeaders: { "Prefer": "return=minimal" },
    body: JSON.stringify({
      session_code: sessionCode,
      player_name: name,
      faction_data: { LV, PL },
      updated_at: new Date().toISOString()
    })
  });
}

async function squadLeave() {
  if (sessionCode && authUser) {
    const name = authUser.username || authUser.email;
    await sbFetch(`/rest/v1/sessions?session_code=eq.${sessionCode}&player_name=eq.${encodeURIComponent(name)}`,
      { method:"DELETE" });
  }
  if (sqPollTimer) clearInterval(sqPollTimer);
  sqPollTimer = null;
  sessionCode = null; squadPlayers = {}; squadViewTab = null;
  updateSquadPill();
  if (curTab==="squad") renderSquadPage();
}

async function _squadPushData() {
  if (!sessionCode || !authUser) return;
  const name = authUser.username || authUser.email;
  await sbFetch(`/rest/v1/sessions?session_code=eq.${sessionCode}&player_name=eq.${encodeURIComponent(name)}`, {
    method: "PATCH",
    extraHeaders: { "Prefer": "return=minimal" },
    body: JSON.stringify({ faction_data:{ LV, PL }, updated_at: new Date().toISOString() })
  });
}

function _startPolling() {
  _loadSquad();
  if (sqPollTimer) clearInterval(sqPollTimer);
  sqPollTimer = setInterval(_loadSquad, 3000);
}

async function _loadSquad() {
  if (!sessionCode) return;
  const rows = await sbFetch(`/rest/v1/sessions?session_code=eq.${sessionCode}&select=player_name,faction_data,updated_at&order=updated_at`);
  if (!Array.isArray(rows)) return;
  squadPlayers = {};
  rows.forEach(r => { squadPlayers[r.player_name] = r; });
  updateSquadPill();
  if (curTab==="squad") renderSquadPage();
}

function copyInviteLink() {
  if (!sessionCode) return;
  const url = `${location.origin}${location.pathname}?session=${sessionCode}`;
  navigator.clipboard.writeText(url).catch(()=>{});
  const btn = document.getElementById("sq-copy-btn");
  if (btn) { const old=btn.textContent; btn.textContent="✓ COPIED!"; setTimeout(()=>btn.textContent=old, 2000); }
}

// SQUAD PILL (collapsed bottom-right pill)
// ══════════════════════════════════════════
let pillOpen = false;

function updateSquadPill() {
  const pill   = document.getElementById("squad-pill");
  const dot    = document.getElementById("squad-pill-dot");
  const label  = document.getElementById("squad-pill-label");
  const count  = document.getElementById("squad-pill-count");
  const navDot = document.getElementById("squad-nav-dot");
  if (!pill) return;

  const players   = Object.values(squadPlayers);
  const connected = !!sessionCode;

  pill.classList.toggle("connected", connected);
  if (dot)    dot.className  = "squad-dot " + (connected ? "online" : "offline");
  if (navDot) navDot.className = "squad-dot " + (connected ? "online" : "offline");
  if (label)  label.textContent = connected ? sessionCode : "SQUAD";
  if (count) {
    count.style.display = (players.length && connected) ? "inline" : "none";
    count.textContent = players.length;
  }
  if (pillOpen) renderSquadPillBody();
}
function updateSquadWidget() { updateSquadPill(); } // alias

function renderSquadPillBody() {
  const el = document.getElementById("squad-widget-body");
  if (!el) return;
  const players = Object.values(squadPlayers);
  const myName  = authUser?.username;

  el.innerHTML = !authUser ? `
    <div style="color:var(--text-dim);font-size:.82rem;margin-bottom:12px;line-height:1.7">Sign in to create or join a squad and share builds live.</div>
    <button class="sq-btn" style="border-color:var(--green);color:var(--green)" onclick="openAuthModal('login')">SIGN IN TO USE SQUAD</button>
  ` : !sessionCode ? `
    <div style="color:var(--text-dim);font-size:.82rem;margin-bottom:12px;line-height:1.7">Create or join a session to share builds live with your team.</div>
    <button class="sq-btn" style="border-color:var(--green);color:var(--green)" onclick="squadCreate()">+ CREATE SESSION</button>
    <div style="display:flex;gap:6px;margin-top:8px">
      <input id="sq-join-input" class="sq-input" placeholder="6-char code" maxlength="6" style="flex:1;text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
      <button class="sq-btn" onclick="squadJoin(document.getElementById('sq-join-input').value)" style="width:auto;padding:0 12px;flex-shrink:0;margin:0">JOIN</button>
    </div>
  ` : `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="font-family:'Orbitron',monospace;font-size:1rem;color:var(--cyan);letter-spacing:3px">${sessionCode}</span>
      <button id="sq-copy-btn" class="sq-btn" onclick="copyInviteLink()" style="width:auto;padding:2px 10px;font-size:.7rem;margin:0">📋 COPY</button>
    </div>
    <div style="margin-bottom:10px">
      ${players.map(p=>{
        const isMe = p.player_name===myName;
        const ago  = Math.round((Date.now()-new Date(p.updated_at).getTime())/1000);
        const live = ago < 8;
        return `<div class="sq-player">
          <div style="width:7px;height:7px;border-radius:50%;flex-shrink:0;background:${isMe?"var(--cyan)":live?"var(--green)":"var(--text-dead)"}"></div>
          <span style="color:${isMe?"var(--cyan)":"var(--text)"}">${p.player_name}</span>
          <span style="margin-left:auto;font-size:.7rem;color:var(--text-dead)">${isMe?"YOU":live?"live":ago+"s ago"}</span>
        </div>`;
      }).join("")}
    </div>
    <button class="sq-btn" onclick="showMain('squad')" style="border-color:var(--cyan);color:var(--cyan)">VIEW SQUAD BUILDS →</button>
    <button class="sq-btn" onclick="squadLeave()" style="border-color:var(--red);color:var(--red)">LEAVE SESSION</button>
  `;
}

function toggleSquadPill() {
  pillOpen = !pillOpen;
  const panel   = document.getElementById("squad-pill-panel");
  const pill    = document.getElementById("squad-pill");
  const chevron = document.getElementById("squad-pill-chevron");
  if (panel)   panel.classList.toggle("open", pillOpen);
  if (pill)    pill.classList.toggle("open", pillOpen);
  if (chevron) chevron.textContent = pillOpen ? "▼" : "▲";
  if (pillOpen) renderSquadPillBody();
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARATHON // UPGRADE TRACKER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:#070d12;color:#c8d8e8;font-family:'Share Tech Mono',monospace;font-size:13px;min-height:100vh;
  background-image:radial-gradient(ellipse at 10% 10%,rgba(0,229,255,.04) 0,transparent 60%),radial-gradient(ellipse at 90% 90%,rgba(255,0,110,.03) 0,transparent 60%)}
#hdr{padding:12px 24px;border-bottom:1px solid #1a2530;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:rgba(0,229,255,.02);position:sticky;top:0;z-index:300;backdrop-filter:blur(14px)}
.logo{font-family:'Orbitron',monospace;font-weight:900;font-size:20px;color:#00e5ff;letter-spacing:5px;
  text-shadow:0 0 20px rgba(0,229,255,.5)}
.logo sub{font-size:9px;color:#4a6070;letter-spacing:2px;margin-left:8px}
.hstats{margin-left:auto;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hs{text-align:center;position:relative}
.hs .v{font-size:18px;font-weight:700;display:block}
.hs .l{font-size:9px;color:#4a6070;letter-spacing:1px}
.hs-hoverable{cursor:help}
.save-menu{position:relative;display:inline-block}
.save-menu-btn{font-size:10px;letter-spacing:1px;padding:6px 14px;border:1px solid #39ff14;cursor:pointer;background:transparent;transition:all .2s;font-family:inherit;color:#39ff14;display:flex;align-items:center;gap:5px}
.save-menu-btn:hover,.save-menu:hover .save-menu-btn{background:rgba(57,255,20,.1)}
.save-menu-btn::after{content:"▾";font-size:9px;margin-left:2px}
.save-dropdown{display:none;position:absolute;top:100%;right:0;z-index:400;background:#091420;border:1px solid #39ff14;min-width:150px;box-shadow:0 4px 20px rgba(0,0,0,.8)}
.save-menu:hover .save-dropdown{display:block}
.save-dropdown button{display:block;width:100%;text-align:left;padding:8px 14px;background:transparent;border:none;border-bottom:1px solid #1a2530;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:1px;color:#c8d8e8;transition:background .15s}
.save-dropdown button:last-child{border-bottom:none}
.save-dropdown button:hover{background:rgba(57,255,20,.08);color:#39ff14}
.btn{font-size:10px;letter-spacing:1px;padding:6px 14px;border:1px solid;cursor:pointer;background:transparent;transition:all .2s;font-family:inherit}
.br{border-color:#ff006e;color:#ff006e}.br:hover{background:rgba(255,0,110,.1)}
.bg{border-color:#39ff14;color:#39ff14}.bg:hover{background:rgba(57,255,20,.1)}
.by{border-color:#ffd600;color:#ffd600}.by:hover{background:rgba(255,214,0,.1)}
.bb{border-color:#4a9eff;color:#4a9eff}.bb:hover{background:rgba(74,158,255,.1)}
#prog{height:3px;background:#1a2530}
#prog-f{height:100%;background:linear-gradient(90deg,#00e5ff,#39ff14);transition:width .5s;box-shadow:0 0 8px rgba(0,229,255,.5)}
#mtabs{display:flex;border-bottom:1px solid #1a2530;background:rgba(0,0,0,.3);overflow-x:auto}
.mtab{font-size:11px;letter-spacing:1px;padding:12px 22px;border:none;background:transparent;cursor:pointer;
  color:#4a6070;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;font-family:inherit}
.mtab.on{color:#fff;border-bottom-color:#00e5ff}
#fbar{display:flex;gap:7px;padding:11px 20px;border-bottom:1px solid #1a2530;flex-wrap:wrap;align-items:center;background:rgba(0,0,0,.2)}
.fbtn{font-size:11px;letter-spacing:1px;padding:6px 13px;border:1px solid #1a2530;background:transparent;cursor:pointer;
  color:#4a6070;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:5px}
.fdot{width:7px;height:7px;border-radius:50%;background:#2a3a48;flex-shrink:0}
.fcnt{font-size:9px;padding:1px 5px;background:#1a2530;margin-left:2px}
.fbtn.on .fcnt{color:#000}
#tctrl{display:flex;gap:8px;padding:9px 20px;border-bottom:1px solid #1a2530;align-items:center;flex-wrap:wrap;background:rgba(0,0,0,.12)}
.tcbtn{font-size:11px;padding:5px 13px;border:1px solid #1a2530;background:transparent;color:#4a6070;cursor:pointer;transition:all .2s;font-family:inherit}
.tcbtn.ony{border-color:#ffd600;color:#ffd600;background:rgba(255,214,0,.07)}
.tcbtn.ong{border-color:#39ff14;color:#39ff14;background:rgba(57,255,20,.07)}
#fi{padding:7px 20px;border-bottom:1px solid;display:flex;align-items:center;gap:14px;font-size:10px}
.fi-name{font-family:'Orbitron',monospace;font-size:13px;letter-spacing:2px}
#legend{display:flex;gap:14px;flex-wrap:wrap;padding:6px 20px;border-bottom:1px solid #1a2530;font-size:9px;color:#4a6070}
.leg{display:flex;align-items:center;gap:5px}.legbox{width:11px;height:11px;border:1px solid}
#tscroll{overflow:auto;padding:20px;position:relative;min-height:400px}
#tcanvas{position:relative;transform-origin:top left}
#tsvg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.node{position:absolute;border:1px solid #1a2530;background:#0d1318;border-top-width:3px;
  transition:transform .15s,box-shadow .2s;user-select:none}
.node.clickable{cursor:pointer}
.node.clickable:hover{transform:translateY(-2px);z-index:10}
.node.unlocked{box-shadow:0 0 18px var(--ng)}
.node.planned{box-shadow:0 0 14px rgba(191,90,242,.4)}
.node.locked-out{opacity:.32;cursor:not-allowed}
.node-inner{padding:10px 11px;display:flex;flex-direction:column;height:100%}
.n-title{font-family:'Orbitron',monospace;font-size:11.5px;font-weight:700;color:#fff;letter-spacing:.5px;line-height:1.3;margin-bottom:4px}
.n-badges{display:flex;gap:3px;margin-bottom:4px;flex-wrap:wrap}
.bdg{font-size:9.5px;padding:2px 5px;border:1px solid}
.b-stat{border-color:#4a90e2;color:#4a90e2}.b-arm{border-color:#8aad6a;color:#8aad6a}
.b-fun{border-color:#c77dff;color:#c77dff}.b-inv{border-color:#ffd600;color:#ffd600}
.b-rnk{border-color:#2a3a48;color:#4a6070}.b-unv{border-color:#ff6d00;color:#ff6d00}
.n-eff{font-size:10px;font-weight:700;margin-bottom:3px}
.n-desc{color:#6a8090;font-size:10px;line-height:1.5;overflow:hidden;flex:1}
.n-pips{display:flex;gap:4px;margin-top:auto;padding-top:6px;border-top:1px solid #1a2530}
.pip{flex:1;height:6px;background:#1a2530;cursor:pointer;position:relative;overflow:hidden}
.pip-fill{position:absolute;inset:0;transition:background .15s}
.node.locked-out .pip{cursor:not-allowed}
.n-cost{font-size:9.5px;color:#ffd600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-check{position:absolute;top:4px;right:6px;font-size:10px;font-weight:700}
.n-lock{position:absolute;top:4px;right:6px;font-size:11px;color:#2a3a48}

/* TOOLTIP */
#tt{display:none;position:fixed;z-index:9999;background:#091420;border:1px solid #1a2530;padding:12px 14px;
  min-width:260px;max-width:320px;pointer-events:none;box-shadow:0 4px 28px rgba(0,0,0,.85)}
.tt-name{font-family:'Orbitron',monospace;font-size:12px;margin-bottom:7px}
.tt-lvl{padding:8px 10px;border:1px solid #1a2530;margin-bottom:5px;font-size:10.5px}
.tt-lvl.cur{border-color:#ffd600}
.tt-lvl-hd{display:flex;justify-content:space-between;margin-bottom:2px}
.tt-lvl-n{color:#c8d8e8}.tt-lvl-c{color:#ffd600}
.tt-lvl-e{font-size:9px;font-weight:700;margin-bottom:2px}
.tt-lvl-s{color:#ff6d00;font-size:9.5px}
.tt-rank{font-size:9px;color:#4a6070;margin-top:2px}
.tt-loc{font-size:10.5px;border-top:1px solid #1a2530;padding-top:6px;margin-top:5px;color:#4a6070}

.view{display:none}.view.on{display:block}
#sv{padding:20px}.sv-hdr{font-family:'Orbitron',monospace;font-size:13px;color:#00e5ff;letter-spacing:3px;margin-bottom:14px}
.sv-empty{color:#4a6070;text-align:center;padding:60px;letter-spacing:2px;font-size:12px}
.sv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;margin-bottom:14px}
.svc{background:#0d1318;border:1px solid #1a2530;padding:12px 14px}
.svc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.svc-n{color:#fff;font-size:11px}.svc-q{font-size:17px;font-weight:700;color:#ffd600}
.svc-r{font-size:8px;padding:2px 6px;border:1px solid;text-transform:uppercase;letter-spacing:1px}
.sv-tots{background:#0d1318;border:1px solid #1a2530;padding:14px 18px}
.sv-tot-hdr{font-family:'Orbitron',monospace;font-size:10px;color:#00e5ff;letter-spacing:2px;margin-bottom:10px}
.sv-row{display:flex;gap:10px;margin-bottom:5px;font-size:11px}
.sv-tips{margin-top:10px;color:#4a6070;font-size:9px;line-height:2}

#bv{padding:20px}.bv-hdr{font-family:'Orbitron',monospace;font-size:13px;color:#00e5ff;letter-spacing:3px;margin-bottom:14px}
.bv-empty{color:#4a6070;text-align:center;padding:60px;letter-spacing:2px;font-size:12px}
.bv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:14px}
.bvc{background:#0d1318;padding:10px 12px;border:1px solid #1a2530}
.rec-box{background:#0d1318;border:1px solid #1a2530;padding:12px 16px;margin-bottom:12px}
.rec-hdr{font-family:'Orbitron',monospace;font-size:10px;color:#39ff14;letter-spacing:2px;margin-bottom:8px}
.rec-steps{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.rs{font-size:9px;padding:4px 8px;border:1px solid #2a3a48;color:#4a6070}
.rs.done{color:var(--sc);border-color:var(--sc);background:var(--sb)}
.fb-box{background:#0d1318;border:1px solid #1a2530;padding:12px 16px}
.fb-hdr{font-family:'Orbitron',monospace;font-size:10px;color:#00e5ff;letter-spacing:2px;margin-bottom:8px}
.fbr{display:flex;align-items:center;gap:10px;margin-bottom:5px;padding:4px 6px;font-size:10px}

#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center}
#modal-bg.on{display:flex}
#modal{background:#0d1318;border:1px solid #1a2530;padding:20px;min-width:340px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto}
.mhdr{font-family:'Orbitron',monospace;font-size:11px;color:#00e5ff;letter-spacing:2px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.mclose{cursor:pointer;color:#ff006e;background:none;border:none;font-size:14px;font-family:inherit}
.brow{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#070d12;border:1px solid #1a2530;margin-bottom:5px}
.brow-n{flex:1;font-size:10px;color:#c8d8e8}.brow-d{font-size:8px;color:#4a6070}
.brow-acts{display:flex;gap:4px}
.sinput{width:100%;background:#070d12;border:1px solid #1a2530;color:#c8d8e8;padding:6px 8px;font-family:inherit;font-size:10px;margin-bottom:8px}
.sinput:focus{outline:none;border-color:#00e5ff}
.mbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
/* ── SQUAD SESSION WIDGET ── */
#squad-widget{position:fixed;bottom:18px;right:18px;z-index:500;background:#0d1318;border:1px solid #1a2530;min-width:220px;box-shadow:0 4px 24px rgba(0,0,0,.8)}
#squad-widget-hdr{padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid #1a2530;background:rgba(0,229,255,.02)}
.sq-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sq-status.online{background:#39ff14;box-shadow:0 0 6px #39ff14}
.sq-status.offline{background:#4a6070}
.sq-status.connecting{background:#ffd600;animation:sqpulse .8s ease-in-out infinite}
@keyframes sqpulse{0%,100%{opacity:1}50%{opacity:.3}}
#squad-widget-body{padding:10px 12px;font-size:9px}
.sq-code{font-family:'Orbitron',monospace;font-size:13px;color:#00e5ff;letter-spacing:3px;margin:4px 0 8px}
.sq-player{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid #1a2530}
.sq-player:last-child{border-bottom:none}
.sq-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sq-you{font-size:8px;padding:1px 4px;background:rgba(0,229,255,.1);border:1px solid #00e5ff;color:#00e5ff;margin-left:auto}
.sq-live{width:6px;height:6px;border-radius:50%;background:#39ff14;box-shadow:0 0 4px #39ff14;animation:sqpulse .6s ease-in-out infinite;margin-left:auto}
.sq-btn{width:100%;padding:6px;background:transparent;border:1px solid #1a2530;color:#c8d8e8;cursor:pointer;font-family:inherit;font-size:9px;letter-spacing:1px;margin-top:6px;transition:all .2s}
.sq-btn:hover{border-color:#00e5ff;color:#00e5ff}
.sq-btn.green{border-color:#39ff14;color:#39ff14}.sq-btn.green:hover{background:rgba(57,255,20,.08)}
.sq-input{width:100%;background:#070d12;border:1px solid #1a2530;color:#c8d8e8;padding:5px 8px;font-family:inherit;font-size:10px;margin-bottom:6px;letter-spacing:1px}
.sq-input:focus{outline:none;border-color:#00e5ff}
/* ── RUNNER PAGE ── */
#rv{padding:20px}
.rv-hdr{font-family:'Orbitron',monospace;font-size:14px;color:#00e5ff;letter-spacing:3px;margin-bottom:6px}
.rv-sub{font-size:10px;color:#4a6070;margin-bottom:20px}
.runner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:24px}
.runner-card{background:#0d1318;border:1px solid #1a2530;cursor:pointer;transition:all .2s;border-top-width:3px}
.runner-card:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.runner-card-hdr{padding:14px 16px;display:flex;align-items:center;gap:12px}
.runner-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.runner-card-body{padding:0 16px 14px}
.runner-tier{font-size:8px;padding:2px 6px;border:1px solid;letter-spacing:1px;margin-left:auto}
.runner-detail{display:none;padding:20px}
.runner-detail.on{display:block}
.rd-back{font-size:9px;color:#4a6070;cursor:pointer;margin-bottom:14px;letter-spacing:1px}
.rd-back:hover{color:#00e5ff}
.rd-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.rd-box{background:#0d1318;border:1px solid #1a2530;padding:12px 14px}
.rd-box-hdr{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;margin-bottom:10px}
.rd-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;font-size:9px}
.rd-row-icon{flex-shrink:0;margin-top:1px}
.rd-load-btn{margin-top:12px;padding:8px 16px;background:transparent;border:1px solid #39ff14;color:#39ff14;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:1px;transition:all .2s;width:100%}
.rd-load-btn:hover{background:rgba(57,255,20,.1)}
.upgrade-tag{display:inline-block;font-size:8px;padding:2px 6px;border:1px solid #1a2530;margin:2px;color:#c8d8e8}
/* ── SQUAD PAGE ── */
#sqv{padding:20px}
.sqv-hdr{font-family:'Orbitron',monospace;font-size:14px;color:#00e5ff;letter-spacing:3px;margin-bottom:6px}
.player-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #1a2530;margin-bottom:14px}
.player-tab{padding:6px 14px;border:1px solid #1a2530;cursor:pointer;font-size:10px;color:#4a6070;transition:all .2s;font-family:inherit;background:transparent}
.player-tab.active{color:#fff;border-color:var(--pc)}
.player-tab.you::after{content:" (YOU)";font-size:7px;color:#00e5ff}

/* AUTH MODAL */
.auth-modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;align-items:center;justify-content:center}
.auth-modal-wrap.on{display:flex}
.auth-modal-box{background:#0d1318;border:1px solid #00e5ff;padding:26px 28px;width:400px;max-width:95vw;position:relative}
.sinput{display:block;width:100%;background:#070d12;border:1px solid #1a2530;color:#c8d8e8;padding:9px 12px;font-family:inherit;font-size:10.5px;margin-bottom:9px;outline:none;transition:border .2s}
.sinput:focus{border-color:#00e5ff}
/* SQUAD WIDGET */
.sq-player{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1a2530}
.sq-player:last-child{border-bottom:none}
.sq-btn{display:block;width:100%;padding:7px 10px;margin-bottom:5px;background:transparent;border:1px solid #1a2530;color:#4a6070;cursor:pointer;font-family:inherit;font-size:9.5px;letter-spacing:1px;transition:all .2s;text-align:center}
.sq-btn:hover{background:rgba(255,255,255,.04)}
.sq-input{display:block;width:100%;background:#070d12;border:1px solid #1a2530;color:#c8d8e8;padding:7px 10px;font-family:inherit;font-size:10px;outline:none;letter-spacing:2px}

</style>
</head>
<body>

<!-- AUTH MODAL -->
<div id="auth-modal" class="auth-modal-wrap">
  <div class="auth-modal-box">
    <button onclick="closeAuthModal()" style="position:absolute;top:12px;right:14px;background:transparent;border:none;color:#4a6070;cursor:pointer;font-size:14px;font-family:inherit">✕</button>
    <div id="auth-modal-body"></div>
  </div>
</div>

<div id="hdr">
  <div class="logo">MARATHON <sub>// UPGRADE TRACKER</sub></div>
  <div class="hstats">
    <div class="hs"><span class="v" id="h-lvs" style="color:#39ff14;text-shadow:0 0 8px rgba(57,255,20,.4)">0</span><span class="l">LEVELS</span></div>
    <div class="hs hs-hoverable" onmouseenter="showCredHdrTT(event)" onmouseleave="hideTT()" onmousemove="moveTT(event)">
      <span class="v" id="h-cred" style="color:#bf5af2;text-shadow:0 0 8px rgba(191,90,242,.4)">₵0</span>
      <span class="l">PLANNED ₵ ▲</span>
    </div>
    <div class="hs hs-hoverable" id="hs-salv" onmouseenter="showSalvHdrTT(event)" onmouseleave="hideTT()" onmousemove="moveTT(event)">
      <span class="v" id="h-salv" style="color:#ff6d00">0</span>
      <span class="l">OWNED SALVAGE ▲</span>
    </div>
    <div class="hs hs-hoverable" id="hs-plan" onmouseenter="showPlanHdrTT(event)" onmouseleave="hideTT()" onmousemove="moveTT(event)">
      <span class="v" id="h-plan" style="color:#bf5af2">0</span>
      <span class="l">PLANNED SALVAGE ▲</span>
    </div>
    <div class="save-menu">
      <button class="save-menu-btn">💾 SAVE BUILD</button>
      <div class="save-dropdown">
        <button onclick="openModal('save')">💾 Save Build</button>
        <button onclick="openModal('load')">📂 Load Build</button>
        <button onclick="doExport()">⬇ Export .TXT</button>
      </div>
    </div>
    <button class="btn br" onclick="resetAll()">⟳ RESET</button>
    <div id="auth-widget" style="display:flex;align-items:center;gap:8px;padding-left:14px;border-left:1px solid #1a2530"></div>
  </div>
</div>
<div id="prog"><div id="prog-f" style="width:0%"></div></div>
<div id="mtabs">
  <button class="mtab on" onclick="showMain('tree')">🌐 UPGRADE TREE</button>
  <button class="mtab" onclick="showMain('salvage')">◈ SALVAGE PLANNER</button>
  <button class="mtab" onclick="showMain('build')">📋 BUILD SUMMARY</button>
  <button class="mtab" onclick="showMain('runners')">🏃 RUNNER BUILDS</button>
  <button class="mtab" onclick="showMain('guns')">🔫 GUNS & ITEMS</button>
  <button class="mtab" onclick="showMain('map')">🗺️ MAP</button>
  <button class="mtab" onclick="showMain('runs')">📊 RUN TRACKER</button>
  <button class="mtab" onclick="showMain('loadout')">🎒 LOADOUT</button>
  <button class="mtab" onclick="showMain('contracts')">📋 CONTRACTS</button>
  <button class="mtab" onclick="showMain('ammo')">🔹 AMMO CALC</button>
  <button class="mtab" onclick="showMain('squad')">👥 SQUAD</button>
</div>

<div id="view-tree" class="view on">
  <div id="fbar"></div>
  <div id="tctrl">
    <button class="tcbtn" id="btn-hi" onclick="toggleHi()">★ REDDIT BUILD GUIDE</button>
    <button class="tcbtn" id="btn-rec" onclick="toggleRec()">⚡ REC. PATH</button>
    <button class="tcbtn" id="btn-fit" onclick="fitTree()" title="Scale tree to fit your window">⊡ FIT TO SCREEN</button>

const REC=["nc_saf","ar_cred","ar_inf","ca_cred","ca_sink","nc_shie","nc_rest",

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let LV={};   // owned levels (left-click, faction colour)
let PL={};   // planned levels (right-click, purple)
UG.forEach(u=>{LV[u.id]=0; PL[u.id]=0;});
let curF="CyberAcme",curTab="tree",showHi=false,showRec=false;
const NW=210,NH=138,GX=30,GY=18;

const canUnlock=u=>!u.deps||u.deps.every(d=>LV[d]>0||PL[d]>0);
const isOn=id=>LV[id]>0;
const isPlan=id=>PL[id]>0&&LV[id]===0;
const getActives=()=>UG.filter(u=>LV[u.id]>0);
const getPlanned=()=>UG.filter(u=>PL[u.id]>0&&LV[u.id]===0);
const getMaxLv=u=>u.levels.length;

// Salvage for owned only
function getSalvMap(){
  const m={};
  getActives().forEach(u=>{
    for(let i=0;i<LV[u.id];i++)
      u.levels[i].salvage.forEach(s=>{m[s.i]=(m[s.i]||0)+s.q;});
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
// Salvage for planned only
function getSalvMapPlanned(){
  const m={};
  getPlanned().forEach(u=>{
    for(let i=0;i<PL[u.id];i++)
      u.levels[i].salvage.forEach(s=>{m[s.i]=(m[s.i]||0)+s.q;});
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function hideTT(){document.getElementById("tt").style.display="none";}

function cycleNode(id,planned=false){
  hideTT();
  const u=UG.find(x=>x.id===id);
  const max=getMaxLv(u);
  if(planned){ LV[id]=0; PL[id]=(PL[id]+1)%(max+1); }
  else { PL[id]=0; LV[id]=(LV[id]+1)%(max+1); }
  refresh();
}
function setLv(id,lv,planned=false){
  hideTT();
  if(planned){ LV[id]=0; PL[id]=lv; }
  else { PL[id]=0; LV[id]=lv; }
  refresh();
}
function resetAll(){
  hideTT();
  UG.forEach(u=>{LV[u.id]=0; PL[u.id]=0;});
  refresh();
}
function refresh(){renderCurrent();updateHdr();maybeSync();}

function getTotalCreds(){
  return getActives().reduce((s,u)=>{let c=0;for(let i=0;i<LV[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
}
function getTotalCredsPlanned(){
  return getPlanned().reduce((s,u)=>{let c=0;for(let i=0;i<PL[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
}

// ══════════════════════════════════════════
// HEADER
// ══════════════════════════════════════════
function updateHdr(){
  const totalLvs=getActives().reduce((s,u)=>s+LV[u.id],0);
  document.getElementById("h-lvs").textContent=totalLvs;
  // Credits header shows planned (right-click) costs only; owned shown on hover
  document.getElementById("h-cred").textContent="₵"+getTotalCredsPlanned().toLocaleString();
  document.getElementById("h-salv").textContent=getSalvMap().length;
  document.getElementById("h-plan").textContent=getSalvMapPlanned().length;
  const maxLvs=UG.reduce((s,u)=>s+u.levels.length,0);
  document.getElementById("prog-f").style.width=Math.min(100,totalLvs/maxLvs*100)+"%";
}

// ══════════════════════════════════════════
// TABS
// ══════════════════════════════════════════
function showMain(t){
  curTab=t;
  const tabs=["tree","salvage","build","runners","guns","map","runs","loadout","contracts","ammo","squad"];
  document.querySelectorAll(".mtab").forEach((b,i)=>b.classList.toggle("on",tabs[i]===t));
  ["view-tree","view-salvage","view-build","view-runners","view-guns","view-map","view-runs","view-loadout","view-contracts","view-ammo","view-squad"].forEach((id,i)=>
    document.getElementById(id).classList.toggle("on",tabs[i]===t));
  renderCurrent();
}
function renderCurrent(){
  if(curTab==="tree") renderTree();
  else if(curTab==="salvage") renderSalv();
  else if(curTab==="build") renderBuild();
  else if(curTab==="runners") renderRunners();
  else if(curTab==="guns") renderGuns();
  else if(curTab==="map") renderMap();
  else if(curTab==="runs") renderRuns();
  else if(curTab==="loadout") renderLoadout();
  else if(curTab==="contracts") renderContracts();
  else if(curTab==="ammo") renderAmmo();
  else if(curTab==="squad") renderSquadPage();
}
function toggleHi(){
  showHi=!showHi;
  document.getElementById("btn-hi").classList.toggle("ony",showHi);
  renderTree();
}
function toggleRec(){
  showRec=!showRec;
  document.getElementById("btn-rec").classList.toggle("ong",showRec);
  renderTree();
}

// ══════════════════════════════════════════
// FACTION BAR
// ══════════════════════════════════════════
function buildFbar(){
  document.getElementById("fbar").innerHTML=Object.keys(FC).map(f=>{
    const fc=FC[f];
    const nodes=UG.filter(u=>u.f===f);
    const tot=nodes.reduce((s,u)=>s+u.levels.length,0);
    const act=nodes.reduce((s,u)=>s+LV[u.id],0);
    const on=f===curF;
    return`<button class="fbtn${on?" on":""}"
      style="${on?`border-color:${fc.color};color:${fc.color};background:${fc.bg}`:""}"
      onclick="setF('${f}')">
      <span class="fdot" style="${on?`background:${fc.color}`:""}"></span>
      ${f.toUpperCase()}
      <span class="fcnt" style="${on?`background:${fc.color};color:#000`:""}">
        ${act}/${tot}
      </span></button>`;
  }).join("");
}
function setF(f){curF=f;buildFbar();renderTree();}

// ══════════════════════════════════════════
// TREE
// ══════════════════════════════════════════
function renderTree(){
  hideTT();
  buildFbar();
  const fc=FC[curF];
  const fi=document.getElementById("fi");
  fi.style.cssText=`background:${fc.bg};border-bottom-color:${fc.dim};padding:5px 14px;border-bottom:1px solid;display:flex;align-items:center;gap:10px;font-size:9px`;
  fi.innerHTML=`<span class="fi-name" style="color:${fc.color}">${curF}</span>
    <span style="color:#4a6070">Handler: ${fc.handler}</span>
    ${showRec?`<span style="margin-left:auto;color:#39ff14;font-size:8px">⚡ green = next unlock</span>`:""}`;

  let nodes=UG.filter(u=>u.f===curF);
  if(showHi) nodes=nodes.filter(u=>u.hi||LV[u.id]>0);

  const nextRec=showRec?REC.find(id=>!isOn(id)&&nodes.find(u=>u.id===id)):null;
  const maxC=nodes.reduce((m,u)=>Math.max(m,u.col),0);
  const maxR=nodes.reduce((m,u)=>Math.max(m,u.row),0);
  const cW=(maxC+1)*(NW+GX)+GX, cH=(maxR+1)*(NH+GY)+GY+8;
  const canvas=document.getElementById("tcanvas");
  canvas.style.cssText=`position:relative;width:${cW}px;height:${cH}px`;
  const svg=document.getElementById("tsvg");
  svg.setAttribute("width",cW);svg.setAttribute("height",cH);

  // SVG edges
  let paths="";
  nodes.forEach(u=>{
    (u.deps||[]).forEach(dep=>{
      const from=nodes.find(x=>x.id===dep);
      if(!from)return;
      const x1=from.col*(NW+GX)+NW, y1=from.row*(NH+GY)+NH/2;
      const x2=u.col*(NW+GX), y2=u.row*(NH+GY)+NH/2;
      const mx=(x1+x2)/2;
      const active=isOn(dep)&&isOn(u.id);
      paths+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none"
        stroke="${active?fc.color:"#1a2530"}" stroke-width="${active?2:1}"
        stroke-dasharray="${active?"none":"4 3"}"/>`;
    });
  });
  svg.innerHTML=paths;
  canvas.querySelectorAll(".node").forEach(n=>n.remove());

  nodes.forEach(u=>{
    const x=u.col*(NW+GX), y=u.row*(NH+GY);
    const lv=LV[u.id], plv=PL[u.id], maxLv=getMaxLv(u);
    const on=lv>0, planned=plv>0&&lv===0;
    const isNext=u.id===nextRec;
    const locked=!canUnlock(u)&&!on&&!planned;
    const PLAN_COL="#bf5af2";
    const hiActive=showHi&&u.hi;
    const bc=on?fc.color:planned?PLAN_COL:isNext?"#39ff14":hiActive?"#ffd600":"#1a2530";
    const bg=on?fc.bg:planned?"rgba(191,90,242,.1)":isNext?"rgba(57,255,20,.06)":hiActive?"rgba(255,214,0,.04)":"#0d1318";
    const unverified=u.v===false;
    const activeLv=on?lv:planned?plv:0;
    const nextCostObj=u.levels[activeLv]||null;
    const typeClass={stat:"b-stat",arm:"b-arm",fun:"b-fun",inv:"b-inv"}[u.t]||"b-stat";
    const typeLabel={stat:"STAT",arm:"ARMORY",fun:"FUNCTION",inv:"INVENTORY"}[u.t]||"STAT";
    const currEff=activeLv>0?u.levels[activeLv-1].eff:"";
    const depNames=locked?(u.deps||[]).map(d=>{const du=UG.find(x=>x.id===d);return du?du.name:"?";}):[];

    // Pip bars — left pip = owned, right-click to plan
    const pipHtml=u.levels.map((_,i)=>{
      const ownedFill=i<lv?fc.color:"transparent";
      const planFill=i<plv&&lv===0?PLAN_COL:"transparent";
      const fillCol=ownedFill!=="transparent"?ownedFill:planFill;
      return`<div class="pip" title="L-click own Lv${i+1} / R-click plan Lv${i+1}"
        onclick="event.stopPropagation();${locked?'':` setLv('${u.id}',${lv===i+1?0:i+1},false)`}"
        oncontextmenu="event.preventDefault();event.stopPropagation();${locked?'':` setLv('${u.id}',${plv===i+1&&lv===0?0:i+1},true)`}">
        <div class="pip-fill" style="background:${fillCol}"></div>
      </div>`;
    }).join("");

    const div=document.createElement("div");
    div.className="node"+(on?" unlocked":planned?" planned":"")+(locked?" locked-out":" clickable");
    div.style.cssText=`left:${x}px;top:${y}px;width:${NW}px;height:${NH}px;
      --ng:${on?fc.color+"44":planned?PLAN_COL+"44":"transparent"};
      border-color:${bc};background:${bg};border-top-color:${bc}`;
    div.dataset.id=u.id;

    if(!locked){
      div.onclick=e=>{if(!e.target.classList.contains("pip"))cycleNode(u.id,false);};
      div.oncontextmenu=e=>{e.preventDefault();if(!e.target.classList.contains("pip"))cycleNode(u.id,true);};
    }

    div.innerHTML=`
      <div class="node-inner">
        <div class="n-title">
          ${hiActive?'<span style="color:#ffd600;font-size:9px">★ </span>':""}
          ${isNext?'<span style="color:#39ff14;font-size:9px">⚡ </span>':""}
          ${u.name}
        </div>
        <div class="n-badges">
          <span class="bdg ${typeClass}">${typeLabel}</span>
          <span class="bdg b-rnk">R${u.levels[0].rank}+</span>
          ${on?`<span class="bdg" style="border-color:${fc.color};color:${fc.color}">OWN LV${lv}/${maxLv}</span>`:""}
          ${planned?`<span class="bdg" style="border-color:${PLAN_COL};color:${PLAN_COL}">PLAN LV${plv}/${maxLv}</span>`:""}
          ${unverified?'<span class="bdg b-unv">⚠</span>':""}
        </div>
        ${locked
          ?`<div class="n-desc" style="color:#ff006e55;font-size:8px">🔒 Requires: ${depNames.join(", ")}</div>`
          :activeLv>0
            ?`<div class="n-eff" style="color:${on?fc.color:PLAN_COL};font-size:9px">${currEff}</div>`
            :`<div class="n-desc">${u.desc.substring(0,65)}${u.desc.length>65?"…":""}</div>`}
        <div class="n-pips">${pipHtml}</div>
        ${!locked?(nextCostObj
          ?`<div class="n-cost">→ ₵${nextCostObj.credits.toLocaleString()}${nextCostObj.salvage.length?" + "+nextCostObj.salvage.map(s=>`${s.i.split(" ").slice(0,2).join(" ")}×${s.q}`).join(", "):""}
</div>`
          :`<div style="font-size:8px;color:#39ff14;margin-top:4px">✓ MAX</div>`):""}
      </div>
      ${on?`<div class="n-check" style="color:${fc.color}">✓</div>`:""}
      ${planned?`<div class="n-check" style="color:${PLAN_COL}">◈</div>`:""}
      ${locked?`<div class="n-lock">🔒</div>`:""}`;

    div.addEventListener("mouseenter",e=>{
      if(locked){
        const depNames=(u.deps||[]).map(d=>{const du=UG.find(x=>x.id===d);return du?`<span style="color:#ffd600">${du.name}</span>`:"?";});
        const tt=document.getElementById("tt");
        tt.innerHTML=`<div style="font-family:'Orbitron',monospace;font-size:10px;color:#ff006e;margin-bottom:7px">🔒 LOCKED</div>
          <div style="font-size:9px;color:#8aa0b0;margin-bottom:5px">Unlock the following first:</div>
          ${depNames.map(n=>`<div style="font-size:9px;padding:3px 6px;border-left:2px solid #ffd600;margin-bottom:3px">${n}</div>`).join("")}`;
        tt.style.display="block";
        moveTT(e);
      } else {
        showTT(u,e);
      }
    });
    div.addEventListener("mouseleave",hideTT);
    div.addEventListener("mousemove",moveTT);
    canvas.appendChild(div);
  });
}

// ══════════════════════════════════════════
// TOOLTIP
// ══════════════════════════════════════════
function showTT(u,e){
  const fc=FC[u.f], lv=LV[u.id];
  const rows=u.levels.map((l,i)=>{
    const done=i<lv, cur=i===lv-1;
    return`<div class="tt-lvl${cur?" cur":""}">
      <div class="tt-lvl-hd">
        <span class="tt-lvl-n" style="${done?`color:${fc.color}`:""}">Level ${i+1}${done?" ✓":""}</span>

function showSalvTT(item,e){
  const loc=SL[item];
  const rc=loc?RC[loc.rarity]:"#4a6070";

  // Find which upgrades/levels need this item (owned + planned)
  const needs=[];
  getActives().forEach(u=>{
    for(let i=0;i<LV[u.id];i++){
      const s=u.levels[i].salvage.find(s=>s.i===item);
      if(s) needs.push({u,level:i+1,qty:s.q,type:"owned"});
    }
  });
  getPlanned().forEach(u=>{
    for(let i=0;i<PL[u.id];i++){
      const s=u.levels[i].salvage.find(s=>s.i===item);
      if(s) needs.push({u,level:i+1,qty:s.q,type:"planned"});
    }
  });
  const needRows=needs.map(n=>{
    const fc=FC[n.u.f];
    const col=n.type==="planned"?"#bf5af2":fc.color;
    const label=n.type==="planned"?"◈ PLAN":"✓ OWN";
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 5px;margin-bottom:2px;border-left:2px solid ${col};font-size:8.5px">
      <span style="color:${col}">${n.u.name}</span>
      <span style="color:#4a6070;margin:0 5px;font-size:7.5px">${label} Lv${n.level}</span>
      <span style="color:#ffd600;font-weight:700">×${n.qty}</span>
    </div>`;
  }).join("");

  const locHtml=loc?`
    <div style="margin-top:7px;padding-top:6px;border-top:1px solid #1a2530">
      <div style="color:${rc};font-size:8px;margin-bottom:3px;font-weight:700">▲ ${loc.rarity.toUpperCase()} RARITY</div>
      <div style="font-size:8.5px;color:#c8d8e8;margin-bottom:2px">📍 ${loc.map}</div>
      <div style="font-size:8px;color:#8aa0b0;margin-bottom:2px">POIs: ${loc.pois.join(", ")}</div>
      <div style="font-size:8px;color:#6a8090;font-style:italic">${loc.note}</div>
      ${loc.rarity==="superior"?`<div style="margin-top:4px;font-size:7.5px;color:#bf5af2;padding:2px 5px;background:rgba(191,90,242,.08);border-left:2px solid #bf5af2">⚠ UESC Incursion events & Superior Locked Rooms only</div>`:""}
    </div>`:"<div style='margin-top:5px;font-size:8px;color:#ff6d00'>⚠ Location data unconfirmed</div>";

  const totalQty=needs.reduce((s,n)=>s+n.qty,0);
  const tt=document.getElementById("tt");
  tt.innerHTML=`
    <div style="font-family:'Orbitron',monospace;font-size:10px;color:${rc};margin-bottom:6px">◈ ${item}</div>
    <div style="font-size:8px;color:#4a6070;margin-bottom:5px">Total needed: <span style="color:#ffd600;font-weight:700">×${totalQty}</span></div>
    <div style="font-size:8px;color:#4a6070;margin-bottom:4px;letter-spacing:1px">REQUIRED BY:</div>
    ${needRows}
    ${locHtml}`;
  tt.style.display="block";
  moveTT(e);
}

function renderBuild(){
  const active=getActives();
  const el=document.getElementById("bv-c");
  if(!active.length){
    el.innerHTML='<div class="bv-empty">// SELECT UPGRADES IN THE TREE FIRST //</div>';return;
  }
  const cards=active.map(u=>{
    const fc=FC[u.f], lv=LV[u.id];
    let cc=0;const sm={};
    for(let i=0;i<lv;i++){
      cc+=u.levels[i].credits;
      u.levels[i].salvage.forEach(s=>{sm[s.i]=(sm[s.i]||0)+s.q;});
    }
    return`<div class="bvc" style="border-left:3px solid ${fc.color}">
      <div style="font-family:'Orbitron',monospace;font-size:8.5px;color:${fc.color};margin-bottom:2px">${u.name}</div>
      <div style="font-size:8px;color:${fc.color}55;margin-bottom:3px">${u.f}</div>
      <div style="font-size:8px;color:#4a6070;margin-bottom:3px">Level ${lv}/${getMaxLv(u)} · Rank ${u.levels[0].rank}+</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;font-size:8px">
        <span style="color:#ffd600">₵${cc.toLocaleString()}</span>
        ${Object.entries(sm).map(([i,q])=>`<span style="color:#ff6d00">◈${i.split(" ")[0]} ×${q}</span>`).join("")}
      </div>
      <div style="font-size:8px;font-weight:700;color:${fc.color};margin-top:3px">${u.levels[lv-1].eff}</div>
    </div>`;
  }).join("");

  const steps=REC.map((id,i)=>{
    const u=UG.find(x=>x.id===id);if(!u)return"";
    const fc=FC[u.f],done=isOn(id);
    return`<span class="rs${done?" done":""}" style="${done?`--sc:${fc.color};--sb:${fc.bg}`:""}">
      <span style="color:#4a6070;margin-right:2px">${i+1}.</span>${u.name}${done?" ✓":""}
    </span>${i<REC.length-1?'<span style="color:#2a3a48">›</span>':""}`;
  }).join("");

  const fbRows=Object.keys(FC).map(f=>{
    const fa=active.filter(u=>u.f===f);if(!fa.length)return"";
    const fc=FC[f];
    const fc_c=fa.reduce((s,u)=>{let c=0;for(let i=0;i<LV[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
    const lvSum=fa.reduce((s,u)=>s+LV[u.id],0);
    return`<div class="fbr" style="border-left:2px solid ${fc.color}">
      <span style="color:${fc.color};min-width:80px">${f}</span>
      <span style="color:#8aa0b0">${fa.length} upgrades · ${lvSum} levels</span>
      <span style="color:#ffd600;margin-left:auto">₵${fc_c.toLocaleString()}</span>
    </div>`;
  }).join("");

  el.innerHTML=`<div class="bv-grid">${cards}</div>
  <div class="rec-box">
    <div class="rec-hdr">⚡ RECOMMENDED UNLOCK ORDER (community build guide)</div>
    <div class="rec-steps">${steps}</div>
  </div>
  <div class="fb-box">
    <div class="fb-hdr">FACTION CREDIT BREAKDOWN</div>
    ${fbRows}
  </div>`;
}

function getBuilds(){try{return JSON.parse(localStorage.getItem("mg_builds")||"{}");}catch{return{};}}
function putBuilds(o){localStorage.setItem("mg_builds",JSON.stringify(o));}

function openModal(mode){
  const bg=document.getElementById("modal-bg");
  bg.classList.add("on");
  document.getElementById("mtitle").textContent=mode==="save"?"💾 SAVE BUILD":"📂 MANAGE BUILDS";
  const body=document.getElementById("mbody");
  if(mode==="save"){
    body.innerHTML=`<div style="font-size:9px;color:#4a6070;margin-bottom:8px">
      Name your current build to save it. You can load it again later.</div>
      <input class="sinput" id="bname" placeholder="e.g. Early Game, Melee Build..." maxlength="40">
      <div class="mbtns">
        <button class="btn br" onclick="closeModal()">CANCEL</button>
        <button class="btn bg" onclick="doSave()">SAVE</button>
      </div>`;
    setTimeout(()=>document.getElementById("bname")?.focus(),50);
  } else {
    renderBuildsModal(body);
  }
}
function renderBuildsModal(body){
  const builds=getBuilds(), keys=Object.keys(builds);
  if(!keys.length){
    body.innerHTML=`<div style="color:#4a6070;text-align:center;padding:20px;font-size:10px">No saved builds yet.</div>
      <div class="mbtns"><button class="btn br" onclick="closeModal()">CLOSE</button></div>`;
    return;
  }
  const rows=keys.map(k=>`<div class="brow">
    <span class="brow-n">${k}</span>
    <span class="brow-d">${builds[k].date||""}</span>
    <div class="brow-acts">
      <button class="btn bg" style="font-size:8px;padding:3px 8px" onclick="doLoad('${k}')">LOAD</button>
      <button class="btn by" style="font-size:8px;padding:3px 8px" onclick="doExportNamed('${k}')">⬇</button>
      <button class="btn br" style="font-size:8px;padding:3px 8px" onclick="doDelete('${k}')">✕</button>
    </div>
  </div>`).join("");
  body.innerHTML=`${rows}<div class="mbtns"><button class="btn br" onclick="closeModal()">CLOSE</button></div>`;
}
function doSave(){
  const name=document.getElementById("bname")?.value?.trim();
  if(!name){alert("Please enter a name.");return;}
  const b=getBuilds();
  b[name]={levels:{...LV},date:new Date().toLocaleDateString()};
  putBuilds(b);
  closeModal();
  alert(`✓ Build "${name}" saved!`);
}
function doLoad(name){
  const b=getBuilds();
  if(!b[name])return;
  Object.assign(LV,b[name].levels);
  closeModal();refresh();
}
function doDelete(name){
  if(!confirm(`Delete "${name}"?`))return;
  const b=getBuilds();delete b[name];putBuilds(b);
  renderBuildsModal(document.getElementById("mbody"));
}
function doExport(name){
  const lbl=name||`Build_${new Date().toLocaleDateString().replace(/\//g,"-")}`;
  const active=getActives(), salv=getSalvMap();
  const lines=[
    `MARATHON UPGRADE BUILD — ${lbl}`,
    `Generated: ${new Date().toLocaleString()}`,
    "=".repeat(52),"",
    `Total Credits:   ₵${getTotalCreds().toLocaleString()}`,
    `Nodes Unlocked:  ${active.length}`,
    `Total Levels:    ${active.reduce((s,u)=>s+LV[u.id],0)}`,
    `Salvage Types:   ${salv.length}`,
    "",
    "── SELECTED UPGRADES ──────────────────────────",
  ];
  Object.keys(FC).forEach(f=>{
    const fa=active.filter(u=>u.f===f);
    if(!fa.length)return;
    lines.push(`\n[${f.toUpperCase()}]`);
    fa.forEach(u=>{
      const lv=LV[u.id];
      lines.push(`  ${u.name.padEnd(24)} Lv ${lv}/${getMaxLv(u)}  ${u.levels[lv-1].eff}`);
    });
  });
  lines.push("","── SALVAGE SHOPPING LIST ───────────────────────");
  salv.forEach(([item,qty])=>{
    const loc=SL[item];
    const linfo=loc?` [${loc.rarity.toUpperCase()}] ${loc.map} — ${loc.pois.join("/")}  (${loc.note})`:" [LOCATION UNCONFIRMED]";
    lines.push(`  ◈ ${item.padEnd(26)} ×${String(qty).padStart(3)}${linfo}`);
  });
  const blob=new Blob([lines.join("\n")],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`marathon-build-${lbl.replace(/\s+/g,"-").replace(/[^a-z0-9-]/gi,"")}.txt`;
  a.click();
}
function doExportNamed(name){
  const b=getBuilds();if(!b[name])return;
  const save={...LV};Object.assign(LV,b[name].levels);
  doExport(name);
  Object.assign(LV,save);
}
function bgClick(e){if(e.target===document.getElementById("modal-bg"))closeModal();}
function closeModal(){document.getElementById("modal-bg").classList.remove("on");}

let currentScale=1;
function fitTree(){
  const scroll=document.getElementById("tscroll");
  const canvas=document.getElementById("tcanvas");
  const sw=scroll.clientWidth-40, sh=scroll.clientHeight-40;
  const cw=canvas.scrollWidth/currentScale, ch=canvas.scrollHeight/currentScale;
  const scale=Math.min(sw/cw, sh/ch, 1);
  currentScale=scale;
  canvas.style.transform=`scale(${scale})`;
  canvas.style.width=(cw*scale)+"px";
  canvas.style.height=(ch*scale)+"px";
  document.getElementById("btn-100").textContent=Math.round(scale*100)+"%";
}
function resetZoom(){
  currentScale=1;
  const canvas=document.getElementById("tcanvas");
  canvas.style.transform="scale(1)";
  canvas.style.width="";
  canvas.style.height="";
  document.getElementById("btn-100").textContent="100%";
}

  tt.style.display="block";
  moveTT(e);
}

    const u=UG.find(x=>x.id===id);

    for(let i=0;i<Math.min(lv,u.levels.length);i++){
      totalCreds+=u.levels[i].credits;
      u.levels[i].salvage.forEach(s=>{salvNeeds[s.i]=(salvNeeds[s.i]||0)+s.q;});
    }

  const salvRows=Object.entries(salvNeeds).sort((a,b)=>b[1]-a[1]).map(([item,qty])=>{

function loadRunnerBuild(id){
  const load=RUNNER_UPGRADE_LOADS[id]||[];
  UG.forEach(u=>{LV[u.id]=0;PL[u.id]=0;});
  load.forEach(({id:uid,lv})=>{
    if(LV[uid]!==undefined) LV[uid]=lv;
  });
  refresh();
  activeRunner=null;
  showMain("tree");
}

let gunsSubPage="weapons";
let selectedWeapon=null;
let favouriteLoadouts=JSON.parse(localStorage.getItem("mara_fav_guns")||"[]");

function saveGunFavourites(){
  try{localStorage.setItem("mara_fav_guns",JSON.stringify(favouriteLoadouts));}catch(e){}
}

function renderGuns(){
  const el=document.getElementById("gv");
  if(gunsSubPage==="weapons") renderWeapons(el);
  else renderItemsPage(el);
}

function renderWeapons(el){
  const types=[...new Set(WEAPONS_DATA.map(w=>w.type))];
  let filterType=window._gunFilter||"All";
  let filterTier=window._gunTier||"All";
  let search=(window._gunSearch||"").toLowerCase();

  let filtered=WEAPONS_DATA.filter(w=>{
    if(filterType!=="All"&&w.type!==filterType)return false;
    if(filterTier!=="All"&&w.tier!==filterTier)return false;
    if(search&&!w.name.toLowerCase().includes(search)&&!w.type.toLowerCase().includes(search))return false;
    return true;
  });

  el.innerHTML=`
    <div style="padding:16px 20px;border-bottom:1px solid #1a2530;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:#070d12;z-index:10">
      <div style="font-family:'Orbitron',monospace;font-size:13px;color:#00e5ff;letter-spacing:3px">🔫 GUNS & ITEMS</div>
      <button onclick="gunsSubPage='weapons';renderGuns()" style="padding:4px 12px;border:1px solid #ffd600;color:#ffd600;background:transparent;cursor:pointer;font-family:inherit;font-size:9px">WEAPONS</button>
      <button onclick="gunsSubPage='items';renderGuns()" style="padding:4px 12px;border:1px solid #1a2530;color:#4a6070;background:transparent;cursor:pointer;font-family:inherit;font-size:9px">ITEMS</button>
      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input id="gun-search" placeholder="Search…" value="${window._gunSearch||""}" oninput="window._gunSearch=this.value;renderGuns()" style="background:#0d1318;border:1px solid #1a2530;color:#c8d8e8;padding:4px 8px;font-family:inherit;font-size:9px;width:120px">
        <select onchange="window._gunFilter=this.value;renderGuns()" style="background:#0d1318;border:1px solid #1a2530;color:#c8d8e8;padding:4px 8px;font-family:inherit;font-size:9px">
          <option value="All" ${filterType==="All"?"selected":""}>All Types</option>
          ${types.map(t=>`<option value="${t}" ${filterType===t?"selected":""}>${t}</option>`).join("")}
        </select>
        <select onchange="window._gunTier=this.value;renderGuns()" style="background:#0d1318;border:1px solid #1a2530;color:#c8d8e8;padding:4px 8px;font-family:inherit;font-size:9px">
          ${["All","S","A","B","C"].map(t=>`<option value="${t}" ${filterTier===t?"selected":""}>${t==="All"?"All Tiers":t+"-Tier"}</option>`).join("")}
        </select>
      </div>
    </div>
    <div style="padding:16px 20px">
      ${selectedWeapon?renderWeaponDetail():`
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">
          ${filtered.map(w=>renderWeaponCard(w)).join("")}
        </div>
        ${favouriteLoadouts.length?`
          <div style="margin-top:20px">
            <div style="font-family:'Orbitron',monospace;font-size:10px;color:#ffd600;letter-spacing:2px;margin-bottom:10px">★ SAVED LOADOUTS</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">
              ${favouriteLoadouts.map((f,i)=>renderSavedLoadout(f,i)).join("")}
            </div>
          </div>`:""}
      `}
    </div>`;
}

function renderWeaponCard(w){
  const tc={S:"#39ff14",A:"#ffd600",B:"#ff6d00",C:"#ff4444"}[w.tier]||"#4a6070";
  const ac=AMMO_COL[w.ammo]||"#4a6070";
  return`<div style="background:#0d1318;border:1px solid #1a2530;border-top:3px solid ${tc};cursor:pointer;transition:all .2s;padding:12px 14px" onclick="selectedWeapon='${w.id}';renderGuns()"
    onmouseenter="this.style.transform='translateY(-2px)';this.style.boxShadow='0 4px 16px rgba(0,0,0,.5)'"
    onmouseleave="this.style.transform='';this.style.boxShadow=''">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="font-size:20px">${w.emoji}</span>
      <div style="flex:1">
        <div style="font-family:'Orbitron',monospace;font-size:10px;color:#c8d8e8;letter-spacing:1px">${w.name}</div>
        <div style="font-size:8px;color:#4a6070;margin-top:1px">${w.type}</div>
      </div>
      <span style="font-size:8px;padding:2px 6px;border:1px solid ${tc};color:${tc}">${w.tier}</span>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
      <span style="font-size:7px;padding:1px 5px;border:1px solid ${ac};color:${ac}">${w.ammo}</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px">
      ${renderStatBar("DMG",w.dmg,250,"#ff4444")}
      ${renderStatBar("ROF",w.rof,900,"#39ff14")}
      ${renderStatBar("MAG",w.mag,75,"#4a9eff")}
      ${renderStatBar("RANGE",w.range,100,"#ffd600")}
      ${renderStatBar("HANDLING",w.handling,100,"#bf5af2")}
      ${renderStatBar("RELOAD",100-(w.reload/5*100),100,"#ff6d00")}
    </div>
    <div style="font-size:8.5px;color:#4a6070;margin-top:8px;line-height:1.5;border-top:1px solid #1a2530;padding-top:6px">${w.desc.substring(0,90)}…</div>
  </div>`;
}

function renderStatBar(label,val,max,col){
  const pct=Math.min(100,Math.round(val/max*100));
  return`<div>
    <div style="font-size:7px;color:#4a6070;margin-bottom:2px">${label}</div>
    <div style="height:3px;background:#1a2530;border-radius:1px">
      <div style="height:100%;width:${pct}%;background:${col};border-radius:1px"></div>
    </div>
  </div>`;
}

function sbHeaders(){
  return{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=minimal"};
}

async function sbReq(path,opts={}){
  try{
    const res=await fetch(SB_URL+path,{headers:sbHeaders(),...opts});
    if(res.status===204||res.status===200){
      try{return await res.json();}catch{return null;}
    }
    const txt=await res.text();
    console.error("Supabase error",res.status,txt);
    return null;
  }catch(e){
    console.error("Network error:",e);
    return null;
  }
}

function genCode(){
  return Array.from({length:6},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
}

async function createSession(){
  const name=(document.getElementById("sq-name-input").value||"").trim().toUpperCase();
  if(!name){showSquadMsg("Enter your name first","#ff006e");return;}
  playerName=name; sessionCode=genCode();
  setSquadStatus("connecting");
  showSquadMsg("Creating session…","#ffd600");
  const res=await sbReq("/rest/v1/sessions",{
    method:"POST",
    headers:{...sbHeaders(),"Prefer":"return=representation"},
    body:JSON.stringify({session_code:sessionCode,player_name:playerName,faction_data:{LV,PL},updated_at:new Date().toISOString()})
  });
  if(res===null&&!sessionCode){showSquadMsg("Connection failed — check console","#ff006e");setSquadStatus("offline");return;}
  startSession();
}

async function joinSession(){
  const name=(document.getElementById("sq-name-input").value||"").trim().toUpperCase();
  const code=(document.getElementById("sq-code-input").value||"").trim().toUpperCase();
  if(!name){showSquadMsg("Enter your name first","#ff006e");return;}
  if(!code){showSquadMsg("Enter a session code","#ff006e");return;}
  playerName=name; sessionCode=code;
  setSquadStatus("connecting");
  showSquadMsg("Joining session…","#ffd600");
  // Upsert our row
  await sbReq("/rest/v1/sessions?session_code=eq."+code+"&player_name=eq."+name,{
    method:"DELETE"
  });
  await sbReq("/rest/v1/sessions",{
    method:"POST",
    headers:{...sbHeaders(),"Prefer":"return=representation"},
    body:JSON.stringify({session_code:code,player_name:name,faction_data:{LV,PL},updated_at:new Date().toISOString()})
  });
  startSession();
}

function startSession(){
  showSessionUI();
  startPolling();
}

function startPolling(){
  loadSquadData();
  if(sqPollTimer)clearInterval(sqPollTimer);
  sqPollTimer=setInterval(loadSquadData,3000);
}

async function loadSquadData(){
  if(!sessionCode)return;
  const rows=await sbReq(`/rest/v1/sessions?session_code=eq.${sessionCode}&select=player_name,faction_data,updated_at&order=updated_at`);
  if(!Array.isArray(rows))return;
  squadPlayers={};
  rows.forEach(r=>{squadPlayers[r.player_name]=r;});
  updateSquadWidget();
  if(curTab==="squad")renderSquadPage();
}

async function pushMyData(){
  if(!sessionCode||!playerName)return;
  await sbReq(`/rest/v1/sessions?session_code=eq.${sessionCode}&player_name=eq.${playerName}`,{
    method:"PATCH",
    body:JSON.stringify({faction_data:{LV,PL},updated_at:new Date().toISOString()})
  });
}

  const actives=UG.filter(u=>(pLV[u.id]||0)>0);

  const totalCreds=actives.reduce((s,u)=>{let c=0;for(let i=0;i<pLV[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
  const ago=Math.round((Date.now()-new Date(p.updated_at).getTime())/1000);

function showMapZoneTT(e, mapId, zoneId){
  const map = MAPS.find(m=>m.id===mapId);
  if(!map)return;
  const zone = map.zones.find(z=>z.id===zoneId);
  if(!zone)return;
  const tt = document.getElementById("tt");
  tt.innerHTML = `
    <div style="font-family:'Orbitron',monospace;font-size:11px;color:${zone.color};margin-bottom:6px">${zone.label.replace("\\n"," ")}</div>
    <div style="font-size:9px;color:#c8d8e8;margin-bottom:8px;line-height:1.6">${zone.desc}</div>
    <div style="font-size:8px;color:#ffd600;margin-bottom:4px;letter-spacing:1px">LOOT FOUND HERE</div>
    ${zone.lootTypes.map(l=>`<div style="font-size:8.5px;color:#8aa0b0;padding:2px 6px;border-left:2px solid ${zone.color};margin-bottom:2px">${l}</div>`).join("")}`;
  tt.style.display="block"; moveTT(e);
}

function showMapPinTT(e, label, tip){
  const tt = document.getElementById("tt");
  tt.innerHTML = `
    <div style="font-size:10px;color:#ffd600;margin-bottom:6px">${decodeURIComponent(label)}</div>
    <div style="font-size:9px;color:#8aa0b0">${decodeURIComponent(tip)}</div>`;
  tt.style.display="block"; moveTT(e);
}

let runLog = JSON.parse(localStorage.getItem("mara_runs") || "[]");

  const wrate = total>0?Math.round(wins/total*100):0;
  
  // Best run
  const best = runLog.reduce((b,r)=>(!b||r.credits>b.credits)?r:b, null);
  
  el.innerHTML = `
    <div style="padding:16px 20px;border-bottom:1px solid #1a2530;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#070d12;z-index:10;flex-wrap:wrap">

      ${runLog.length>0?`<button onclick="if(confirm('Clear all run history?')){runLog=[];saveRuns();renderRuns();}" style="padding:5px 10px;border:1px solid #ff006e;color:#ff006e;background:transparent;cursor:pointer;font-family:inherit;font-size:9px">✕ CLEAR</button>`:""}

      ${[
        ["RUNS",total,"#00e5ff"],
        ["EXTRACTS",wins,"#39ff14"],
        ["WIN RATE",wrate+"%","#ffd600"],
        ["TOTAL ₵",totalCreds.toLocaleString(),"#ffd600"],
        ["TOTAL KILLS",totalKills,"#ff4444"],

      ${[...runLog].reverse().map((r,i)=>{
        const ri = runLog.length - 1 - i;
        const oc = {extract:"#39ff14",died:"#ff4444",quit:"#ffd600"}[r.outcome]||"#4a6070";
        const ol = {extract:"EXTRACTED","died":"DIED","quit":"QUIT"}[r.outcome]||r.outcome;

          </div>
          <button onclick="runLog.splice(${ri},1);saveRuns();renderRuns()" style="font-size:8px;padding:2px 6px;border:1px solid #ff006e;color:#ff006e;background:transparent;cursor:pointer;font-family:inherit">✕</button>

function submitRun(){
  const run = {
    outcome: document.getElementById("rf-outcome").value,
    map: document.getElementById("rf-map").value,
    runner: document.getElementById("rf-runner").value,
    credits: parseInt(document.getElementById("rf-credits").value)||0,
    kills: parseInt(document.getElementById("rf-kills").value)||0,
    loot: document.getElementById("rf-loot").value,
    notes: document.getElementById("rf-notes").value,
    date: new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short"})

  renderRuns();

function saveCurrentLoadout(){
  if(!editingLoadout)return;
  if(editingLoadout.id!==undefined){
    savedLoadouts[editingLoadout.id] = {...editingLoadout};
    delete savedLoadouts[editingLoadout.id].id;
  } else {
    savedLoadouts.push({...editingLoadout});
  }
  saveLoadouts();
  editingLoadout = null;
  renderLoadout();
}

  "Light Rounds":   {color:"#c8d8e8", perStack:60, stackSize:"60 rounds",source:"Common — all containers"},

};

const RUN_DURATION_OPTS = [
  {label:"Short (10 min)",factor:0.8},
  {label:"Standard (20 min)",factor:1},
  {label:"Long (35 min)",factor:1.8},
  {label:"Full Loot (50 min+)",factor:2.5},

let ammoWeapon1 = "", ammoWeapon2 = "", ammoDuration = 1, ammoStyle = "balanced";

function renderAmmo(){
  const el = document.getElementById("ammov");
  const WD = WEAPONS_DATA||[];
  
  el.innerHTML = `
    <div style="padding:16px 20px;border-bottom:1px solid #1a2530;position:sticky;top:0;background:#070d12;z-index:10">

              <option value="">-- Select Primary --</option>
              ${WD.map(w=>`<option value="${w.id}" ${ammoWeapon1===w.id?"selected":""}>${w.name} (${w.ammo})</option>`).join("")}
            </select>
          </div>
          <div style="margin-bottom:10px">
            <div style="font-size:8px;color:#4a6070;margin-bottom:4px">SECONDARY WEAPON</div>
            <select onchange="ammoWeapon2=this.value;renderAmmo()" style="width:100%;background:#070d12;border:1px solid #1a2530;color:#c8d8e8;padding:5px;font-family:inherit;font-size:10px">
              <option value="">-- Select Secondary --</option>
              ${WD.map(w=>`<option value="${w.id}" ${ammoWeapon2===w.id?"selected":""}>${w.name} (${w.ammo})</option>`).join("")}
            </select>
          </div>
          <div style="margin-bottom:10px">
            <div style="font-size:8px;color:#4a6070;margin-bottom:4px">RUN DURATION</div>
            <select onchange="ammoDuration=parseInt(this.value);renderAmmo()" style="width:100%;background:#070d12;border:1px solid #1a2530;color:#c8d8e8;padding:5px;font-family:inherit;font-size:10px">
              ${RUN_DURATION_OPTS.map((d,i)=>`<option value="${i}" ${ammoDuration===i?"selected":""}>${d.label}</option>`).join("")}
            </select>
          </div>
          <div>
            <div style="font-size:8px;color:#4a6070;margin-bottom:4px">PLAYSTYLE</div>
            <div style="display:flex;gap:6px">
              ${[["balanced","Balanced"],["aggressive","Aggressive"],["stealth","Stealth/Loot"]].map(([v,l])=>`
                <button onclick="ammoStyle='${v}';renderAmmo()" style="flex:1;padding:5px;border:1px solid ${ammoStyle===v?"#00e5ff":"#1a2530"};color:${ammoStyle===v?"#00e5ff":"#4a6070"};background:transparent;cursor:pointer;font-family:inherit;font-size:8.5px;transition:all .2s">${l}</button>`).join("")}

      <div>

                <span style="font-size:8px;color:#4a6070">${d.stackSize}/stack</span>
              </div>
              <div style="font-size:8.5px;color:#4a6070">${d.source}</div>
            </div>`).join("")}
        </div>
        <div class="card" style="border-left:3px solid #ffd600">
          <div class="card-hdr" style="color:#ffd600">💡 AMMO TIPS</div>
          <div style="font-size:9px;color:#8aa0b0;line-height:1.8">

            • Volt Cells (not Battery) are extremely rare — hoard them<br>
            • Shells have great firepower per stack — bring 2 minimum<br>

            • You'll find ammo in-raid — start lighter for looting runs
          </div>
        </div>
      </div>
    </div>`;

function renderAmmoResults(){
  const WD = WEAPONS_DATA||[];
  const w1 = WD.find(w=>w.id===ammoWeapon1);
  const w2 = WD.find(w=>w.id===ammoWeapon2);
  if(!w1&&!w2) return `<div class="card" style="color:#4a6070;font-size:10px;text-align:center;padding:20px">Select weapons above to calculate ammo</div>`;
  
  const factor = RUN_DURATION_OPTS[ammoDuration].factor;
  const styleMult = {balanced:1, aggressive:1.8, stealth:0.6}[ammoStyle]||1;
  
  const results = {};
  [w1,w2].filter(Boolean).forEach(w=>{
    const base = Math.ceil(w.mag * (w.rof/60) * 4 * factor * styleMult / (AMMO_DATA[w.ammo]?.perStack||30));
    results[w.ammo] = (results[w.ammo]||0) + base;
  });
  
  return `<div class="card" style="border-color:#39ff14;border-left:3px solid #39ff14">
    <div class="card-hdr" style="color:#39ff14">📊 RECOMMENDED LOADOUT</div>
    ${Object.entries(results).map(([ammo,stacks])=>{
      const ad = AMMO_DATA[ammo];
      const capped = Math.min(stacks, 4);
      return`<div class="ammo-result">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="color:${ad?.color||"#c8d8e8"};font-size:10px;font-weight:700">${ammo}</span>
          <span style="font-size:20px;font-weight:700;color:${ad?.color||"#c8d8e8"};font-family:'Orbitron',monospace">${capped}x</span>
        </div>
        <div style="font-size:8.5px;color:#4a6070">≈ ${capped*(ad?.perStack||30)} rounds · ${ad?.stackSize||""}/stack</div>
        ${stacks>4?`<div style="font-size:8px;color:#ff6d00;margin-top:3px">⚠ Calc suggests ${stacks} stacks — capped at 4 for space</div>`:""}
      </div>`;
    }).join("")}
    <div style="font-size:9px;color:#4a6070;margin-top:8px;padding-top:8px;border-top:1px solid #1a2530">
      Based on: ${RUN_DURATION_OPTS[ammoDuration].label} · ${ammoStyle} playstyle
    </div>
  </div>`;
}

const REC=["nc_saf","ar_cred","ar_inf","ca_cred","ca_sink","nc_shie","nc_rest",

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let LV={};   // owned levels (left-click, faction colour)
let PL={};   // planned levels (right-click, purple)
UG.forEach(u=>{LV[u.id]=0; PL[u.id]=0;});
let curF="CyberAcme",curTab="tree",showHi=false,showRec=false;
const NW=210,NH=138,GX=30,GY=18;

const canUnlock=u=>!u.deps||u.deps.every(d=>LV[d]>0||PL[d]>0);
const isOn=id=>LV[id]>0;
const isPlan=id=>PL[id]>0&&LV[id]===0;
const getActives=()=>UG.filter(u=>LV[u.id]>0);
const getPlanned=()=>UG.filter(u=>PL[u.id]>0&&LV[u.id]===0);
const getMaxLv=u=>u.levels.length;

// Salvage for owned only
function getSalvMap(){
  const m={};
  getActives().forEach(u=>{
    for(let i=0;i<LV[u.id];i++)
      u.levels[i].salvage.forEach(s=>{m[s.i]=(m[s.i]||0)+s.q;});
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
// Salvage for planned only
function getSalvMapPlanned(){
  const m={};
  getPlanned().forEach(u=>{
    for(let i=0;i<PL[u.id];i++)
      u.levels[i].salvage.forEach(s=>{m[s.i]=(m[s.i]||0)+s.q;});
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function hideTT(){document.getElementById("tt").style.display="none";}

function cycleNode(id,planned=false){
  hideTT();
  const u=UG.find(x=>x.id===id);
  const max=getMaxLv(u);
  if(planned){ LV[id]=0; PL[id]=(PL[id]+1)%(max+1); }
  else { PL[id]=0; LV[id]=(LV[id]+1)%(max+1); }
  refresh();
}
function setLv(id,lv,planned=false){
  hideTT();
  if(planned){ LV[id]=0; PL[id]=lv; }
  else { PL[id]=0; LV[id]=lv; }
  refresh();
}
function resetAll(){
  hideTT();
  UG.forEach(u=>{LV[u.id]=0; PL[u.id]=0;});
  refresh();
}
function refresh(){renderCurrent();updateHdr();maybeSync();}

function getTotalCreds(){
  return getActives().reduce((s,u)=>{let c=0;for(let i=0;i<LV[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
}
function getTotalCredsPlanned(){
  return getPlanned().reduce((s,u)=>{let c=0;for(let i=0;i<PL[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
}

// ══════════════════════════════════════════
// HEADER
// ══════════════════════════════════════════
function updateHdr(){
  const totalLvs=getActives().reduce((s,u)=>s+LV[u.id],0);
  document.getElementById("h-lvs").textContent=totalLvs;
  // Credits header shows planned (right-click) costs only; owned shown on hover
  document.getElementById("h-cred").textContent="₵"+getTotalCredsPlanned().toLocaleString();
  document.getElementById("h-salv").textContent=getSalvMap().length;
  document.getElementById("h-plan").textContent=getSalvMapPlanned().length;
  const maxLvs=UG.reduce((s,u)=>s+u.levels.length,0);
  document.getElementById("prog-f").style.width=Math.min(100,totalLvs/maxLvs*100)+"%";
}

function showMain(t){
  curTab=t;
  const tabs=["tree","salvage","build","runners","guns","map","runs","loadout","contracts","ammo","squad"];
  document.querySelectorAll(".mtab").forEach((b,i)=>b.classList.toggle("on",tabs[i]===t));
  ["view-tree","view-salvage","view-build","view-runners","view-guns","view-map","view-runs","view-loadout","view-contracts","view-ammo","view-squad"].forEach((id,i)=>
    document.getElementById(id).classList.toggle("on",tabs[i]===t));
  renderCurrent();
}
function renderCurrent(){
  if(curTab==="tree") renderTree();
  else if(curTab==="salvage") renderSalv();
  else if(curTab==="build") renderBuild();
  else if(curTab==="runners") renderRunners();
  else if(curTab==="guns") renderGuns();
  else if(curTab==="map") renderMap();
  else if(curTab==="runs") renderRuns();
  else if(curTab==="loadout") renderLoadout();
  else if(curTab==="contracts") renderContracts();
  else if(curTab==="ammo") renderAmmo();
  else if(curTab==="squad") renderSquadPage();
}
function toggleHi(){
  showHi=!showHi;
  document.getElementById("btn-hi").classList.toggle("ony",showHi);
  renderTree();
}
function toggleRec(){
  showRec=!showRec;
  document.getElementById("btn-rec").classList.toggle("ong",showRec);
  renderTree();
}

// FACTION BAR
// ══════════════════════════════════════════
function buildFbar(){
  document.getElementById("fbar").innerHTML=Object.keys(FC).map(f=>{
    const fc=FC[f];
    const nodes=UG.filter(u=>u.f===f);
    const tot=nodes.reduce((s,u)=>s+u.levels.length,0);
    const act=nodes.reduce((s,u)=>s+LV[u.id],0);
    const on=f===curF;
    return`<button class="fbtn${on?" on":""}"
      style="${on?`border-color:${fc.color};color:${fc.color};background:${fc.bg}`:""}"
      onclick="setF('${f}')">
      <span class="fdot" style="${on?`background:${fc.color}`:""}"></span>
      ${f.toUpperCase()}
      <span class="fcnt" style="${on?`background:${fc.color};color:#000`:""}">
        ${act}/${tot}
      </span></button>`;
  }).join("");
}
function setF(f){curF=f;buildFbar();renderTree();}

// TREE
// ══════════════════════════════════════════
function renderTree(){
  hideTT();
  buildFbar();
  const fc=FC[curF];
  const fi=document.getElementById("fi");
  fi.style.cssText=`background:${fc.bg};border-bottom-color:${fc.dim};padding:5px 14px;border-bottom:1px solid;display:flex;align-items:center;gap:10px;font-size:9px`;
  fi.innerHTML=`<span class="fi-name" style="color:${fc.color}">${curF}</span>
    <span style="color:#4a6070">Handler: ${fc.handler}</span>
    ${showRec?`<span style="margin-left:auto;color:#39ff14;font-size:8px">⚡ green = next unlock</span>`:""}`;

  let nodes=UG.filter(u=>u.f===curF);
  if(showHi) nodes=nodes.filter(u=>u.hi||LV[u.id]>0);

  const nextRec=showRec?REC.find(id=>!isOn(id)&&nodes.find(u=>u.id===id)):null;
  const maxC=nodes.reduce((m,u)=>Math.max(m,u.col),0);
  const maxR=nodes.reduce((m,u)=>Math.max(m,u.row),0);
  const cW=(maxC+1)*(NW+GX)+GX, cH=(maxR+1)*(NH+GY)+GY+8;
  const canvas=document.getElementById("tcanvas");
  canvas.style.cssText=`position:relative;width:${cW}px;height:${cH}px`;
  const svg=document.getElementById("tsvg");
  svg.setAttribute("width",cW);svg.setAttribute("height",cH);

  // SVG edges
  let paths="";
  nodes.forEach(u=>{
    (u.deps||[]).forEach(dep=>{
      const from=nodes.find(x=>x.id===dep);
      if(!from)return;
      const x1=from.col*(NW+GX)+NW, y1=from.row*(NH+GY)+NH/2;
      const x2=u.col*(NW+GX), y2=u.row*(NH+GY)+NH/2;
      const mx=(x1+x2)/2;
      const active=isOn(dep)&&isOn(u.id);
      paths+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none"
        stroke="${active?fc.color:"#1a2530"}" stroke-width="${active?2:1}"
        stroke-dasharray="${active?"none":"4 3"}"/>`;
    });
  });
  svg.innerHTML=paths;
  canvas.querySelectorAll(".node").forEach(n=>n.remove());

  nodes.forEach(u=>{
    const x=u.col*(NW+GX), y=u.row*(NH+GY);
    const lv=LV[u.id], plv=PL[u.id], maxLv=getMaxLv(u);
    const on=lv>0, planned=plv>0&&lv===0;
    const isNext=u.id===nextRec;
    const locked=!canUnlock(u)&&!on&&!planned;
    const PLAN_COL="#bf5af2";
    const hiActive=showHi&&u.hi;
    const bc=on?fc.color:planned?PLAN_COL:isNext?"#39ff14":hiActive?"#ffd600":"#1a2530";
    const bg=on?fc.bg:planned?"rgba(191,90,242,.1)":isNext?"rgba(57,255,20,.06)":hiActive?"rgba(255,214,0,.04)":"#0d1318";
    const unverified=u.v===false;
    const activeLv=on?lv:planned?plv:0;
    const nextCostObj=u.levels[activeLv]||null;
    const typeClass={stat:"b-stat",arm:"b-arm",fun:"b-fun",inv:"b-inv"}[u.t]||"b-stat";
    const typeLabel={stat:"STAT",arm:"ARMORY",fun:"FUNCTION",inv:"INVENTORY"}[u.t]||"STAT";
    const currEff=activeLv>0?u.levels[activeLv-1].eff:"";
    const depNames=locked?(u.deps||[]).map(d=>{const du=UG.find(x=>x.id===d);return du?du.name:"?";}):[];

    // Pip bars — left pip = owned, right-click to plan
    const pipHtml=u.levels.map((_,i)=>{
      const ownedFill=i<lv?fc.color:"transparent";
      const planFill=i<plv&&lv===0?PLAN_COL:"transparent";
      const fillCol=ownedFill!=="transparent"?ownedFill:planFill;
      return`<div class="pip" title="L-click own Lv${i+1} / R-click plan Lv${i+1}"
        onclick="event.stopPropagation();${locked?'':` setLv('${u.id}',${lv===i+1?0:i+1},false)`}"
        oncontextmenu="event.preventDefault();event.stopPropagation();${locked?'':` setLv('${u.id}',${plv===i+1&&lv===0?0:i+1},true)`}">
        <div class="pip-fill" style="background:${fillCol}"></div>
      </div>`;
    }).join("");

    const div=document.createElement("div");
    div.className="node"+(on?" unlocked":planned?" planned":"")+(locked?" locked-out":" clickable");
    div.style.cssText=`left:${x}px;top:${y}px;width:${NW}px;height:${NH}px;
      --ng:${on?fc.color+"44":planned?PLAN_COL+"44":"transparent"};
      border-color:${bc};background:${bg};border-top-color:${bc}`;
    div.dataset.id=u.id;

    if(!locked){
      div.onclick=e=>{if(!e.target.classList.contains("pip"))cycleNode(u.id,false);};
      div.oncontextmenu=e=>{e.preventDefault();if(!e.target.classList.contains("pip"))cycleNode(u.id,true);};
    }

    div.innerHTML=`
      <div class="node-inner">
        <div class="n-title">
          ${hiActive?'<span style="color:#ffd600;font-size:9px">★ </span>':""}
          ${isNext?'<span style="color:#39ff14;font-size:9px">⚡ </span>':""}
          ${u.name}
        </div>
        <div class="n-badges">
          <span class="bdg ${typeClass}">${typeLabel}</span>
          <span class="bdg b-rnk">R${u.levels[0].rank}+</span>
          ${on?`<span class="bdg" style="border-color:${fc.color};color:${fc.color}">OWN LV${lv}/${maxLv}</span>`:""}
          ${planned?`<span class="bdg" style="border-color:${PLAN_COL};color:${PLAN_COL}">PLAN LV${plv}/${maxLv}</span>`:""}
          ${unverified?'<span class="bdg b-unv">⚠</span>':""}
        </div>
        ${locked
          ?`<div class="n-desc" style="color:#ff006e55;font-size:8px">🔒 Requires: ${depNames.join(", ")}</div>`
          :activeLv>0
            ?`<div class="n-eff" style="color:${on?fc.color:PLAN_COL};font-size:9px">${currEff}</div>`
            :`<div class="n-desc">${u.desc.substring(0,65)}${u.desc.length>65?"…":""}</div>`}
        <div class="n-pips">${pipHtml}</div>
        ${!locked?(nextCostObj
          ?`<div class="n-cost">→ ₵${nextCostObj.credits.toLocaleString()}${nextCostObj.salvage.length?" + "+nextCostObj.salvage.map(s=>`${s.i.split(" ").slice(0,2).join(" ")}×${s.q}`).join(", "):""}
</div>`
          :`<div style="font-size:8px;color:#39ff14;margin-top:4px">✓ MAX</div>`):""}
      </div>
      ${on?`<div class="n-check" style="color:${fc.color}">✓</div>`:""}
      ${planned?`<div class="n-check" style="color:${PLAN_COL}">◈</div>`:""}
      ${locked?`<div class="n-lock">🔒</div>`:""}`;

    div.addEventListener("mouseenter",e=>{
      if(locked){
        const depNames=(u.deps||[]).map(d=>{const du=UG.find(x=>x.id===d);return du?`<span style="color:#ffd600">${du.name}</span>`:"?";});
        const tt=document.getElementById("tt");
        tt.innerHTML=`<div style="font-family:'Orbitron',monospace;font-size:10px;color:#ff006e;margin-bottom:7px">🔒 LOCKED</div>
          <div style="font-size:9px;color:#8aa0b0;margin-bottom:5px">Unlock the following first:</div>
          ${depNames.map(n=>`<div style="font-size:9px;padding:3px 6px;border-left:2px solid #ffd600;margin-bottom:3px">${n}</div>`).join("")}`;
        tt.style.display="block";
        moveTT(e);
      } else {
        showTT(u,e);
      }
    });
    div.addEventListener("mouseleave",hideTT);
    div.addEventListener("mousemove",moveTT);
    canvas.appendChild(div);
  });
}

function showTT(u,e){
  const fc=FC[u.f], lv=LV[u.id];
  const rows=u.levels.map((l,i)=>{
    const done=i<lv, cur=i===lv-1;
    return`<div class="tt-lvl${cur?" cur":""}">
      <div class="tt-lvl-hd">
        <span class="tt-lvl-n" style="${done?`color:${fc.color}`:""}">Level ${i+1}${done?" ✓":""}</span>
        <span class="tt-lvl-c">₵${l.credits.toLocaleString()}</span>
      </div>
      <div class="tt-lvl-e" style="color:${done?fc.color:"#39ff1466"}">${l.eff}</div>
      ${l.salvage.map(s=>`<div class="tt-lvl-s">◈ ${s.i} ×${s.q}</div>`).join("")}
      <div class="tt-rank">Rank ${l.rank}+ required</div>
    </div>`;
  }).join("");

  const firstSalv=u.levels[0].salvage[0];
  const loc=firstSalv?SL[firstSalv.i]:null;
  const locHtml=loc?`<div class="tt-loc">
    <div style="color:${RC[loc.rarity]||"#8aa0b0"};margin-bottom:2px">▲ ${loc.rarity.toUpperCase()}</div>
    <div>📍 ${loc.map}</div>
    <div>POIs: ${loc.pois.join(", ")}</div>
    <div style="margin-top:2px;font-style:italic">${loc.note}</div>
  </div>`:"";

  const tt=document.getElementById("tt");
  tt.innerHTML=`<div class="tt-name" style="color:${fc.color}">${u.name} <span style="font-size:8px;color:#4a6070">— ${u.f}</span></div>
    <div style="font-size:8px;color:#6a8090;margin-bottom:6px">${u.desc}</div>
    ${rows}${locHtml}`;
  tt.style.display="block";
  moveTT(e);
}
function moveTT(e){
  const tt=document.getElementById("tt");
  const w=tt.offsetWidth||240, h=tt.offsetHeight||160;
  tt.style.left=Math.min(e.clientX+14,window.innerWidth-w-10)+"px";
  tt.style.top=Math.min(e.clientY+14,window.innerHeight-h-10)+"px";
}

function showCredHdrTT(e){
  const tt=document.getElementById("tt");
  const ownedCred=getTotalCreds();
  const plannedCred=getTotalCredsPlanned();
  const actives=getActives();
  const planned=getPlanned();

  const ownedRows=actives.length
    ? actives.map(u=>{
        const fc=FC[u.f];
        let c=0;for(let i=0;i<LV[u.id];i++)c+=u.levels[i].credits;
        return`<div style="display:flex;justify-content:space-between;padding:2px 5px;border-left:2px solid ${fc.color};margin-bottom:2px;font-size:8.5px">
          <span style="color:${fc.color}">${u.name}</span>
          <span style="color:#ffd600;margin-left:10px">₵${c.toLocaleString()}</span>
        </div>`;
      }).join("")
    : `<div style="color:#4a6070;font-size:8.5px;padding:3px 5px">No owned upgrades yet</div>`;

  const planRows=planned.length
    ? planned.map(u=>{
        let c=0;for(let i=0;i<PL[u.id];i++)c+=u.levels[i].credits;
        return`<div style="display:flex;justify-content:space-between;padding:2px 5px;border-left:2px solid #bf5af2;margin-bottom:2px;font-size:8.5px">
          <span style="color:#bf5af2">${u.name}</span>
          <span style="color:#bf5af2;margin-left:10px">₵${c.toLocaleString()}</span>
        </div>`;
      }).join("")

function showSalvTT(item,e){
  const loc=SL[item];
  const rc=loc?RC[loc.rarity]:"#4a6070";

  // Find which upgrades/levels need this item (owned + planned)
  const needs=[];
  getActives().forEach(u=>{
    for(let i=0;i<LV[u.id];i++){
      const s=u.levels[i].salvage.find(s=>s.i===item);
      if(s) needs.push({u,level:i+1,qty:s.q,type:"owned"});
    }
  });
  getPlanned().forEach(u=>{
    for(let i=0;i<PL[u.id];i++){
      const s=u.levels[i].salvage.find(s=>s.i===item);
      if(s) needs.push({u,level:i+1,qty:s.q,type:"planned"});
    }
  });
  const needRows=needs.map(n=>{
    const fc=FC[n.u.f];
    const col=n.type==="planned"?"#bf5af2":fc.color;
    const label=n.type==="planned"?"◈ PLAN":"✓ OWN";
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 5px;margin-bottom:2px;border-left:2px solid ${col};font-size:8.5px">
      <span style="color:${col}">${n.u.name}</span>
      <span style="color:#4a6070;margin:0 5px;font-size:7.5px">${label} Lv${n.level}</span>
      <span style="color:#ffd600;font-weight:700">×${n.qty}</span>
    </div>`;
  }).join("");

  const locHtml=loc?`
    <div style="margin-top:7px;padding-top:6px;border-top:1px solid #1a2530">
      <div style="color:${rc};font-size:8px;margin-bottom:3px;font-weight:700">▲ ${loc.rarity.toUpperCase()} RARITY</div>
      <div style="font-size:8.5px;color:#c8d8e8;margin-bottom:2px">📍 ${loc.map}</div>
      <div style="font-size:8px;color:#8aa0b0;margin-bottom:2px">POIs: ${loc.pois.join(", ")}</div>
      <div style="font-size:8px;color:#6a8090;font-style:italic">${loc.note}</div>
      ${loc.rarity==="superior"?`<div style="margin-top:4px;font-size:7.5px;color:#bf5af2;padding:2px 5px;background:rgba(191,90,242,.08);border-left:2px solid #bf5af2">⚠ UESC Incursion events & Superior Locked Rooms only</div>`:""}
    </div>`:"<div style='margin-top:5px;font-size:8px;color:#ff6d00'>⚠ Location data unconfirmed</div>";

  const totalQty=needs.reduce((s,n)=>s+n.qty,0);
  const tt=document.getElementById("tt");
  tt.innerHTML=`
    <div style="font-family:'Orbitron',monospace;font-size:10px;color:${rc};margin-bottom:6px">◈ ${item}</div>
    <div style="font-size:8px;color:#4a6070;margin-bottom:5px">Total needed: <span style="color:#ffd600;font-weight:700">×${totalQty}</span></div>
    <div style="font-size:8px;color:#4a6070;margin-bottom:4px;letter-spacing:1px">REQUIRED BY:</div>
    ${needRows}
    ${locHtml}`;
  tt.style.display="block";
  moveTT(e);
}

function renderBuild(){
  const active=getActives();
  const el=document.getElementById("bv-c");
  if(!active.length){
    el.innerHTML='<div class="bv-empty">// SELECT UPGRADES IN THE TREE FIRST //</div>';return;
  }
  const cards=active.map(u=>{
    const fc=FC[u.f], lv=LV[u.id];
    let cc=0;const sm={};
    for(let i=0;i<lv;i++){
      cc+=u.levels[i].credits;
      u.levels[i].salvage.forEach(s=>{sm[s.i]=(sm[s.i]||0)+s.q;});
    }
    return`<div class="bvc" style="border-left:3px solid ${fc.color}">
      <div style="font-family:'Orbitron',monospace;font-size:8.5px;color:${fc.color};margin-bottom:2px">${u.name}</div>
      <div style="font-size:8px;color:${fc.color}55;margin-bottom:3px">${u.f}</div>
      <div style="font-size:8px;color:#4a6070;margin-bottom:3px">Level ${lv}/${getMaxLv(u)} · Rank ${u.levels[0].rank}+</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;font-size:8px">
        <span style="color:#ffd600">₵${cc.toLocaleString()}</span>
        ${Object.entries(sm).map(([i,q])=>`<span style="color:#ff6d00">◈${i.split(" ")[0]} ×${q}</span>`).join("")}
      </div>
      <div style="font-size:8px;font-weight:700;color:${fc.color};margin-top:3px">${u.levels[lv-1].eff}</div>
    </div>`;
  }).join("");

  const steps=REC.map((id,i)=>{
    const u=UG.find(x=>x.id===id);if(!u)return"";
    const fc=FC[u.f],done=isOn(id);
    return`<span class="rs${done?" done":""}" style="${done?`--sc:${fc.color};--sb:${fc.bg}`:""}">
      <span style="color:#4a6070;margin-right:2px">${i+1}.</span>${u.name}${done?" ✓":""}
    </span>${i<REC.length-1?'<span style="color:#2a3a48">›</span>':""}`;
  }).join("");

  const fbRows=Object.keys(FC).map(f=>{
    const fa=active.filter(u=>u.f===f);if(!fa.length)return"";
    const fc=FC[f];
    const fc_c=fa.reduce((s,u)=>{let c=0;for(let i=0;i<LV[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
    const lvSum=fa.reduce((s,u)=>s+LV[u.id],0);
    return`<div class="fbr" style="border-left:2px solid ${fc.color}">
      <span style="color:${fc.color};min-width:80px">${f}</span>
      <span style="color:#8aa0b0">${fa.length} upgrades · ${lvSum} levels</span>
      <span style="color:#ffd600;margin-left:auto">₵${fc_c.toLocaleString()}</span>
    </div>`;
  }).join("");

  el.innerHTML=`<div class="bv-grid">${cards}</div>
  <div class="rec-box">
    <div class="rec-hdr">⚡ RECOMMENDED UNLOCK ORDER (community build guide)</div>
    <div class="rec-steps">${steps}</div>
  </div>
  <div class="fb-box">
    <div class="fb-hdr">FACTION CREDIT BREAKDOWN</div>
    ${fbRows}
  </div>`;
}

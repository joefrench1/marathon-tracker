function getBuilds(){try{return JSON.parse(localStorage.getItem("mg_builds")||"{}");}catch{return{};}}
function putBuilds(o){localStorage.setItem("mg_builds",JSON.stringify(o));}

function openModal(mode){
  const bg=document.getElementById("modal-bg");
  bg.classList.add("on");
  document.getElementById("mtitle").textContent=mode==="save"?"💾 SAVE BUILD":"📂 MANAGE BUILDS";
  const body=document.getElementById("mbody");
  if(mode==="save"){
    body.innerHTML=`<div style="font-size:9px;color:#4a6070;margin-bottom:8px">
      Name your current build to save it. You can load it again later.</div>
      <input class="sinput" id="bname" placeholder="e.g. Early Game, Melee Build..." maxlength="40">
      <div class="mbtns">
        <button class="btn br" onclick="closeModal()">CANCEL</button>
        <button class="btn bg" onclick="doSave()">SAVE</button>
      </div>`;
    setTimeout(()=>document.getElementById("bname")?.focus(),50);
  } else {
    renderBuildsModal(body);
  }
}
function renderBuildsModal(body){
  const builds=getBuilds(), keys=Object.keys(builds);
  if(!keys.length){
    body.innerHTML=`<div style="color:#4a6070;text-align:center;padding:20px;font-size:10px">No saved builds yet.</div>
      <div class="mbtns"><button class="btn br" onclick="closeModal()">CLOSE</button></div>`;
    return;
  }
  const rows=keys.map(k=>`<div class="brow">
    <span class="brow-n">${k}</span>
    <span class="brow-d">${builds[k].date||""}</span>
    <div class="brow-acts">
      <button class="btn bg" style="font-size:8px;padding:3px 8px" onclick="doLoad('${k}')">LOAD</button>
      <button class="btn by" style="font-size:8px;padding:3px 8px" onclick="doExportNamed('${k}')">⬇</button>
      <button class="btn br" style="font-size:8px;padding:3px 8px" onclick="doDelete('${k}')">✕</button>
    </div>
  </div>`).join("");
  body.innerHTML=`${rows}<div class="mbtns"><button class="btn br" onclick="closeModal()">CLOSE</button></div>`;
}
function doSave(){
  const name=document.getElementById("bname")?.value?.trim();
  if(!name){alert("Please enter a name.");return;}
  const b=getBuilds();
  b[name]={levels:{...LV},date:new Date().toLocaleDateString()};
  putBuilds(b);
  closeModal();
  alert(`✓ Build "${name}" saved!`);
}
function doLoad(name){
  const b=getBuilds();
  if(!b[name])return;
  Object.assign(LV,b[name].levels);
  closeModal();refresh();
}
function doDelete(name){
  if(!confirm(`Delete "${name}"?`))return;
  const b=getBuilds();delete b[name];putBuilds(b);
  renderBuildsModal(document.getElementById("mbody"));
}
function doExport(name){
  const lbl=name||`Build_${new Date().toLocaleDateString().replace(/\//g,"-")}`;
  const active=getActives(), salv=getSalvMap();
  const lines=[
    `MARATHON UPGRADE BUILD — ${lbl}`,
    `Generated: ${new Date().toLocaleString()}`,
    "=".repeat(52),"",
    `Total Credits:   ₵${getTotalCreds().toLocaleString()}`,
    `Nodes Unlocked:  ${active.length}`,
    `Total Levels:    ${active.reduce((s,u)=>s+LV[u.id],0)}`,
    `Salvage Types:   ${salv.length}`,
    "",
    "── SELECTED UPGRADES ──────────────────────────",
  ];
  Object.keys(FC).forEach(f=>{
    const fa=active.filter(u=>u.f===f);
    if(!fa.length)return;
    lines.push(`\n[${f.toUpperCase()}]`);
    fa.forEach(u=>{
      const lv=LV[u.id];
      lines.push(`  ${u.name.padEnd(24)} Lv ${lv}/${getMaxLv(u)}  ${u.levels[lv-1].eff}`);
    });
  });
  lines.push("","── SALVAGE SHOPPING LIST ───────────────────────");
  salv.forEach(([item,qty])=>{
    const loc=SL[item];
    const linfo=loc?` [${loc.rarity.toUpperCase()}] ${loc.map} — ${loc.pois.join("/")}  (${loc.note})`:" [LOCATION UNCONFIRMED]";
    lines.push(`  ◈ ${item.padEnd(26)} ×${String(qty).padStart(3)}${linfo}`);
  });
  const blob=new Blob([lines.join("\n")],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`marathon-build-${lbl.replace(/\s+/g,"-").replace(/[^a-z0-9-]/gi,"")}.txt`;
  a.click();
}
function doExportNamed(name){
  const b=getBuilds();if(!b[name])return;
  const save={...LV};Object.assign(LV,b[name].levels);
  doExport(name);
  Object.assign(LV,save);
}
function bgClick(e){if(e.target===document.getElementById("modal-bg"))closeModal();}
function closeModal(){document.getElementById("modal-bg").classList.remove("on");}

let currentScale=1;
function fitTree(){
  const scroll=document.getElementById("tscroll");
  const canvas=document.getElementById("tcanvas");
  const sw=scroll.clientWidth-40, sh=scroll.clientHeight-40;
  const cw=canvas.scrollWidth/currentScale, ch=canvas.scrollHeight/currentScale;
  const scale=Math.min(sw/cw, sh/ch, 1);
  currentScale=scale;
  canvas.style.transform=`scale(${scale})`;
  canvas.style.width=(cw*scale)+"px";
  canvas.style.height=(ch*scale)+"px";
  document.getElementById("btn-100").textContent=Math.round(scale*100)+"%";
}
function resetZoom(){
  currentScale=1;
  const canvas=document.getElementById("tcanvas");
  canvas.style.transform="scale(1)";
  canvas.style.width="";
  canvas.style.height="";
  document.getElementById("btn-100").textContent="100%";
}

let activeRunner=null;

function renderRunners(){
  const el=document.getElementById("rv");
  if(activeRunner){renderRunnerDetail(el);return;}
  const tierCol={S:"#39ff14",A:"#ffd600",B:"#ff6d00"};
  el.innerHTML=`
    <div class="rv-hdr">🏃 RUNNER BUILDS</div>
    <div class="rv-sub">Select a shell to see recommended builds, upgrades, weapons and cores. Click "LOAD BUILD" to auto-select upgrades in the tree.</div>
    <div class="runner-grid">
      ${RUNNERS.map(r=>`
        <div class="runner-card" style="border-top-color:${r.color}" onclick="selectRunner('${r.id}')">
          <div class="runner-card-hdr">
            <div class="runner-icon" style="background:${r.color}22;border:1px solid ${r.color}44">${r.icon}</div>
            <div>
              <div style="font-family:'Orbitron',monospace;font-size:12px;color:${r.color};letter-spacing:2px">${r.name}</div>
              <div style="font-size:9px;color:#4a6070;margin-top:2px">${r.role}</div>
            </div>
            <span class="runner-tier" style="border-color:${tierCol[r.tier]||"#4a6070"};color:${tierCol[r.tier]||"#4a6070"}">${r.tier}-TIER</span>
          </div>
          <div class="runner-card-body">
            <div style="font-size:9px;color:#8aa0b0;line-height:1.6;margin-bottom:8px">${r.playstyle}</div>
            <div style="display:flex;gap:8px;font-size:8px">
              <span style="color:#4a6070">SOLO: <span style="color:${tierCol[r.solo[0]]||"#c8d8e8"}">${r.solo.split(" — ")[0]}</span></span>
              <span style="color:#4a6070">SQUAD: <span style="color:${tierCol[r.squad[0]]||"#c8d8e8"}">${r.squad.split(" — ")[0]}</span></span>
            </div>
          </div>
        </div>`).join("")}
    </div>`;
}

function selectRunner(id){activeRunner=id;renderRunners();}

function renderRunnerDetail(el){
  const r=RUNNERS.find(x=>x.id===activeRunner);
  if(!r)return;
  const load=RUNNER_UPGRADE_LOADS[r.id]||[];
  // Calculate costs for this build
  let totalCreds=0;const salvNeeds={};
  load.forEach(({id,lv})=>{
    const u=UG.find(x=>x.id===id);
    if(!u)return;
    for(let i=0;i<Math.min(lv,u.levels.length);i++){
      totalCreds+=u.levels[i].credits;
      u.levels[i].salvage.forEach(s=>{salvNeeds[s.i]=(salvNeeds[s.i]||0)+s.q;});
    }
  });
  const salvRows=Object.entries(salvNeeds).sort((a,b)=>b[1]-a[1]).map(([item,qty])=>{
    const loc=SL[item];const rc=loc?RC[loc.rarity]:"#4a6070";
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:2px 5px;border-left:2px solid ${rc};margin-bottom:3px;font-size:9px">
      <span style="color:#c8d8e8">◈ ${item}</span><span style="color:#ffd600;font-weight:700">×${qty}</span>
    </div>`;
  }).join("");

  el.innerHTML=`
    <div style="padding:20px">
      <div class="rd-back" onclick="activeRunner=null;renderRunners()">← BACK TO ALL RUNNERS</div>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <div style="width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:${r.color}22;border:2px solid ${r.color}66">${r.icon}</div>
        <div>
          <div style="font-family:'Orbitron',monospace;font-size:18px;color:${r.color};letter-spacing:3px">${r.name}</div>
          <div style="font-size:10px;color:#4a6070;margin-top:2px">${r.role}</div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div style="font-size:9px;color:#4a6070">SOLO / SQUAD</div>
          <div style="font-size:11px;font-weight:700">${r.solo.split(" — ")[0]} / ${r.squad.split(" — ")[0]}</div>
        </div>
      </div>
      <div style="font-size:10px;color:#8aa0b0;line-height:1.7;margin-bottom:16px;border-left:3px solid ${r.color};padding-left:12px">${r.playstyle}</div>

      <div class="rd-grid">
        <div class="rd-box">
          <div class="rd-box-hdr" style="color:${r.color}">⚡ ABILITIES</div>
          <div style="margin-bottom:8px"><div style="font-size:8px;color:#ffd600;letter-spacing:1px;margin-bottom:3px">PRIME</div><div style="font-size:9px;color:#c8d8e8">${r.prime}</div></div>
          <div style="margin-bottom:8px"><div style="font-size:8px;color:#4a9eff;letter-spacing:1px;margin-bottom:3px">TACTICAL</div><div style="font-size:9px;color:#c8d8e8">${r.tactical}</div></div>
          <div><div style="font-size:8px;color:#39ff14;letter-spacing:1px;margin-bottom:3px">TRAITS</div>
            ${r.traits.map(t=>`<div style="font-size:9px;color:#c8d8e8;margin-bottom:2px">• ${t}</div>`).join("")}
          </div>
        </div>
        <div class="rd-box">
          <div class="rd-box-hdr" style="color:#ffd600">🔫 RECOMMENDED WEAPONS</div>
          ${r.weapons.map(w=>{
            const wc={S:"#39ff14",A:"#ffd600",B:"#ff6d00"}[w.tier]||"#4a6070";
            return`<div style="margin-bottom:8px;padding:5px 8px;border-left:2px solid ${wc}">
              <div style="font-size:9px;color:#fff;font-weight:700">${w.name} <span style="font-size:7px;padding:1px 4px;border:1px solid ${wc};color:${wc}">${w.tier}</span></div>
              <div style="font-size:8px;color:#4a6070;margin-top:2px">${w.role}</div>
            </div>`;
          }).join("")}
        </div>
        <div class="rd-box">
          <div class="rd-box-hdr" style="color:#bf5af2">💎 CORES</div>
          ${r.cores.map(c=>`<div style="font-size:9px;color:#c8d8e8;margin-bottom:6px;padding:4px 8px;border-left:2px solid #bf5af2">• ${c}</div>`).join("")}
          <div style="margin-top:10px"><div style="font-size:8px;color:#4a6070;letter-spacing:1px;margin-bottom:4px">BEST SYNERGY</div>
            <div style="font-size:9px;color:#8aa0b0">${r.synergy}</div>
          </div>
        </div>
        <div class="rd-box">
          <div class="rd-box-hdr" style="color:#ff6d00">📦 BUILD COSTS</div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1a2530">
            <span style="color:#4a6070;font-size:9px">Total Credits</span>
            <span style="color:#ffd600;font-weight:700">₵${totalCreds.toLocaleString()}</span>
          </div>
          ${salvRows||`<div style="color:#4a6070;font-size:9px">No salvage needed</div>`}
        </div>
      </div>

      <div class="rd-box" style="margin-bottom:14px">
        <div class="rd-box-hdr" style="color:#39ff14">💡 TIPS</div>
        ${r.tips.map(t=>`<div style="font-size:9px;color:#8aa0b0;margin-bottom:6px;padding-left:10px;border-left:2px solid #1a2530">• ${t}</div>`).join("")}
      </div>

      <div class="rd-box" style="margin-bottom:14px">
        <div class="rd-box-hdr" style="color:#00e5ff">⬆ PRIORITY UPGRADES FOR THIS BUILD</div>
        <div style="margin-bottom:8px;font-size:9px;color:#4a6070">${r.upgrades.reason}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          ${load.map(({id,lv})=>{
            const u=UG.find(x=>x.id===id);
            if(!u)return"";
            const fc=FC[u.f];
            return`<span style="font-size:8px;padding:3px 8px;border:1px solid ${fc.color};color:${fc.color};background:${fc.color}11">${u.name} Lv${lv}</span>`;
          }).join("")}
        </div>
      </div>

      <button class="rd-load-btn" onclick="loadRunnerBuild('${r.id}')">
        ⬆ LOAD THIS BUILD INTO UPGRADE TREE
      </button>
    </div>`;
}

function loadRunnerBuild(id){
  const load=RUNNER_UPGRADE_LOADS[id]||[];
  UG.forEach(u=>{LV[u.id]=0;PL[u.id]=0;});
  load.forEach(({id:uid,lv})=>{
    if(LV[uid]!==undefined) LV[uid]=lv;
  });
  refresh();
  activeRunner=null;
  showMain("tree");
}

let gunsSubPage="weapons";
let selectedWeapon=null;
let favouriteLoadouts=JSON.parse(localStorage.getItem("mara_fav_guns")||"[]");

function saveGunFavourites(){
  try{localStorage.setItem("mara_fav_guns",JSON.stringify(favouriteLoadouts));}catch(e){}
}

function renderGuns(){
  const el=document.getElementById("gv");
  if(gunsSubPage==="weapons") renderWeapons(el);
  else renderItemsPage(el);
}

function renderWeapons(el){
  const types=[...new Set(WEAPONS_DATA.map(w=>w.type))];
  let filterType=window._gunFilter||"All";
  let filterTier=window._gunTier||"All";
  let search=(window._gunSearch||"").toLowerCase();

  let filtered=WEAPONS_DATA.filter(w=>{
    if(filterType!=="All"&&w.type!==filterType)return false;
    if(filterTier!=="All"&&w.tier!==filterTier)return false;
    if(search&&!w.name.toLowerCase().includes(search)&&!w.type.toLowerCase().includes(search))return false;
    return true;
  });

  el.innerHTML=`
    <div style="padding:12px 20px;border-bottom:1px solid #1a2530;display:flex;align-items:center;position:sticky;top:0;background:#070d12;z-index:10">
      <div style="font-family:'Orbitron',monospace;font-size:13px;color:#00e5ff;letter-spacing:3px;flex-shrink:0;margin-right:16px">🔫 GUNS & ITEMS</div>
      <div style="display:flex;flex-shrink:0;border:1px solid #1a2530">
        <button onclick="gunsSubPage='weapons';renderGuns()" style="padding:6px 16px;border:none;border-right:1px solid #1a2530;background:transparent;cursor:pointer;font-family:inherit;font-size:10px;color:#ffd600;white-space:nowrap">WEAPONS</button>
        <button onclick="gunsSubPage='items';renderGuns()" style="padding:6px 16px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:10px;color:#4a6070;white-space:nowrap">ITEMS</button>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0">
        <input id="gun-search" placeholder="Search…" value="${window._gunSearch||""}" oninput="window._gunSearch=this.value;renderGuns()" style="background:#0d1318;border:1px solid #1a2530;color:#c8d8e8;padding:4px 8px;font-family:inherit;font-size:9px;width:120px">
        <select onchange="window._gunFilter=this.value;renderGuns()" style="background:#0d1318;border:1px solid #1a2530;color:#c8d8e8;padding:4px 8px;font-family:inherit;font-size:9px">
          <option value="All" ${filterType==="All"?"selected":""}>All Types</option>
          ${types.map(t=>`<option value="${t}" ${filterType===t?"selected":""}>${t}</option>`).join("")}
        </select>
        <select onchange="window._gunTier=this.value;renderGuns()" style="background:#0d1318;border:1px solid #1a2530;color:#c8d8e8;padding:4px 8px;font-family:inherit;font-size:9px">
          ${["All","S","A","B","C"].map(t=>`<option value="${t}" ${filterTier===t?"selected":""}>${t==="All"?"All Tiers":t+"-Tier"}</option>`).join("")}
        </select>
      </div>
    </div>
    <div style="padding:16px 20px">
      ${selectedWeapon?renderWeaponDetail():`
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">
          ${filtered.map(w=>renderWeaponCard(w)).join("")}
        </div>
        ${favouriteLoadouts.length?`
          <div style="margin-top:20px">
            <div style="font-family:'Orbitron',monospace;font-size:10px;color:#ffd600;letter-spacing:2px;margin-bottom:10px">★ SAVED LOADOUTS</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">
              ${favouriteLoadouts.map((f,i)=>renderSavedLoadout(f,i)).join("")}
            </div>
          </div>`:""}
      `}
    </div>`;
}

function renderWeaponCard(w){
  const tc={S:"#39ff14",A:"#ffd600",B:"#ff6d00",C:"#ff4444"}[w.tier]||"#4a6070";
  const ac=AMMO_COL[w.ammo]||"#4a6070";
  return`<div style="background:#0d1318;border:1px solid #1a2530;border-top:3px solid ${tc};cursor:pointer;transition:all .2s;padding:12px 14px" onclick="selectedWeapon='${w.id}';renderGuns()"
    onmouseenter="this.style.transform='translateY(-2px)';this.style.boxShadow='0 4px 16px rgba(0,0,0,.5)'"
    onmouseleave="this.style.transform='';this.style.boxShadow=''">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="font-size:20px">${w.emoji}</span>
      <div style="flex:1">
        <div style="font-family:'Orbitron',monospace;font-size:10px;color:#c8d8e8;letter-spacing:1px">${w.name}</div>
        <div style="font-size:8px;color:#4a6070;margin-top:1px">${w.type}</div>
      </div>
      <span style="font-size:8px;padding:2px 6px;border:1px solid ${tc};color:${tc}">${w.tier}</span>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
      <span style="font-size:7px;padding:1px 5px;border:1px solid ${ac};color:${ac}">${w.ammo}</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px">
      ${renderStatBar("DMG",w.dmg,250,"#ff4444")}
      ${renderStatBar("ROF",w.rof,900,"#39ff14")}
      ${renderStatBar("MAG",w.mag,75,"#4a9eff")}
      ${renderStatBar("RANGE",w.range,100,"#ffd600")}
      ${renderStatBar("HANDLING",w.handling,100,"#bf5af2")}
      ${renderStatBar("RELOAD",100-(w.reload/5*100),100,"#ff6d00")}
    </div>
    <div style="font-size:8.5px;color:#4a6070;margin-top:8px;line-height:1.5;border-top:1px solid #1a2530;padding-top:6px">${w.desc.substring(0,90)}…</div>
  </div>`;
}

function renderStatBar(label,val,max,col){
  const pct=Math.min(100,Math.round(val/max*100));
  return`<div>
    <div style="font-size:7px;color:#4a6070;margin-bottom:2px">${label}</div>
    <div style="height:3px;background:#1a2530;border-radius:1px">
      <div style="height:100%;width:${pct}%;background:${col};border-radius:1px"></div>
    </div>
  </div>`;
}

// It looks like eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
const SB_KEY = "PASTE_YOUR_ANON_JWT_HERE";

// ══════════════════════════════════════════
// LOW-LEVEL SUPABASE
// ══════════════════════════════════════════
async function sbFetch(path, opts = {}, useAuth = true) {
  const headers = {
    "apikey": SB_KEY,
    "Content-Type": "application/json",
    "Authorization": "Bearer " + (useAuth && authToken ? authToken : SB_KEY),
    ...(opts.extraHeaders || {})
  };
  delete opts.extraHeaders;
  try {
    const res = await fetch(SB_URL + path, { ...opts, headers });
    if (res.status === 204) return null;
    const json = await res.json();
    if (res.ok) return json;
    console.error("sbFetch", res.status, json);
    return null;
  } catch(e) {
    console.error("sbFetch network error", e);
    return null;
  }
}

async function authSignUp(email, password, username) {
  setAuthMsg("Creating account…", "info");
  const res = await sbFetch("/auth/v1/signup", {
    method: "POST",
    body: JSON.stringify({ email, password })
  }, false);
  if (!res?.access_token) {
    setAuthMsg(res?.error_description || "Sign-up failed. Try a different email.", "error");
    return;
  }
  authToken = res.access_token;
  authUser  = { id: res.user.id, email, username };
  // create profile row
  await sbFetch("/rest/v1/profiles", {
    method: "POST",
    extraHeaders: { "Prefer": "return=minimal" },
    body: JSON.stringify({
      id: res.user.id, email, username,
      faction_data: { LV, PL },
      updated_at: new Date().toISOString()
    })
  });
  _onAuthOK();
  setAuthMsg("Account created — welcome!", "success");
  setTimeout(closeAuthModal, 900);
}

async function authSignIn(email, password) {
  setAuthMsg("Signing in…", "info");
  const res = await sbFetch("/auth/v1/token?grant_type=password", {
    method: "POST",
    body: JSON.stringify({ email, password })
  }, false);
  if (!res?.access_token) {
    setAuthMsg("Wrong email or password.", "error");
    return;
  }
  authToken = res.access_token;
  authUser  = { id: res.user.id, email };
  // load profile + restore build
  const rows = await sbFetch(`/rest/v1/profiles?id=eq.${res.user.id}&select=*`);
  if (rows?.[0]) {
    authUser.username = rows[0].username;
    const fd = rows[0].faction_data || {};
    if (fd.LV) Object.assign(LV, fd.LV);
    if (fd.PL) Object.assign(PL, fd.PL);
    refresh();
  }
  _onAuthOK();
  setAuthMsg("Welcome back!", "success");
  setTimeout(closeAuthModal, 900);
}

async function authSignOut() {
  await sbFetch("/auth/v1/logout", { method: "POST" });
  authUser = authToken = null;
  if (sqPollTimer) clearInterval(sqPollTimer);
  sessionCode = null; squadPlayers = {};
  try { sessionStorage.clear(); } catch(e){}
  renderAuthWidget();
  updateSquadWidget();
  updateHdr();
}

function _onAuthOK() {
  try {
    sessionStorage.setItem("mara_token", authToken);
    sessionStorage.setItem("mara_user",  JSON.stringify(authUser));
  } catch(e){}
  renderAuthWidget();
  updateSquadWidget();
  updateHdr();
  pushProfile();
}

async function tryRestoreSession() {
  try {
    const token = sessionStorage.getItem("mara_token");
    const user  = JSON.parse(sessionStorage.getItem("mara_user") || "null");
    if (!token || !user) return;
    authToken = token; authUser = user;
    const rows = await sbFetch(`/rest/v1/profiles?id=eq.${user.id}&select=*`);
    if (rows?.[0]) {
      authUser.username = rows[0].username;
      const fd = rows[0].faction_data || {};
      if (fd.LV) Object.assign(LV, fd.LV);
      if (fd.PL) Object.assign(PL, fd.PL);
      refresh();
      renderAuthWidget();
      updateSquadWidget();
      updateHdr();
      // auto-join from URL
      const code = new URLSearchParams(window.location.search).get("session");
      if (code) squadJoin(code);
    } else {
      authUser = authToken = null;
      sessionStorage.clear();
    }
  } catch(e) {}
}

async function pushProfile() {
  if (!authUser || !authToken) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(async () => {
    await sbFetch(`/rest/v1/profiles?id=eq.${authUser.id}`, {
      method: "PATCH",
      extraHeaders: { "Prefer": "return=minimal" },
      body: JSON.stringify({ faction_data: { LV, PL }, updated_at: new Date().toISOString() })

  }, 1200);
}

function _genCode() {
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length:6},()=>chars[Math.floor(Math.random()*32)]).join("");
}

async function squadCreate() {
  if (!authUser) { openAuthModal("login"); return; }
  sessionCode = _genCode();
  await _squadUpsertRow();
  _startPolling();
  updateSquadWidget();
  if (curTab==="squad") renderSquadPage();
}

async function squadJoin(code) {
  if (!authUser) { openAuthModal("login"); return; }
  sessionCode = code.toUpperCase().trim();
  if (!sessionCode) return;
  await _squadUpsertRow();
  _startPolling();
  updateSquadWidget();
  if (curTab==="squad") renderSquadPage();
}

async function _squadUpsertRow() {
  const name = authUser.username || authUser.email;
  // delete then insert for clean upsert
  await sbFetch(`/rest/v1/squad_sessions?session_code=eq.${sessionCode}&player_name=eq.${encodeURIComponent(name)}`,
    { method:"DELETE" });
  await sbFetch("/rest/v1/squad_sessions", {
    method: "POST",
    extraHeaders: { "Prefer": "return=minimal" },
    body: JSON.stringify({
      session_code: sessionCode,
      player_name: name,
      faction_data: { LV, PL },
      updated_at: new Date().toISOString()
    })
  });
}

async function squadLeave() {
  if (sessionCode && authUser) {
    const name = authUser.username || authUser.email;
    await sbFetch(`/rest/v1/squad_sessions?session_code=eq.${sessionCode}&player_name=eq.${encodeURIComponent(name)}`,
      { method:"DELETE" });
  }
  if (sqPollTimer) clearInterval(sqPollTimer);
  sqPollTimer = null;
  sessionCode = null; squadPlayers = {}; squadViewTab = null;
  updateSquadWidget();
  if (curTab==="squad") renderSquadPage();
}

async function _squadPushData() {
  if (!sessionCode || !authUser) return;
  const name = authUser.username || authUser.email;
  await sbFetch(`/rest/v1/squad_sessions?session_code=eq.${sessionCode}&player_name=eq.${encodeURIComponent(name)}`, {
    method: "PATCH",
    extraHeaders: { "Prefer": "return=minimal" },
    body: JSON.stringify({ faction_data:{ LV, PL }, updated_at: new Date().toISOString() })
  });
}

function _startPolling() {
  _loadSquad();
  if (sqPollTimer) clearInterval(sqPollTimer);
  sqPollTimer = setInterval(_loadSquad, 3000);
}

async function _loadSquad() {
  if (!sessionCode) return;
  const rows = await sbFetch(`/rest/v1/squad_sessions?session_code=eq.${sessionCode}&select=player_name,faction_data,updated_at&order=updated_at`);
  if (!Array.isArray(rows)) return;
  squadPlayers = {};
  rows.forEach(r => { squadPlayers[r.player_name] = r; });
  updateSquadWidget();
  if (curTab==="squad") renderSquadPage();
}

function _renderOverview(players, myName) {
  if (!players.length) return `<div style="color:#4a6070;text-align:center;padding:48px;font-size:11px">
    Waiting for players to join…<br><span style="font-size:9px;margin-top:8px;display:block">Share the invite link from the header above</span>
  </div>`;

  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">
    ${players.map(p=>_playerMiniCard(p, p.player_name===myName)).join("")}
  </div>`;
}

function _playerMiniCard(p, isMe) {
  const fd   = p.faction_data || {};
  const pLV  = fd.LV || {};
  const pPL  = fd.PL || {};
  const owned   = UG.filter(u=>(pLV[u.id]||0)>0);
  const planned = UG.filter(u=>(pPL[u.id]||0)>0&&!(pLV[u.id]||0));
  const totalC  = owned.reduce((s,u)=>{ let c=0; for(let i=0;i<pLV[u.id];i++) c+=u.levels[i].credits; return s+c; },0);
  const ago     = Math.round((Date.now()-new Date(p.updated_at).getTime())/1000);
  const live    = ago < 8;

  const fBars = Object.keys(FC).map(f=>{
    const fa = owned.filter(u=>u.f===f);
    if (!fa.length) return "";
    const tot    = UG.filter(u=>u.f===f).reduce((s,u)=>s+u.levels.length,0);
    const lvs    = fa.reduce((s,u)=>s+(pLV[u.id]||0),0);
    const pct    = Math.round(lvs/tot*100);
    return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
      <div style="font-size:7.5px;color:${FC[f].color};width:64px;flex-shrink:0;font-family:'Orbitron',monospace;overflow:hidden;white-space:nowrap">${f.substring(0,7)}</div>
      <div style="flex:1;height:4px;background:#1a2530;border-radius:2px">
        <div style="height:100%;width:${pct}%;background:${FC[f].color};border-radius:2px"></div>
      </div>
      <div style="font-size:7px;color:#4a6070;width:26px;text-align:right">${pct}%</div>
    </div>`;
  }).filter(Boolean).join("");

  return `<div onclick="squadViewTab='${p.player_name}';renderSquadPage()"
    style="background:#0d1318;border:1px solid ${isMe?'#00e5ff':'#1a2530'};border-top:3px solid ${isMe?'#00e5ff':'#2a3a48'};padding:14px;cursor:pointer;transition:all .2s"
    onmouseenter="this.style.transform='translateY(-2px)';this.style.boxShadow='0 4px 16px rgba(0,0,0,.5)'"
    onmouseleave="this.style.transform='';this.style.boxShadow=''">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div style="font-family:'Orbitron',monospace;font-size:11px;color:${isMe?'#00e5ff':'#c8d8e8'};flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.player_name}</div>
      ${isMe?'<span style="font-size:7px;padding:1px 5px;border:1px solid #00e5ff;color:#00e5ff">YOU</span>':''}
      <div style="width:7px;height:7px;border-radius:50%;background:${live?'#39ff14':'#4a6070'};flex-shrink:0"></div>
    </div>
    <div style="display:flex;gap:14px;margin-bottom:10px;font-size:9.5px">
      <span style="color:#ffd600">₵${totalC.toLocaleString()}</span>
      <span style="color:#39ff14">${owned.length} owned</span>
      ${planned.length?`<span style="color:#bf5af2">${planned.length} planned</span>`:""}
      <span style="color:#4a6070;margin-left:auto">${ago<60?ago+"s":Math.floor(ago/60)+"m"}</span>
    </div>
    ${fBars}
    <div style="margin-top:10px;font-size:8px;color:#4a6070;letter-spacing:1px;text-align:center">CLICK FOR FULL BUILD →</div>
  </div>`;
}

function _renderPlayerDetail(playerName, myName) {
  const p = squadPlayers[playerName];
  if (!p) return `<div style="color:#4a6070">Player not found</div>`;
  const fd   = p.faction_data || {};
  const pLV  = fd.LV || {};
  const pPL  = fd.PL || {};
  const owned   = UG.filter(u=>(pLV[u.id]||0)>0);
  const planned = UG.filter(u=>(pPL[u.id]||0)>0&&!(pLV[u.id]||0));
  const totalC  = owned.reduce((s,u)=>{ let c=0; for(let i=0;i<pLV[u.id];i++) c+=u.levels[i].credits; return s+c; },0);
  const isMe    = playerName===myName;
  const ago     = Math.round((Date.now()-new Date(p.updated_at).getTime())/1000);

  return `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div style="font-family:'Orbitron',monospace;font-size:16px;color:${isMe?'#00e5ff':'#c8d8e8'}">${playerName}${isMe?" <span style='font-size:10px;color:#00e5ff'>(YOU)</span>":""}</div>
      <span style="font-size:11px;color:#ffd600">₵${totalC.toLocaleString()}</span>
      <span style="font-size:11px;color:#39ff14">${owned.length} owned</span>
      ${planned.length?`<span style="font-size:11px;color:#bf5af2">${planned.length} planned</span>`:""}
      <span style="font-size:9px;color:#4a6070;margin-left:auto">Updated ${ago}s ago</span>
    </div>

    ${Object.keys(FC).map(f=>{
      const fa = owned.filter(u=>u.f===f);
      const fp = planned.filter(u=>u.f===f);
      if (!fa.length&&!fp.length) return "";
      const fc  = FC[f];
      const tot = UG.filter(u=>u.f===f).reduce((s,u)=>s+u.levels.length,0);
      const lvs = fa.reduce((s,u)=>s+(pLV[u.id]||0),0);
      const pct = Math.round(lvs/tot*100);
      return `<div style="background:#0d1318;border:1px solid #1a2530;border-left:3px solid ${fc.color};padding:12px 14px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <div style="font-family:'Orbitron',monospace;font-size:11px;color:${fc.color};letter-spacing:2px">${f}</div>
          <div style="flex:1;height:3px;background:#1a2530;border-radius:2px">
            <div style="height:100%;width:${pct}%;background:${fc.color};border-radius:2px"></div>
          </div>
          <div style="font-size:9px;color:#4a6070">${pct}%</div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">
          ${fa.map(u=>`<span style="font-size:9.5px;padding:3px 9px;border:1px solid ${fc.color};color:${fc.color};background:${fc.color}11">${u.name}${pLV[u.id]>1?` Lv${pLV[u.id]}`:""}</span>`).join("")}
          ${fp.map(u=>`<span style="font-size:9.5px;padding:3px 9px;border:1px solid #bf5af2;color:#bf5af2;background:#bf5af211">${u.name}${pPL[u.id]>1?` Lv${pPL[u.id]}`:""} ◈</span>`).join("")}
        </div>
      </div>`;
    }).join("")}
    ${!owned.length&&!planned.length?`<div style="color:#4a6070;font-size:11px;padding:20px 0">No upgrades selected yet</div>`:""}`;
}

                style="cursor:pointer;transition:all .25s" filter="${sel?'url(#glow-f)':''}"
                onclick="pinZone=pinZone==='${z.id}'?null:'${z.id}';renderMap()"
                onmouseenter="showMapZoneTT(event,'${activeMap}','${z.id}')"
                onmouseleave="hideTT()" onmousemove="moveTT(event)"/>
              <!-- Zone label -->
              <text x="${z.x+z.w/2}" y="${z.y+16}" text-anchor="middle"
                font-family="Orbitron,monospace" font-size="10" font-weight="700"
                fill="${z.color}" opacity="${sel?1:.85}" style="pointer-events:none;letter-spacing:.5px">${z.label}</text>
              <text x="${z.x+z.w/2}" y="${z.y+30}" text-anchor="middle"
                font-family="monospace" font-size="8.5"
                fill="${z.tcolor}" opacity=".75" style="pointer-events:none">${z.tier}</text>
              ${z.danger>=4?`<text x="${z.x+z.w-10}" y="${z.y+14}" font-size="11" fill="#ff4444" opacity=".9" style="pointer-events:none">⚠</text>`:''}
            `;
          }).join("")}

          <!-- LOOT PINS -->
          ${map.pins.map(p=>`
            <circle cx="${p.x}" cy="${p.y}" r="${p.hot?11:9}"
              fill="${p.hot?'#ff4444':'#ffd600'}18" stroke="${p.hot?'#ff4444':'#ffd600'}" stroke-width="1.5"
              style="cursor:pointer;transition:all .2s"
              onmouseenter="showMapPinTT(event,'${encodeURIComponent(p.label)}','${encodeURIComponent(p.tip)}',${!!p.hot})"
              onmouseleave="hideTT()" onmousemove="moveTT(event)"/>
            <text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="${p.hot?13:11}" style="pointer-events:none">${p.icon}</text>
          `).join("")}

          <!-- Compass -->
          <text x="${map.vw-18}" y="22" text-anchor="middle" font-family="Orbitron,monospace" font-size="10" fill="${map.color}" opacity=".4">N</text>
          <text x="${map.vw-18}" y="12" text-anchor="middle" font-size="8" fill="${map.color}" opacity=".3">↑</text>
          <text x="${map.vw-10}" y="${map.vh-8}" font-family="Orbitron,monospace" font-size="9" fill="${map.color}" opacity=".12" text-anchor="end">MARATHON // UPGRADE TRACKER</text>
        </svg>
      </div>

      <!-- SIDEBAR -->
      <div style="width:320px;flex-shrink:0;border-left:1px solid #1a2530;display:flex;flex-direction:column;overflow:hidden;background:#070d12">

        <!-- Map description -->
        <div style="padding:14px 16px;border-bottom:1px solid #1a2530;flex-shrink:0">
          <div style="font-size:9.5px;color:#8aa0b0;line-height:1.7">${map.desc}</div>
        </div>

        <!-- Zone detail OR zone list -->
        <div style="flex:1;overflow-y:auto">
          ${pinZone ? _renderZoneDetail(map) : _renderZoneList(map)}
        </div>

        <!-- Legend -->
        <div style="padding:10px 14px;border-top:1px solid #1a2530;flex-shrink:0;background:#060c10">
          <div style="font-size:8px;color:#4a6070;letter-spacing:1px;margin-bottom:6px">LOOT TIERS</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${[["#bf5af2","Superior"],["#4a9eff","Enhanced"],["#8aad6a","Standard"],["#ffd600","Event/Extract"],["#ff4444","High Risk"]].map(([c,l])=>`
              <div style="display:flex;align-items:center;gap:4px">
                <div style="width:8px;height:8px;border:1px solid ${c};background:${c}22;border-radius:1px"></div>
                <span style="font-size:8px;color:#4a6070">${l}</span>
              </div>`).join("")}
          </div>
          <div style="font-size:8px;color:#2a3a48;margin-top:7px">Click any zone to pin details · hover pins for loot tips</div>
        </div>
      </div>
    </div>`;
}

function _renderZoneList(map) {
  return `
    <div style="padding:8px 14px;font-family:'Orbitron',monospace;font-size:8.5px;color:#4a6070;letter-spacing:2px;border-bottom:1px solid #1a2530">

    ${map.zones.map(z=>`
      <div onclick="pinZone='${z.id}';renderMap()" style="padding:11px 14px;border-bottom:1px solid #1a2530;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s"

        <div style="width:10px;height:10px;border:1.5px solid ${z.color};background:${z.color}1a;flex-shrink:0;border-radius:2px"></div>
        <div style="flex:1">
          <div style="font-size:10.5px;color:${z.color};font-family:'Orbitron',monospace;margin-bottom:2px">${z.label}</div>
          <div style="font-size:8.5px;color:${z.tcolor}">${z.tier}</div>
        </div>
        <div style="display:flex;gap:2px">
          ${Array.from({length:5},(_,i)=>`<div style="width:5px;height:5px;border-radius:1px;background:${i<z.danger?'#ff4444':'#1a2530'}"></div>`).join("")}
        </div>
      </div>

    <div style="padding:12px 14px;border-bottom:1px solid #1a2530">

          <span style="font-size:15px;flex-shrink:0">${p.icon}</span>

            <div style="font-size:10px;color:${p.hot?'#ff4444':'#c8d8e8'}">${p.label}</div>

function _renderZoneDetail(map) {
  const z = map.zones.find(x=>x.id===pinZone);

  return `
    <div style="padding:8px 14px;border-bottom:1px solid #1a2530;display:flex;align-items:center;gap:8px">
      <button onclick="pinZone=null;renderMap()" style="font-size:9.5px;color:#4a6070;background:transparent;border:none;cursor:pointer;padding:0;transition:color .2s" onmouseenter="this.style.color='#c8d8e8'" onmouseleave="this.style.color='#4a6070'">← ALL ZONES</button>
    </div>
    <div style="padding:14px 16px;border-bottom:1px solid ${z.color}44">
      <div style="font-family:'Orbitron',monospace;font-size:13px;color:${z.color};margin-bottom:6px">${z.label}</div>

        <div style="display:flex;gap:3px">

        <span style="font-size:8.5px;color:#4a6070">Danger ${z.danger}/5</span>

      <div style="font-size:10px;color:#8aa0b0;line-height:1.7">${z.desc}</div>

    <div style="padding:12px 16px;border-bottom:1px solid #1a2530">
      <div style="font-family:'Orbitron',monospace;font-size:8.5px;color:#00e5ff;letter-spacing:1px;margin-bottom:10px">LOOT FOUND HERE</div>

        <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-left:2px solid ${z.color};margin-bottom:5px">
          <span style="font-size:10px;color:#c8d8e8">${l}</span>
        </div>`).join("")}

    <div style="margin:12px 16px;padding:12px;background:${z.color}08;border:1px solid #1a2530;border-left:3px solid #ffd600">
      <div style="font-family:'Orbitron',monospace;font-size:8.5px;color:#ffd600;margin-bottom:7px">💡 PRO TIP</div>
      <div style="font-size:10px;color:#8aa0b0;line-height:1.7">${z.tip}</div>

// Map tooltip helpers
function showMapZoneTT(e, mapId, zoneId) {
  const map  = MAPS[mapId];
  const zone = map?.zones.find(z=>z.id===zoneId);
  if (!zone) return;
  const tt = document.getElementById("tt");
  tt.innerHTML = `
    <div style="font-family:'Orbitron',monospace;font-size:11px;color:${zone.color};margin-bottom:6px">${zone.label}</div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:7px">
      <span style="font-size:8.5px;padding:1px 6px;border:1px solid ${zone.tcolor};color:${zone.tcolor}">${zone.tier}</span>
      <div style="display:flex;gap:2px">${Array.from({length:5},(_,i)=>`<div style="width:7px;height:7px;background:${i<zone.danger?'#ff4444':'#1a2530'}"></div>`).join("")}</div>
    </div>
    <div style="font-size:9px;color:#8aa0b0;margin-bottom:6px;line-height:1.6;max-width:220px">${zone.desc.substring(0,110)}…</div>
    <div style="font-size:8px;color:#4a6070">Click to pin full details</div>`;
  tt.style.display = "block";
  moveTT(e);
}

function showMapPinTT(e, label, tip, hot) {
  const col = hot ? "#ff4444" : "#ffd600";
  const tt  = document.getElementById("tt");
  tt.innerHTML = `
    <div style="font-size:10.5px;color:${col};margin-bottom:5px">${decodeURIComponent(label)}</div>
    <div style="font-size:9px;color:#8aa0b0;line-height:1.5">${decodeURIComponent(tip)}</div>`;
  tt.style.display = "block";
  moveTT(e);
}

let runLog = JSON.parse(localStorage.getItem("mara_runs") || "[]");
let showRunForm = false;

function saveRuns(){ try{localStorage.setItem("mara_runs", JSON.stringify(runLog));}catch(e){} }

function renderRuns(){
  const el = document.getElementById("runsv");
  
  // Stats summary
  const total = runLog.length;
  const wins = runLog.filter(r=>r.outcome==="extract").length;
  const totalCreds = runLog.reduce((s,r)=>s+(r.credits||0),0);
  const totalKills = runLog.reduce((s,r)=>s+(r.kills||0),0);
  const wrate = total>0?Math.round(wins/total*100):0;
  
  // Best run
  const best = runLog.reduce((b,r)=>(!b||r.credits>b.credits)?r:b, null);
  
  el.innerHTML = `
    <div style="padding:16px 20px;border-bottom:1px solid #1a2530;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#070d12;z-index:10;flex-wrap:wrap">
      <div class="page-hdr" style="margin:0">📊 RUN TRACKER</div>
      <button onclick="showRunForm=!showRunForm;renderRuns()" style="margin-left:auto;padding:5px 14px;border:1px solid #39ff14;color:#39ff14;background:transparent;cursor:pointer;font-family:inherit;font-size:10px">+ LOG RUN</button>
      ${runLog.length>0?`<button onclick="if(confirm('Clear all run history?')){runLog=[];saveRuns();renderRuns();}" style="padding:5px 10px;border:1px solid #ff006e;color:#ff006e;background:transparent;cursor:pointer;font-family:inherit;font-size:9px">✕ CLEAR</button>`:""}
    </div>
    <div style="padding:16px 20px">
    
    ${showRunForm ? renderRunForm() : ""}
    
    <!-- Stats row -->
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px">
      ${[
        ["RUNS",total,"#00e5ff"],
        ["EXTRACTS",wins,"#39ff14"],
        ["WIN RATE",wrate+"%","#ffd600"],
        ["TOTAL ₵",totalCreds.toLocaleString(),"#ffd600"],
        ["TOTAL KILLS",totalKills,"#ff4444"],
        ["BEST RUN",best?"₵"+(best.credits||0).toLocaleString():"—","#bf5af2"]
      ].map(([l,v,c])=>`
        <div class="card" style="text-align:center;border-top:3px solid ${c}">
          <div style="font-size:22px;font-weight:700;font-family:'Orbitron',monospace;color:${c}">${v}</div>
          <div style="font-size:8px;color:#4a6070;letter-spacing:1px;margin-top:3px">${l}</div>
        </div>`).join("")}
    </div>
    
    <!-- Run history -->
    ${runLog.length===0?`<div style="text-align:center;padding:40px;color:#4a6070;font-size:11px;letter-spacing:2px">NO RUNS LOGGED YET<br><span style="font-size:9px;margin-top:8px;display:block">Click + LOG RUN after each raid</span></div>`:`
    <div>
      <div style="font-family:'Orbitron',monospace;font-size:10px;color:#4a6070;letter-spacing:2px;margin-bottom:10px">RUN HISTORY (${runLog.length})</div>
      ${[...runLog].reverse().map((r,i)=>{
        const ri = runLog.length - 1 - i;
        const oc = {extract:"#39ff14",died:"#ff4444",quit:"#ffd600"}[r.outcome]||"#4a6070";
        const ol = {extract:"EXTRACTED","died":"DIED","quit":"QUIT"}[r.outcome]||r.outcome;
        return`<div class="run-row">
          <div style="font-size:16px">${{extract:"✅",died:"💀",quit:"🏃"}[r.outcome]||"?"}</div>
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
              <span style="font-size:9px;font-family:'Orbitron',monospace;color:${oc}">${ol}</span>
              <span style="font-size:8px;color:#4a6070">${r.map||"Unknown Map"}</span>
              <span style="font-size:8px;color:#4a6070">${r.runner||""}</span>
              <span style="font-size:8px;color:#4a6070;margin-left:auto">${r.date||""}</span>
            </div>
            <div style="display:flex;gap:14px;font-size:9px;flex-wrap:wrap">
              ${r.credits?`<span style="color:#ffd600">₵${r.credits.toLocaleString()}</span>`:""}
              ${r.kills!=null?`<span style="color:#ff4444">⚔ ${r.kills} kills</span>`:""}
              ${r.loot?`<span style="color:#bf5af2">◈ ${r.loot}</span>`:""}
            </div>
            ${r.notes?`<div style="font-size:8.5px;color:#4a6070;margin-top:3px;font-style:italic">"${r.notes}"</div>`:""}
          </div>
          <button onclick="runLog.splice(${ri},1);saveRuns();renderRuns()" style="font-size:8px;padding:2px 6px;border:1px solid #ff006e;color:#ff006e;background:transparent;cursor:pointer;font-family:inherit">✕</button>
        </div>`;
      }).join("")}
    </div>`}
    </div>`;
}

    <div class="card-hdr" style="color:#39ff14">+ LOG A NEW RUN</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px">
      <div>

        </select>
      </div>
      <div>
        <div style="font-size:8px;color:#4a6070;margin-bottom:4px">CREDITS EARNED</div>
        <input id="rf-credits" type="number" placeholder="0" style="width:100%;background:#070d12;border:1px solid #1a2530;color:#ffd600;padding:5px;font-family:inherit;font-size:10px">

      <div>
        <div style="font-size:8px;color:#4a6070;margin-bottom:4px">KILLS</div>
        <input id="rf-kills" type="number" placeholder="0" min="0" style="width:100%;background:#070d12;border:1px solid #1a2530;color:#ff4444;padding:5px;font-family:inherit;font-size:10px">
      </div>
      <div>
        <div style="font-size:8px;color:#4a6070;margin-bottom:4px">ITEMS EXTRACTED</div>
        <input id="rf-loot" placeholder="e.g. Refined Wire x5" style="width:100%;background:#070d12;border:1px solid #1a2530;color:#c8d8e8;padding:5px;font-family:inherit;font-size:10px">
      </div>
    </div>
    <div style="margin-bottom:10px">
      <div style="font-size:8px;color:#4a6070;margin-bottom:4px">NOTES (optional)</div>
      <input id="rf-notes" placeholder="What happened? Ambushed at station, found Prestige AR..." style="width:100%;background:#070d12;border:1px solid #1a2530;color:#c8d8e8;padding:5px;font-family:inherit;font-size:10px">
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="submitRun()" style="padding:7px 18px;border:1px solid #39ff14;color:#39ff14;background:transparent;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:1px">SAVE RUN</button>
      <button onclick="showRunForm=false;renderRuns()" style="padding:7px 14px;border:1px solid #1a2530;color:#4a6070;background:transparent;cursor:pointer;font-family:inherit;font-size:10px">CANCEL</button>
    </div>
  </div>`;
}

function submitRun(){
  const run = {
    outcome: document.getElementById("rf-outcome").value,
    map: document.getElementById("rf-map").value,
    runner: document.getElementById("rf-runner").value,
    credits: parseInt(document.getElementById("rf-credits").value)||0,
    kills: parseInt(document.getElementById("rf-kills").value)||0,
    loot: document.getElementById("rf-loot").value,
    notes: document.getElementById("rf-notes").value,
    date: new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short"})
  };
  runLog.push(run);
  saveRuns();
  showRunForm = false;
  renderRuns();
}

function saveCurrentLoadout(){
  if(!editingLoadout)return;
  if(editingLoadout.id!==undefined){
    savedLoadouts[editingLoadout.id] = {...editingLoadout};
    delete savedLoadouts[editingLoadout.id].id;
  } else {
    savedLoadouts.push({...editingLoadout});
  }
  saveLoadouts();
  editingLoadout = null;
  renderLoadout();
}

const AMMO_DATA = {
  "Light Rounds":   {color:"#c8d8e8", perStack:60, stackSize:"60 rounds",source:"Common — all containers"},
  "Heavy Rounds":   {color:"#ffd600", perStack:30, stackSize:"30 rounds",source:"Munitions Crates, Arms Locker"},

};

const RUN_DURATION_OPTS = [
  {label:"Short (10 min)",factor:0.8},
  {label:"Standard (20 min)",factor:1},
  {label:"Long (35 min)",factor:1.8},
  {label:"Full Loot (50 min+)",factor:2.5},
];

let ammoWeapon1 = "", ammoWeapon2 = "", ammoDuration = 1, ammoStyle = "balanced";

function renderAmmo(){
  const el = document.getElementById("ammov");
  const WD = WEAPONS_DATA||[];
  
  el.innerHTML = `

      <div>
        <div class="card" style="margin-bottom:12px">
          <div class="card-hdr" style="color:#ffd600">⚙️ LOADOUT</div>

              <option value="">-- Select Primary --</option>
              ${WD.map(w=>`<option value="${w.id}" ${ammoWeapon1===w.id?"selected":""}>${w.name} (${w.ammo})</option>`).join("")}
            </select>
          </div>
          <div style="margin-bottom:10px">
            <div style="font-size:8px;color:#4a6070;margin-bottom:4px">SECONDARY WEAPON</div>
            <select onchange="ammoWeapon2=this.value;renderAmmo()" style="width:100%;background:#070d12;border:1px solid #1a2530;color:#c8d8e8;padding:5px;font-family:inherit;font-size:10px">
              <option value="">-- Select Secondary --</option>
              ${WD.map(w=>`<option value="${w.id}" ${ammoWeapon2===w.id?"selected":""}>${w.name} (${w.ammo})</option>`).join("")}

              <div style="font-size:8.5px;color:#4a6070">${d.source}</div>
            </div>`).join("")}
        </div>
        <div class="card" style="border-left:3px solid #ffd600">
          <div class="card-hdr" style="color:#ffd600">💡 AMMO TIPS</div>

            • Shells have great firepower per stack — bring 2 minimum<br>

          </div>

      </div>

function renderAmmoResults(){
  const WD = WEAPONS_DATA||[];
  const w1 = WD.find(w=>w.id===ammoWeapon1);
  const w2 = WD.find(w=>w.id===ammoWeapon2);
  if(!w1&&!w2) return `<div class="card" style="color:#4a6070;font-size:10px;text-align:center;padding:20px">Select weapons above to calculate ammo</div>`;
  
  const factor = RUN_DURATION_OPTS[ammoDuration].factor;
  const styleMult = {balanced:1, aggressive:1.8, stealth:0.6}[ammoStyle]||1;
  
  const results = {};
  [w1,w2].filter(Boolean).forEach(w=>{
    const base = Math.ceil(w.mag * (w.rof/60) * 4 * factor * styleMult / (AMMO_DATA[w.ammo]?.perStack||30));
    results[w.ammo] = (results[w.ammo]||0) + base;
  });
  
  return `<div class="card" style="border-color:#39ff14;border-left:3px solid #39ff14">
    <div class="card-hdr" style="color:#39ff14">📊 RECOMMENDED LOADOUT</div>
    ${Object.entries(results).map(([ammo,stacks])=>{
      const ad = AMMO_DATA[ammo];
      const capped = Math.min(stacks, 4);
      return`<div class="ammo-result">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="color:${ad?.color||"#c8d8e8"};font-size:10px;font-weight:700">${ammo}</span>
          <span style="font-size:20px;font-weight:700;color:${ad?.color||"#c8d8e8"};font-family:'Orbitron',monospace">${capped}x</span>
        </div>
        <div style="font-size:8.5px;color:#4a6070">≈ ${capped*(ad?.perStack||30)} rounds · ${ad?.stackSize||""}/stack</div>
        ${stacks>4?`<div style="font-size:8px;color:#ff6d00;margin-top:3px">⚠ Calc suggests ${stacks} stacks — capped at 4 for space</div>`:""}
      </div>`;
    }).join("")}
    <div style="font-size:9px;color:#4a6070;margin-top:8px;padding-top:8px;border-top:1px solid #1a2530">
      Based on: ${RUN_DURATION_OPTS[ammoDuration].label} · ${ammoStyle} playstyle
    </div>
  </div>`;
}

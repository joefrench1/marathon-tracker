function _renderOverview(players, myName) {
  if (!players.length) return `<div style="color:#4a6070;text-align:center;padding:60px;font-size:16px">
    Waiting for players to join…<br>
    <span style="font-size:15px;margin-top:10px;display:block">Share the invite link to bring your squad in</span>
  </div>`;

  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding:18px 20px">
    ${players.map(p=>_playerMiniCard(p, p.player_name===myName)).join("")}
  </div>`;
}

function _renderSideBySide(players, myName) {
  if (players.length < 2) return `<div style="color:#4a6070;text-align:center;padding:60px;font-size:15px">
    Need at least 2 players in session to compare builds side by side.
  </div>`;

  // Show all players' faction progress side by side
  const factionKeys = Object.keys(FC);

  return `
    <div style="padding:16px 20px">
      <div style="font-size:15px;color:#4a6070;margin-bottom:14px;letter-spacing:1px">
        COMPARING ${players.length} BUILDS · Faction completion bars shown side by side
      </div>

      <!-- Player summary row -->
      <div style="display:grid;grid-template-columns:130px repeat(${players.length}, 1fr);gap:0;margin-bottom:16px;border:1px solid #1a2530">
        <div style="padding:11px 13px;background:#0a1218;border-right:1px solid #1a2530;font-size:16px;color:#4a6070;display:flex;align-items:center">PLAYER</div>
        ${players.map(p=>{
          const isMe = p.player_name===myName;
          const fd   = p.faction_data||{};
          const pLV  = fd.LV||{};
          const owned = UG.filter(u=>(pLV[u.id]||0)>0);
          const totalC = owned.reduce((s,u)=>{let c=0;for(let i=0;i<pLV[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
          const ago    = Math.round((Date.now()-new Date(p.updated_at).getTime())/1000);
          const live   = ago < 8;
          return `<div style="padding:11px 13px;background:${isMe?'rgba(0,229,255,.04)':'#0d1318'};border-right:1px solid #1a2530;border-left:${isMe?'2px solid #00e5ff':'none'}">
            <div style="font-family:'Orbitron',monospace;font-size:15px;color:${isMe?'#00e5ff':'#c8d8e8'};margin-bottom:5px;display:flex;align-items:center;gap:6px">
              <div style="width:6px;height:6px;border-radius:50%;background:${live?'#39ff14':'#4a6070'};flex-shrink:0"></div>
              ${p.player_name}
            </div>
            <div style="font-size:15px;color:#ffd600">₵${totalC.toLocaleString()}</div>
            <div style="font-size:16px;color:#39ff14">${owned.length} upgrades</div>
          </div>`;
        }).join("")}
      </div>

      <!-- Faction comparison rows -->
      ${factionKeys.map(f=>{
        const fc = FC[f];
        const tot = UG.filter(u=>u.f===f).reduce((s,u)=>s+u.levels.length,0);
        if (!tot) return "";

        // Check if any player has this faction
        const anyHas = players.some(p=>{
          const pLV = (p.faction_data||{}).LV||{};
          return UG.filter(u=>u.f===f).some(u=>(pLV[u.id]||0)>0);
        });

        return `<div style="border:1px solid #1a2530;margin-bottom:8px">
          <div style="display:grid;grid-template-columns:130px repeat(${players.length}, 1fr);gap:0">
            <div style="padding:10px 13px;background:#0a1218;border-right:1px solid #1a2530;border-left:3px solid ${fc.color};display:flex;align-items:center">
              <div style="font-family:'Orbitron',monospace;font-size:16px;color:${fc.color};letter-spacing:1px">${f}</div>
            </div>
            ${players.map((p,pi)=>{
              const fd   = p.faction_data||{};
              const pLV  = fd.LV||{};
              const pPL  = fd.PL||{};
              const fa   = UG.filter(u=>u.f===f&&(pLV[u.id]||0)>0);
              const fp   = UG.filter(u=>u.f===f&&(pPL[u.id]||0)>0&&!(pLV[u.id]||0));
              const lvs  = fa.reduce((s,u)=>s+(pLV[u.id]||0),0);
              const pct  = Math.round(lvs/tot*100);
              const isMe = p.player_name===myName;
              return `<div style="padding:10px 13px;border-right:1px solid #1a2530;background:${isMe?'rgba(0,229,255,.02)':'transparent'}">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
                  <div style="flex:1;height:5px;background:#1a2530;border-radius:3px">
                    <div style="height:100%;width:${pct}%;background:${fc.color};border-radius:3px;transition:width .4s"></div>
                  </div>
                  <div style="font-size:16px;color:${pct>0?fc.color:'#2a3a48'};width:32px;text-align:right;font-weight:700">${pct}%</div>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:3px">
                  ${fa.map(u=>`<span style="font-size:16px;padding:1px 6px;border:1px solid ${fc.color}22;color:${fc.color};background:${fc.color}11">${u.name}</span>`).join("")}
                  ${fp.map(u=>`<span style="font-size:16px;padding:1px 6px;border:1px solid #bf5af222;color:#bf5af2;background:#bf5af211">${u.name} ◈</span>`).join("")}
                  ${!fa.length&&!fp.length?`<span style="font-size:16px;color:#2a3a48">—</span>`:""}
                </div>
              </div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>`;
}

function _playerMiniCard(p, isMe) {
  const fd   = p.faction_data || {};
  const pLV  = fd.LV || {};
  const pPL  = fd.PL || {};
  const owned   = UG.filter(u=>(pLV[u.id]||0)>0);
  const planned = UG.filter(u=>(pPL[u.id]||0)>0&&!(pLV[u.id]||0));
  const totalC  = owned.reduce((s,u)=>{ let c=0; for(let i=0;i<pLV[u.id];i++) c+=u.levels[i].credits; return s+c; },0);
  const ago     = Math.round((Date.now()-new Date(p.updated_at).getTime())/1000);
  const live    = ago < 8;

  const fBars = Object.keys(FC).map(f=>{
    const fa = owned.filter(u=>u.f===f);
    if (!fa.length) return "";
    const tot = UG.filter(u=>u.f===f).reduce((s,u)=>s+u.levels.length,0);
    const lvs = fa.reduce((s,u)=>s+(pLV[u.id]||0),0);
    const pct = Math.round(lvs/tot*100);
    return `<div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
      <div style="font-size:16px;color:${FC[f].color};width:68px;flex-shrink:0;font-family:'Orbitron',monospace;overflow:hidden;white-space:nowrap">${f.substring(0,8)}</div>
      <div style="flex:1;height:4px;background:#1a2530;border-radius:2px">
        <div style="height:100%;width:${pct}%;background:${FC[f].color};border-radius:2px"></div>
      </div>
      <div style="font-size:16px;color:#4a6070;width:28px;text-align:right">${pct}%</div>
    </div>`;
  }).filter(Boolean).join("");

  return `<div onclick="squadViewTab='${p.player_name}';renderSquadPage()"
    style="background:#0d1318;border:1px solid ${isMe?'#00e5ff':'#1a2530'};border-top:3px solid ${isMe?'#00e5ff':'#2a3a48'};padding:16px;cursor:pointer;transition:all .2s"
    onmouseenter="this.style.transform='translateY(-2px)';this.style.boxShadow='0 4px 16px rgba(0,0,0,.5)'"
    onmouseleave="this.style.transform='';this.style.boxShadow=''">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
      <div style="width:8px;height:8px;border-radius:50%;background:${live?'#39ff14':'#4a6070'};flex-shrink:0;box-shadow:${live?'0 0 6px #39ff14':'none'}"></div>
      <div style="font-family:'Orbitron',monospace;font-size:15px;color:${isMe?'#00e5ff':'#c8d8e8'};flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.player_name}</div>
      ${isMe?'<span style="font-size:16px;padding:1px 6px;border:1px solid #00e5ff;color:#00e5ff">YOU</span>':''}
    </div>
    <div style="display:flex;gap:14px;margin-bottom:11px;font-size:15px">
      <span style="color:#ffd600">₵${totalC.toLocaleString()}</span>
      <span style="color:#39ff14">${owned.length} owned</span>
      ${planned.length?`<span style="color:#bf5af2">${planned.length} planned</span>`:""}
      <span style="color:#4a6070;margin-left:auto">${ago<60?ago+"s":Math.floor(ago/60)+"m"} ago</span>
    </div>
    ${fBars}
    <div style="margin-top:11px;font-size:16px;color:#4a6070;letter-spacing:1px;text-align:center;border-top:1px solid #1a2530;padding-top:8px">CLICK FOR FULL BUILD →</div>
  </div>`;
}

function _renderPlayerDetail(playerName, myName) {
  const p = squadPlayers[playerName];
  if (!p) return `<div style="color:#4a6070;padding:40px;text-align:center">Player not found</div>`;
  const fd   = p.faction_data || {};
  const pLV  = fd.LV || {};
  const pPL  = fd.PL || {};
  const owned   = UG.filter(u=>(pLV[u.id]||0)>0);
  const planned = UG.filter(u=>(pPL[u.id]||0)>0&&!(pLV[u.id]||0));
  const totalC  = owned.reduce((s,u)=>{ let c=0; for(let i=0;i<pLV[u.id];i++) c+=u.levels[i].credits; return s+c; },0);
  const isMe    = playerName===myName;
  const ago     = Math.round((Date.now()-new Date(p.updated_at).getTime())/1000);
  const live    = ago < 8;

  return `
    <div style="padding:18px 20px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid #1a2530">
        <div style="display:flex;align-items:center;gap:9px">
          <div style="width:10px;height:10px;border-radius:50%;background:${live?'#39ff14':'#4a6070'};box-shadow:${live?'0 0 6px #39ff14':'none'}"></div>
          <div style="font-family:'Orbitron',monospace;font-size:18px;color:${isMe?'#00e5ff':'#c8d8e8'}">${playerName}</div>
          ${isMe?'<span style="font-size:16px;padding:2px 7px;border:1px solid #00e5ff;color:#00e5ff">YOU</span>':''}
        </div>
        <div style="display:flex;gap:18px;margin-left:auto;flex-wrap:wrap">
          <div style="text-align:center"><div style="font-size:18px;font-weight:700;color:#ffd600">₵${totalC.toLocaleString()}</div><div style="font-size:16px;color:#4a6070">INVESTED</div></div>
          <div style="text-align:center"><div style="font-size:18px;font-weight:700;color:#39ff14">${owned.length}</div><div style="font-size:16px;color:#4a6070">OWNED</div></div>
          ${planned.length?`<div style="text-align:center"><div style="font-size:18px;font-weight:700;color:#bf5af2">${planned.length}</div><div style="font-size:16px;color:#4a6070">PLANNED</div></div>`:''}
          <div style="text-align:center"><div style="font-size:15px;color:#4a6070">${ago<60?ago+"s":Math.floor(ago/60)+"m"} ago</div><div style="font-size:16px;color:#4a6070">UPDATED</div></div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px">
        ${Object.keys(FC).map(f=>{
          const fa = owned.filter(u=>u.f===f);
          const fp = planned.filter(u=>u.f===f);
          if (!fa.length&&!fp.length) return "";
          const fc  = FC[f];
          const tot = UG.filter(u=>u.f===f).reduce((s,u)=>s+u.levels.length,0);
          const lvs = fa.reduce((s,u)=>s+(pLV[u.id]||0),0);
          const pct = Math.round(lvs/tot*100);
          return `<div style="background:#0d1318;border:1px solid #1a2530;border-left:3px solid ${fc.color};padding:13px 15px">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
              <div style="font-family:'Orbitron',monospace;font-size:15px;color:${fc.color};letter-spacing:2px">${f}</div>
              <div style="flex:1;height:4px;background:#1a2530;border-radius:2px">
                <div style="height:100%;width:${pct}%;background:${fc.color};border-radius:2px"></div>
              </div>
              <div style="font-size:16px;color:#4a6070;font-weight:700">${pct}%</div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:5px">
              ${fa.map(u=>`<span style="font-size:16px;padding:3px 9px;border:1px solid ${fc.color};color:${fc.color};background:${fc.color}11">${u.name}${pLV[u.id]>1?` Lv${pLV[u.id]}`:""}</span>`).join("")}
              ${fp.map(u=>`<span style="font-size:16px;padding:3px 9px;border:1px solid #bf5af2;color:#bf5af2;background:#bf5af211">${u.name}${pPL[u.id]>1?` Lv${pPL[u.id]}`:""} ◈</span>`).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>
      ${!owned.length&&!planned.length?`<div style="color:#4a6070;font-size:15px;padding:30px;text-align:center">No upgrades selected yet</div>`:""}
    </div>`;
}

}

      onmouseleave="this.style.background='';this.style.borderLeftColor='transparent'">

        <div style="width:8px;height:8px;border-radius:2px;background:${z.tcolor};flex-shrink:0"></div>
        <div style="font-family:'Orbitron',monospace;font-size:15px;color:${z.color};flex:1">${z.label}</div>

      <div style="font-size:16px;color:#5a7080;margin-left:16px">${z.loot.slice(0,2).join(' · ')}</div>

}

  const z = map.zones.find(x=>x.id===selectedZone);

  return `
    <div style="padding:14px 15px;border-bottom:2px solid ${z.color}">
      <button onclick="selectedZone=null;renderMap()"
        style="font-size:16px;color:#4a6070;background:transparent;border:none;cursor:pointer;font-family:inherit;margin-bottom:10px;padding:0;letter-spacing:1px">
        ← ALL ZONES
      </button>
      <div style="font-family:'Orbitron',monospace;font-size:16px;color:${z.color};margin-bottom:4px">${z.label}</div>

        <span style="font-size:16px;padding:2px 8px;border:1px solid ${z.tcolor};color:${z.tcolor}">${z.tier}</span>

          <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1a2530;font-size:15px">
            <div style="width:4px;height:4px;border-radius:50%;background:${z.color};flex-shrink:0"></div>
            <span>${l}</span>
          </div>`).join("")}
      </div>
      <div style="background:rgba(57,255,20,.06);border-left:3px solid #39ff14;padding:10px 12px">
        <div style="font-size:16px;color:#39ff14;margin-bottom:4px;letter-spacing:1px">💡 TACTICAL TIP</div>

function showMapZoneTT(e, mapId, zoneId) {
  const map  = MAPS[mapId];
  const zone = map && map.zones.find(z=>z.id===zoneId);
  if (!zone) return;
  const tt = document.getElementById("tt");
  tt.innerHTML = `
    <div class="tt-name" style="color:${zone.color}">${zone.label}</div>
    <div style="font-size:16px;color:${zone.tcolor};margin-bottom:6px">${zone.tier} · Danger ${zone.danger}/5</div>
    <div style="font-size:15px;color:#8aa0b0;line-height:1.7;margin-bottom:8px">${zone.desc.substring(0,120)}...</div>
    <div style="font-size:16px;color:#4a6070">Click to pin full details →</div>`;
  tt.style.display = "block"; moveTT(e);
}

let runLog = JSON.parse(localStorage.getItem("mara_runs") || "[]");
let showRunForm = false;

function saveRuns(){ try{localStorage.setItem("mara_runs", JSON.stringify(runLog));}catch(e){} }

function renderRuns(){
  const el = document.getElementById("runsv");
  
  // Stats summary
  const total = runLog.length;
  const wins = runLog.filter(r=>r.outcome==="extract").length;
  const totalCreds = runLog.reduce((s,r)=>s+(r.credits||0),0);
  const totalKills = runLog.reduce((s,r)=>s+(r.kills||0),0);
  const wrate = total>0?Math.round(wins/total*100):0;
  
  // Best run
  const best = runLog.reduce((b,r)=>(!b||r.credits>b.credits)?r:b, null);
  
  el.innerHTML = `
    <div style="padding:16px 20px;border-bottom:1px solid #1a2530;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#070d12;z-index:10;flex-wrap:wrap">
      <div class="page-hdr" style="margin:0">📊 RUN TRACKER</div>
      <button onclick="showRunForm=!showRunForm;renderRuns()" style="margin-left:auto;padding:5px 14px;border:1px solid #39ff14;color:#39ff14;background:transparent;cursor:pointer;font-family:inherit;font-size:16px">+ LOG RUN</button>
      ${runLog.length>0?`<button onclick="if(confirm('Clear all run history?')){runLog=[];saveRuns();renderRuns();}" style="padding:5px 10px;border:1px solid #ff006e;color:#ff006e;background:transparent;cursor:pointer;font-family:inherit;font-size:16px">✕ CLEAR</button>`:""}
    </div>
    <div style="padding:16px 20px">
    
    ${showRunForm ? renderRunForm() : ""}
    
    <!-- Stats row -->
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px">
      ${[
        ["RUNS",total,"#00e5ff"],
        ["EXTRACTS",wins,"#39ff14"],
        ["WIN RATE",wrate+"%","#ffd600"],
        ["TOTAL ₵",totalCreds.toLocaleString(),"#ffd600"],
        ["TOTAL KILLS",totalKills,"#ff4444"],
        ["BEST RUN",best?"₵"+(best.credits||0).toLocaleString():"—","#bf5af2"]
      ].map(([l,v,c])=>`
        <div class="card" style="text-align:center;border-top:3px solid ${c}">
          <div style="font-size:22px;font-weight:700;font-family:'Orbitron',monospace;color:${c}">${v}</div>
          <div style="font-size:15px;color:#4a6070;letter-spacing:1px;margin-top:3px">${l}</div>
        </div>`).join("")}
    </div>
    
    <!-- Run history -->
    ${runLog.length===0?`<div style="text-align:center;padding:40px;color:#4a6070;font-size:15px;letter-spacing:2px">NO RUNS LOGGED YET<br><span style="font-size:16px;margin-top:8px;display:block">Click + LOG RUN after each raid</span></div>`:`
    <div>
      <div style="font-family:'Orbitron',monospace;font-size:16px;color:#4a6070;letter-spacing:2px;margin-bottom:10px">RUN HISTORY (${runLog.length})</div>
      ${[...runLog].reverse().map((r,i)=>{
        const ri = runLog.length - 1 - i;
        const oc = {extract:"#39ff14",died:"#ff4444",quit:"#ffd600"}[r.outcome]||"#4a6070";
        const ol = {extract:"EXTRACTED","died":"DIED","quit":"QUIT"}[r.outcome]||r.outcome;
        return`<div class="run-row">
          <div style="font-size:16px">${{extract:"✅",died:"💀",quit:"🏃"}[r.outcome]||"?"}</div>
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
              <span style="font-size:16px;font-family:'Orbitron',monospace;color:${oc}">${ol}</span>
              <span style="font-size:15px;color:#4a6070">${r.map||"Unknown Map"}</span>
              <span style="font-size:15px;color:#4a6070">${r.runner||""}</span>
              <span style="font-size:15px;color:#4a6070;margin-left:auto">${r.date||""}</span>
            </div>
            <div style="display:flex;gap:14px;font-size:16px;flex-wrap:wrap">
              ${r.credits?`<span style="color:#ffd600">₵${r.credits.toLocaleString()}</span>`:""}
              ${r.kills!=null?`<span style="color:#ff4444">⚔ ${r.kills} kills</span>`:""}
              ${r.loot?`<span style="color:#bf5af2">◈ ${r.loot}</span>`:""}
            </div>
            ${r.notes?`<div style="font-size:8.5px;color:#4a6070;margin-top:3px;font-style:italic">"${r.notes}"</div>`:""}
          </div>
          <button onclick="runLog.splice(${ri},1);saveRuns();renderRuns()" style="font-size:15px;padding:2px 6px;border:1px solid #ff006e;color:#ff006e;background:transparent;cursor:pointer;font-family:inherit">✕</button>
        </div>`;
      }).join("")}
    </div>`}
    </div>`;
}

function submitRun(){
  const run = {
    outcome: document.getElementById("rf-outcome").value,
    map: document.getElementById("rf-map").value,
    runner: document.getElementById("rf-runner").value,
    credits: parseInt(document.getElementById("rf-credits").value)||0,
    kills: parseInt(document.getElementById("rf-kills").value)||0,
    loot: document.getElementById("rf-loot").value,
    notes: document.getElementById("rf-notes").value,
    date: new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short"})
  };
  runLog.push(run);
  saveRuns();
  showRunForm = false;
  renderRuns();
}

function saveCurrentLoadout(){
  if(!editingLoadout)return;
  if(editingLoadout.id!==undefined){
    savedLoadouts[editingLoadout.id] = {...editingLoadout};
    delete savedLoadouts[editingLoadout.id].id;
  } else {
    savedLoadouts.push({...editingLoadout});
  }
  saveLoadouts();
  editingLoadout = null;
  renderLoadout();
}

  const totalAll = allContracts.length;
  
  el.innerHTML = `
    <div style="padding:16px 20px;border-bottom:1px solid #1a2530;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#070d12;z-index:10;flex-wrap:wrap">

const AMMO_DATA = {
  "Light Rounds":   {color:"#c8d8e8", perStack:60, stackSize:"60 rounds",source:"Common — all containers"},
  "Heavy Rounds":   {color:"#ffd600", perStack:30, stackSize:"30 rounds",source:"Munitions Crates, Arms Locker"},

const RUN_DURATION_OPTS = [
  {label:"Short (10 min)",factor:0.8},
  {label:"Standard (20 min)",factor:1},
  {label:"Long (35 min)",factor:1.8},
  {label:"Full Loot (50 min+)",factor:2.5},

let ammoWeapon1 = "", ammoWeapon2 = "", ammoDuration = 1, ammoStyle = "balanced";

function renderAmmo(){
  const el = document.getElementById("ammov");
  const WD = WEAPONS_DATA||[];

            </div>`).join("")}

        <div class="card" style="border-left:3px solid #ffd600">
          <div class="card-hdr" style="color:#ffd600">💡 AMMO TIPS</div>

            • Shells have great firepower per stack — bring 2 minimum<br>

          </div>

function renderAmmoResults(){
  const WD = WEAPONS_DATA||[];
  const w1 = WD.find(w=>w.id===ammoWeapon1);
  const w2 = WD.find(w=>w.id===ammoWeapon2);
  if(!w1&&!w2) return `<div class="card" style="color:#4a6070;font-size:16px;text-align:center;padding:20px">Select weapons above to calculate ammo</div>`;
  
  const factor = RUN_DURATION_OPTS[ammoDuration].factor;
  const styleMult = {balanced:1, aggressive:1.8, stealth:0.6}[ammoStyle]||1;
  
  const results = {};
  [w1,w2].filter(Boolean).forEach(w=>{
    const base = Math.ceil(w.mag * (w.rof/60) * 4 * factor * styleMult / (AMMO_DATA[w.ammo]?.perStack||30));
    results[w.ammo] = (results[w.ammo]||0) + base;
  });
  
  return `<div class="card" style="border-color:#39ff14;border-left:3px solid #39ff14">
    <div class="card-hdr" style="color:#39ff14">📊 RECOMMENDED LOADOUT</div>
    ${Object.entries(results).map(([ammo,stacks])=>{
      const ad = AMMO_DATA[ammo];
      const capped = Math.min(stacks, 4);
      return`<div class="ammo-result">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="color:${ad?.color||"#c8d8e8"};font-size:16px;font-weight:700">${ammo}</span>
          <span style="font-size:20px;font-weight:700;color:${ad?.color||"#c8d8e8"};font-family:'Orbitron',monospace">${capped}x</span>
        </div>
        <div style="font-size:8.5px;color:#4a6070">≈ ${capped*(ad?.perStack||30)} rounds · ${ad?.stackSize||""}/stack</div>
        ${stacks>4?`<div style="font-size:15px;color:#ff6d00;margin-top:3px">⚠ Calc suggests ${stacks} stacks — capped at 4 for space</div>`:""}
      </div>`;
    }).join("")}
    <div style="font-size:16px;color:#4a6070;margin-top:8px;padding-top:8px;border-top:1px solid #1a2530">
      Based on: ${RUN_DURATION_OPTS[ammoDuration].label} · ${ammoStyle} playstyle
    </div>
  </div>`;
}

// PROGRESS TAB — Salvage + Build + Contracts
// ══════════════════════════════════════════

let progressTab = "salvage"; // "salvage" | "build" | "contracts"

function renderProgressTab() {
  const el = document.getElementById("view-progress");
  if (!el) return;

  const salv        = getSalvMap();
  const salvPlan    = getSalvMapPlanned();
  const actives     = getActives();
  const planned     = getPlanned();
  const salvCount   = salv.length + salvPlan.length;
  const buildCount  = actives.length + planned.length;

  // Load contracts count from localStorage for badge
  let contracts = [];
  try { contracts = JSON.parse(localStorage.getItem("mara_contracts")||"[]"); } catch(e){}
  const doneContracts = contracts.filter(c=>c.done).length;

  el.innerHTML = `
    <div class="prog-tabs" id="progress-tab-bar">
      <button class="prog-tab ${progressTab==="salvage"?"on":""}" onclick="switchProgressTab('salvage')">
        ◈ MATERIALS ${salvCount?"<span style='color:var(--orange);margin-left:4px'>"+salvCount+"</span>":""}
      </button>
      <button class="prog-tab ${progressTab==="build"?"on":""}" onclick="switchProgressTab('build')">
        📋 BUILD ${buildCount?"<span style='color:var(--cyan);margin-left:4px'>"+(actives.length+planned.length)+"</span>":""}
      </button>
      <button class="prog-tab ${progressTab==="contracts"?"on":""}" onclick="switchProgressTab('contracts')">
        📋 CONTRACTS ${doneContracts?"<span style='color:var(--green);margin-left:4px'>"+doneContracts+"/"+contracts.length+"</span>":""}
      </button>
    </div>
    <div class="prog-inner" id="progress-content"></div>`;

  renderProgressContent();
}

function switchProgressTab(t) {
  progressTab = t;
  document.querySelectorAll(".prog-tab").forEach(b=>{
    const match = b.textContent.trim().startsWith(t==="salvage"?"◈":t==="build"?"📋 BUILD":"📋 CONTRACT");
    b.classList.toggle("on", b.onclick?.toString().includes(`'${t}'`));
  });
  // Re-render just the content portion
  document.querySelectorAll(".prog-tab").forEach(b=>{
    b.classList.remove("on");
    if(b.getAttribute("onclick")?.includes(`'${t}'`)) b.classList.add("on");
  });
  renderProgressContent();
}

function renderProgressContent() {
  const el = document.getElementById("progress-content");
  if (!el) return;

  if (progressTab === "salvage") {
    renderSalvInProgress(el);
  } else if (progressTab === "build") {
    renderBuildInProgress(el);
  } else {
    renderContractsInProgress(el);
  }
}

function renderSalvInProgress(el) {
  const salv     = getSalvMap();
  const salvPlan = getSalvMapPlanned();
  if (!salv.length && !salvPlan.length) {
    el.innerHTML = `<div class="sv-empty">// UNLOCK OR PLAN UPGRADES IN THE TREE FIRST //<br><br>
      <span style="font-size:.8rem;color:var(--text-dead)">Left-click = owned · Right-click = planned</span><br>
      <button class="btn bc" style="margin-top:16px;font-size:.8rem" onclick="showMain('tree')">GO TO UPGRADE TREE →</button></div>`;
    return;
  }

  const makeCards = (items, isPlan) => items.map(([item, qty]) => {
    const loc = SL[item];
    const rc  = loc ? RC[loc.rarity] : "#4a6070";
    const esc = item.replace(/'/g, "\\'");
    return `<div class="sv-card" style="border-left:3px solid ${isPlan?"var(--purple)":rc}"
      onmouseenter="showSalvTT('${esc}',event)" onmouseleave="hideTT()" onmousemove="moveTT(event)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
        <span class="sv-name" style="color:${isPlan?"var(--purple)":rc}">◈ ${item}</span>
        <span style="font-size:.9rem;font-weight:700;color:${isPlan?"var(--purple)":"var(--text)"}">×${qty}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.72rem">
        ${isPlan?`<span style="color:var(--purple);border:1px solid var(--purple);padding:1px 6px">PLANNED</span>`:""}
        ${loc?`<span style="border:1px solid ${rc};color:${rc};padding:1px 6px">${loc.rarity}</span>
               <span style="color:var(--blue)">📍 ${loc.map}</span>
               <span style="color:var(--text-dim)">${loc.pois.join(" · ")}</span>`
             :`<span style="color:var(--orange)">⚠ Location unconfirmed</span>`}
      </div>
    </div>`;
  }).join("");

  let html = "";
  if (salv.length) {
    html += `<div class="sv-hdr">◈ OWNED MATERIALS <span style="color:var(--orange);font-size:.8rem;margin-left:8px">${salv.length} types</span></div>`;
    html += `<div class="sv-grid">${makeCards(salv, false)}</div>`;
  }
  if (salvPlan.length) {
    html += `<div class="sv-hdr" style="margin-top:${salv.length?24:0}px">◈ PLANNED MATERIALS <span style="color:var(--purple);font-size:.8rem;margin-left:8px">${salvPlan.length} types</span></div>`;
    html += `<div class="sv-grid">${makeCards(salvPlan, true)}</div>`;
  }
  el.innerHTML = html;
}

function renderBuildInProgress(el) {
  const actives = getActives();
  const planned = getPlanned();
  if (!actives.length && !planned.length) {
    el.innerHTML = `<div class="bv-empty">No upgrades selected yet.<br><br>
      <button class="btn bc" style="margin-top:16px;font-size:.8rem" onclick="showMain('tree')">GO TO UPGRADE TREE →</button></div>`;
    return;
  }

  // Recommended order for planned
  const orderedPlan = [...planned].sort((a,b)=>{
    const ai = REC.indexOf(a.id), bi = REC.indexOf(b.id);
    return (ai<0?999:ai)-(bi<0?999:bi);
  });

  const makeRow = (u, i, isPlan) => {
    const fc   = FC[u.faction];
    const lvl  = isPlan ? PL[u.id] : LV[u.id];
    const cost = u.levels.slice(0,lvl).reduce((s,l)=>s+l.credits,0);
    return `<div class="bv-row" style="${isPlan?"opacity:.9":""}">
      <span class="bv-num">${i+1}</span>
      <span class="bv-name">${u.name}${lvl>1?`<span style="color:var(--text-dead);font-size:.72rem"> Lv${lvl}</span>`:""}</span>
      <span class="bv-f" style="border-color:${fc.color};color:${fc.color}">${u.faction.slice(0,5).toUpperCase()}</span>
      <span class="bv-c">₵${cost.toLocaleString()}</span>
      ${isPlan?`<span style="color:var(--purple);font-size:.7rem;padding:1px 6px;border:1px solid var(--purple)">PLAN</span>`:""}
    </div>`;
  };

  let html = "";
  if (actives.length) {
    const totalOwned = actives.reduce((s,u)=>{let c=0;for(let i=0;i<LV[u.id];i++)c+=u.levels[i].credits;return s+c;},0);
    html += `<div class="bv-hdr">OWNED UPGRADES <span style="color:var(--yellow);font-size:.82rem">₵${totalOwned.toLocaleString()} total</span></div>`;
    html += actives.map((u,i)=>makeRow(u,i,false)).join("");
  }
  if (orderedPlan.length) {
    const totalPlan = getTotalCredsPlanned();
    html += `<div class="bv-hdr" style="margin-top:${actives.length?24:0}px">PLANNED UPGRADES <span style="color:var(--purple);font-size:.82rem">₵${totalPlan.toLocaleString()} additional</span></div>`;
    html += orderedPlan.map((u,i)=>makeRow(u,i,true)).join("");
  }
  el.innerHTML = html;
}

function renderContractsInProgress(el) {
  // Delegate to the contracts module's render but inject into this container
  let contracts = [];
  try { contracts = JSON.parse(localStorage.getItem("mara_contracts")||"[]"); } catch(e){}

  if (!contracts.length) {
    el.innerHTML = `<div class="bv-empty">No contracts tracked yet.<br><br>
      <span style="font-size:.8rem;color:var(--text-dead)">Add contracts to track faction rep progress.</span></div>`;
    return;
  }

  const byFaction = {};
  contracts.forEach(c=>{ (byFaction[c.faction]||(byFaction[c.faction]=[])).push(c); });

  let html = "";
  for (const [f, cs] of Object.entries(byFaction)) {
    const col   = FC[f]?.color || "#888";
    const done  = cs.filter(c=>c.done).length;
    html += `<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;font-family:'Orbitron',monospace;font-size:.8rem;color:${col}">
        ${f} <span style="color:var(--text-dead);font-size:.7rem;font-family:inherit">${done}/${cs.length}</span>
      </div>`;
    html += cs.map(c=>`
      <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid ${c.done?"var(--green)":"var(--border)"};margin-bottom:5px;font-size:.84rem;cursor:pointer;transition:border-color .15s"
        onclick="toggleContract('${c.id}')">
        <span style="color:${c.done?"var(--green)":"var(--border2)"};font-size:1rem">${c.done?"✓":"○"}</span>
        <span style="flex:1;${c.done?"text-decoration:line-through;color:var(--text-dim)":""}">${c.name}</span>
        <span style="font-size:.72rem;color:var(--text-dead)">${c.rep||""}</span>
      </div>`).join("");
    html += `</div>`;
  }
  el.innerHTML = html;
}

// ═══ tools-hub.js ═══
// ══════════════════════════════════════════
// TOOLS HUB — Run Tracker + Loadout + Ammo
// ══════════════════════════════════════════

let toolsTab = "runs";

function renderToolsHub() {
  const el = document.getElementById("view-tools");
  if (!el) return;

  el.innerHTML = `
    <div class="tools-tabs" id="tools-tab-bar">
      <button class="tools-tab ${toolsTab==="runs"?"on":""}"    onclick="switchToolsTab('runs')">📊 RUN TRACKER</button>
      <button class="tools-tab ${toolsTab==="loadout"?"on":""}" onclick="switchToolsTab('loadout')">🎒 LOADOUT</button>
      <button class="tools-tab ${toolsTab==="ammo"?"on":""}"    onclick="switchToolsTab('ammo')">🔹 AMMO CALC</button>
    </div>
    <div id="tools-content"></div>`;

  renderToolsContent();
}

function switchToolsTab(t) {
  toolsTab = t;
  document.querySelectorAll(".tools-tab").forEach(b=>{
    b.classList.toggle("on", b.getAttribute("onclick")?.includes(`'${t}'`));
  });
  renderToolsContent();
}

function renderToolsContent() {
  const el = document.getElementById("tools-content");
  if (!el) return;
  if (toolsTab === "runs") {
    // Render into #runsv inside tools-content, then call renderRuns
    el.innerHTML = `<div id="runsv" style="padding:22px"></div>`;
    renderRuns();
  } else if (toolsTab === "loadout") {
    el.innerHTML = `<div id="loadoutv" style="padding:22px"></div>`;
    renderLoadout();
  } else if (toolsTab === "ammo") {
    el.innerHTML = `<div id="ammov" style="padding:22px"></div>`;
    renderAmmo();
  }
}
